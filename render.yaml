# Plano de despliegue de Cookie Play para Render (https://render.com).
# En Render: New > Blueprint > elige este repositorio. Te pedira la contrasena.
# Este archivo debe estar en la raiz del repositorio para que Render lo lea.
services:
  - type: web
    name: cookie-play
    runtime: docker
    dockerfilePath: ./iptv/Dockerfile
    dockerContext: ./iptv
    plan: starter          # el plan gratuito no permite disco persistente
    region: frankfurt
    healthCheckPath: /login.html
    envVars:
      - key: ACCESS_PIN
        sync: false        # Render te la pide al crear el servicio
      - key: HOST
        value: 0.0.0.0
      # Opcional: si pones aqui tu lista, la app arranca ya configurada
      # (util sobre todo si no montas disco persistente).
      # - key: PLAYLIST_URL
      #   sync: false
      # - key: XTREAM_HOST
      #   sync: false
      # - key: XTREAM_USER
      #   sync: false
      # - key: XTREAM_PASS
      #   sync: false
    disk:
      name: datos
      mountPath: /app/data
      sizeGB: 1
