# Definición del proyecto para XcodeGen: evita tener que versionar el .xcodeproj,
# que es un archivo enorme e ilegible. Se regenera con un comando.
name: CookiePlay
options:
  bundleIdPrefix: com.cookieplay
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  CookiePlay:
    type: application
    platform: iOS
    sources:
      - path: CookiePlay
    info:
      path: CookiePlay/Info.plist
      properties:
        CFBundleDisplayName: Cookie Play
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Los paneles IPTV sirven por http sin cifrar: sin esto no se ve nada.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookieplay.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
