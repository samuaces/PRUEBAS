<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada (404) | Pizarra Táctica</title>
<meta name="description" content="La página que buscas no existe. Vuelve al inicio o abre directamente la pizarra táctica de fútbol.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070A0F">
<link rel="icon" href="https://klym.xyz/assets/img/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Outfit';src:url('https://klym.xyz/assets/fonts/outfit-latin-var.woff2') format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:'InterVar';src:url('https://klym.xyz/assets/fonts/inter-latin-var.woff2') format('woff2');font-weight:400 700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;
  background:#070A0F;color:#E8EEF6;font-family:'InterVar',system-ui,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 0%,rgba(225,26,65,.22),transparent 65%)}
.box{position:relative;z-index:1;max-width:560px}
.code{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(76px,16vw,132px);line-height:1;letter-spacing:-.05em;
  background:linear-gradient(100deg,#E7204A,#FF7A93);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:'Outfit',sans-serif;font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.02em;margin:14px 0 12px}
p{color:#93A4B8;margin:0 0 30px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;
  text-decoration:none;padding:14px 24px;border-radius:13px;border:1px solid transparent}
.p{background:#E11A41;color:#fff;box-shadow:0 22px 55px -26px rgba(225,26,65,.85)}
.s{background:#101823;border-color:rgba(255,255,255,.1);color:#E8EEF6}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Esta jugada se ha ido fuera</h1>
    <p>La página que buscabas no existe o ha cambiado de sitio. Puedes volver al inicio o saltar directamente a la pizarra.</p>
    <div class="row">
      <a class="btn p" href="https://klym.xyz/">Volver al inicio</a>
      <a class="btn s" href="https://klym.xyz/app/">Abrir la pizarra</a>
    </div>
  </div>
</body>
</html>
