<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pizarra Táctica de Fútbol | Dibuja tu jugada</title>
<meta name="description" content="Pizarra táctica de fútbol: coloca jugadores, dibuja pases, carreras, líneas y conos sobre un campo a escala. Gratis y sin registro.">
<link rel="canonical" href="https://samuaces.github.io/PRUEBAS/app/">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#0d1117">
<meta property="og:type" content="website">
<meta property="og:title" content="Pizarra Táctica de Fútbol">
<meta property="og:description" content="Coloca jugadores, dibuja pases y desmarques y monta tus ejercicios en el navegador. Gratis y sin registro.">
<meta property="og:url" content="https://samuaces.github.io/PRUEBAS/app/">
<meta property="og:image" content="https://samuaces.github.io/PRUEBAS/assets/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<style>
  #back-home {
    display: block; text-align: center; text-decoration: none;
    font-size: 11px; color: #8b949e; padding: 6px 0 2px;
  }
  #back-home:hover { color: #58a6ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; background: #0d1117; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: 200px;
    min-width: 200px;
    background: #161b22;
    border-right: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 8px;
    z-index: 10;
  }
  #sidebar h1 {
    font-size: 13px;
    color: #58a6ff;
    text-align: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #30363d;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .section-label {
    font-size: 10px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
    user-select: none;
  }
  .tool-btn:hover { background: #2d333b; border-color: #58a6ff; }
  .tool-btn.active { background: #1f4e7a; border-color: #58a6ff; color: #fff; }
  .tool-icon { font-size: 16px; width: 20px; text-align: center; }

  .add-btn {
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .add-home { background: #c0392b; color: #fff; }
  .add-home:hover { background: #e74c3c; }
  .add-away { background: #1a5276; color: #fff; }
  .add-away:hover { background: #2980b9; }
  .action-btn {
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }
  .action-btn:hover { background: #2d333b; }
  .clear-btn:hover { border-color: #f85149; color: #f85149; }

  /* COLOR PICKERS */
  .color-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .color-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .color-dot.active, .color-dot:hover { border-color: #fff; transform: scale(1.2); }

  .stroke-row { display: flex; gap: 4px; }
  .stroke-btn {
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    cursor: pointer;
    font-size: 10px;
    transition: all 0.15s;
  }
  .stroke-btn.active { border-color: #58a6ff; color: #58a6ff; }

  /* FIELD AREA */
  #field-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    position: relative;
    overflow: hidden;
  }

  #field-container {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }

  #field-svg {
    display: block;
  }

  #draw-canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  #draw-canvas.active {
    pointer-events: all;
    cursor: crosshair;
  }

  /* PLAYERS */
  .player {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    cursor: grab;
    user-select: none;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    transition: box-shadow 0.1s;
    z-index: 5;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .player:hover { box-shadow: 0 0 0 3px rgba(255,255,255,0.4), 0 2px 8px rgba(0,0,0,0.5); }
  .player.dragging { cursor: grabbing; box-shadow: 0 0 0 3px #fff, 0 4px 16px rgba(0,0,0,0.6); z-index: 100; }
  .player.home { background: radial-gradient(circle at 35% 35%, #e74c3c, #922b21); }
  .player.away { background: radial-gradient(circle at 35% 35%, #2980b9, #1a5276); }

  /* CONES */
  .cone {
    position: absolute;
    font-size: 20px;
    transform: translate(-50%, -50%);
    cursor: grab;
    user-select: none;
    z-index: 5;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .cone.dragging { cursor: grabbing; z-index: 100; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>⚽ PIZARRA TÁCTICA</h1>
  <a id="back-home" href="../">← Volver al inicio</a>

  <span class="section-label">Herramientas</span>
  <div class="tool-btn active" data-tool="select" onclick="setTool('select')">
    <span class="tool-icon">↖</span> Seleccionar
  </div>
  <div class="tool-btn" data-tool="arrow" onclick="setTool('arrow')">
    <span class="tool-icon">→</span> Flecha sólida
  </div>
  <div class="tool-btn" data-tool="dash-arrow" onclick="setTool('dash-arrow')">
    <span class="tool-icon">⇢</span> Flecha carrera
  </div>
  <div class="tool-btn" data-tool="line" onclick="setTool('line')">
    <span class="tool-icon">╱</span> Línea libre
  </div>
  <div class="tool-btn" data-tool="cone" onclick="setTool('cone')">
    <span class="tool-icon">📍</span> Cono
  </div>
  <div class="tool-btn" data-tool="eraser" onclick="setTool('eraser')">
    <span class="tool-icon">✕</span> Borrar trazo
  </div>

  <span class="section-label">Color trazo</span>
  <div class="color-row" id="color-row">
    <div class="color-dot active" data-color="#ffffff" style="background:#ffffff" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#f1c40f" style="background:#f1c40f" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#e74c3c" style="background:#e74c3c" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#2ecc71" style="background:#2ecc71" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#3498db" style="background:#3498db" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#e67e22" style="background:#e67e22" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#9b59b6" style="background:#9b59b6" onclick="setColor(this)"></div>
    <div class="color-dot" data-color="#1abc9c" style="background:#1abc9c" onclick="setColor(this)"></div>
  </div>

  <span class="section-label">Grosor</span>
  <div class="stroke-row">
    <div class="stroke-btn active" data-size="2" onclick="setSize(this)">Fino</div>
    <div class="stroke-btn" data-size="4" onclick="setSize(this)">Medio</div>
    <div class="stroke-btn" data-size="6" onclick="setSize(this)">Grueso</div>
  </div>

  <span class="section-label">Jugadores</span>
  <button class="add-btn add-home" onclick="addPlayer('home')">+ Local (Rojo)</button>
  <button class="add-btn add-away" onclick="addPlayer('away')">+ Visitante (Azul)</button>

  <span class="section-label">Acciones</span>
  <button class="action-btn" onclick="undoLast()">↩ Deshacer</button>
  <button class="action-btn clear-btn" onclick="clearAll()">🗑 Limpiar todo</button>
</div>

<div id="field-area">
  <div id="field-container">
    <!-- SVG FIELD -->
    <svg id="field-svg" viewBox="0 0 1050 680" xmlns="http://www.w3.org/2000/svg">
      <!-- Grass stripes -->
      <defs>
        <pattern id="stripes" x="0" y="0" width="60" height="680" patternUnits="userSpaceOnUse">
          <rect width="60" height="680" fill="#2d8a4e"/>
          <rect width="30" height="680" fill="#278046"/>
        </pattern>
      </defs>
      <!-- Field background -->
      <rect width="1050" height="680" fill="url(#stripes)"/>
      <!-- Field border -->
      <rect x="25" y="25" width="1000" height="630" fill="none" stroke="white" stroke-width="3"/>
      <!-- Halfway line -->
      <line x1="525" y1="25" x2="525" y2="655" stroke="white" stroke-width="3"/>
      <!-- Center circle -->
      <circle cx="525" cy="340" r="91.5" fill="none" stroke="white" stroke-width="3"/>
      <!-- Center spot -->
      <circle cx="525" cy="340" r="4" fill="white"/>
      <!-- Halfway spot (decorative) -->

      <!-- LEFT PENALTY AREA -->
      <rect x="25" y="172.5" width="165" height="335" fill="none" stroke="white" stroke-width="3"/>
      <!-- LEFT GOAL AREA -->
      <rect x="25" y="254" width="55" height="172" fill="none" stroke="white" stroke-width="3"/>
      <!-- LEFT PENALTY SPOT -->
      <circle cx="136" cy="340" r="4" fill="white"/>
      <!-- LEFT PENALTY ARC -->
      <path d="M 165 265 A 91.5 91.5 0 0 1 165 415" fill="none" stroke="white" stroke-width="3"/>
      <!-- LEFT CORNER ARCS -->
      <path d="M 25 50 A 25 25 0 0 1 50 25" fill="none" stroke="white" stroke-width="3"/>
      <path d="M 25 630 A 25 25 0 0 0 50 655" fill="none" stroke="white" stroke-width="3"/>

      <!-- RIGHT PENALTY AREA -->
      <rect x="860" y="172.5" width="165" height="335" fill="none" stroke="white" stroke-width="3"/>
      <!-- RIGHT GOAL AREA -->
      <rect x="970" y="254" width="55" height="172" fill="none" stroke="white" stroke-width="3"/>
      <!-- RIGHT PENALTY SPOT -->
      <circle cx="914" cy="340" r="4" fill="white"/>
      <!-- RIGHT PENALTY ARC -->
      <path d="M 885 265 A 91.5 91.5 0 0 0 885 415" fill="none" stroke="white" stroke-width="3"/>
      <!-- RIGHT CORNER ARCS -->
      <path d="M 1025 50 A 25 25 0 0 0 1000 25" fill="none" stroke="white" stroke-width="3"/>
      <path d="M 1025 630 A 25 25 0 0 1 1000 655" fill="none" stroke="white" stroke-width="3"/>

      <!-- LEFT GOAL -->
      <rect x="0" y="289" width="25" height="102" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
      <!-- RIGHT GOAL -->
      <rect x="1025" y="289" width="25" height="102" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
    </svg>

    <!-- Drawing canvas -->
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<script>
// ─── STATE ──────────────────────────────────────────────────────────────────
let currentTool = 'select';
let currentColor = '#ffffff';
let currentSize = 2;
let isDrawing = false;
let startX, startY;
let homeCount = 0, awayCount = 0;
let strokes = []; // { type, x1,y1,x2,y2, color, size, dash }
let liveStroke = null;
let players = []; // DOM elements
let cones = [];   // DOM elements

const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');
const fieldContainer = document.getElementById('field-container');
const fieldSvg = document.getElementById('field-svg');

// ─── RESIZE ─────────────────────────────────────────────────────────────────
function resizeField() {
  const area = document.getElementById('field-area');
  const areaW = area.clientWidth - 20;
  const areaH = area.clientHeight - 20;
  const ratio = 1050 / 680;
  let w = areaW, h = areaW / ratio;
  if (h > areaH) { h = areaH; w = h * ratio; }
  fieldSvg.setAttribute('width', w);
  fieldSvg.setAttribute('height', h);
  canvas.width = w;
  canvas.height = h;
  redrawCanvas();
}
window.addEventListener('resize', resizeField);
resizeField();

// ─── TOOLS ──────────────────────────────────────────────────────────────────
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
  const isDrawTool = ['arrow','dash-arrow','line'].includes(tool);
  canvas.classList.toggle('active', isDrawTool);
}

function setColor(el) {
  currentColor = el.dataset.color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function setSize(el) {
  currentSize = parseInt(el.dataset.size);
  document.querySelectorAll('.stroke-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ─── CANVAS COORDS ──────────────────────────────────────────────────────────
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

// ─── DRAWING ────────────────────────────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
  if (!['arrow','dash-arrow','line'].includes(currentTool)) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  isDrawing = true;
  startX = pos.x; startY = pos.y;
});

canvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  liveStroke = { x1: startX, y1: startY, x2: pos.x, y2: pos.y };
  redrawCanvas();
  drawStroke(liveStroke, currentTool, currentColor, currentSize, true);
});

canvas.addEventListener('pointerup', e => {
  if (!isDrawing) return;
  isDrawing = false;
  const pos = getCanvasPos(e);
  const dx = pos.x - startX, dy = pos.y - startY;
  if (Math.hypot(dx, dy) > 5) {
    strokes.push({ type: currentTool, x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor, size: currentSize });
  }
  liveStroke = null;
  redrawCanvas();
});

function drawStroke(s, type, color, size, preview = false) {
  const t = type || s.type;
  const c = color || s.color;
  const sz = size || s.size;

  ctx.save();
  ctx.strokeStyle = c;
  ctx.lineWidth = sz;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (t === 'dash-arrow') {
    ctx.setLineDash([10, 7]);
  } else {
    ctx.setLineDash([]);
  }

  const x1 = s.x1, y1 = s.y1, x2 = s.x2, y2 = s.y2;

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // Arrowhead for arrow tools
  if (t === 'arrow' || t === 'dash-arrow') {
    ctx.setLineDash([]);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = Math.min(18 + sz * 2, 30);
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes.forEach(s => drawStroke(s));
}

// ─── UNDO / CLEAR ───────────────────────────────────────────────────────────
function undoLast() {
  if (strokes.length > 0) {
    strokes.pop();
    redrawCanvas();
  } else if (players.length > 0) {
    const p = players.pop();
    p.remove();
  } else if (cones.length > 0) {
    const c = cones.pop();
    c.remove();
  }
}

function clearAll() {
  if (!confirm('¿Limpiar todo el campo?')) return;
  strokes = [];
  redrawCanvas();
  players.forEach(p => p.remove());
  players = [];
  cones.forEach(c => c.remove());
  cones = [];
  homeCount = 0;
  awayCount = 0;
}

// ─── PLAYERS ────────────────────────────────────────────────────────────────
function addPlayer(team) {
  const isHome = team === 'home';
  if (isHome) homeCount++; else awayCount++;
  const num = isHome ? homeCount : awayCount;

  const el = document.createElement('div');
  el.className = `player ${team}`;
  el.textContent = num;
  el.style.left = (canvas.width / 2 + (Math.random() - 0.5) * 200) + 'px';
  el.style.top = (canvas.height / 2 + (Math.random() - 0.5) * 100) + 'px';

  // Right-click to delete
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    el.remove();
    players = players.filter(p => p !== el);
  });

  makeDraggable(el, true);
  fieldContainer.appendChild(el);
  players.push(el);
}

// ─── CONES ──────────────────────────────────────────────────────────────────
function placeCone(x, y) {
  const el = document.createElement('div');
  el.className = 'cone';
  el.textContent = '🟠';
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    el.remove();
    cones = cones.filter(c => c !== el);
  });

  makeDraggable(el, false);
  fieldContainer.appendChild(el);
  cones.push(el);
}

// Click on field to place cone
fieldContainer.addEventListener('click', e => {
  if (currentTool !== 'cone') return;
  if (e.target.classList.contains('player') || e.target.classList.contains('cone')) return;
  const rect = fieldContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  placeCone(x, y);
});

// Eraser: click on stroke area (approximate)
canvas.addEventListener('click', e => {
  if (currentTool !== 'eraser') return;
  const pos = getCanvasPos(e);
  // Remove closest stroke within threshold
  let closestIdx = -1, closestDist = 15;
  strokes.forEach((s, i) => {
    const d = distToSegment(pos.x, pos.y, s.x1, s.y1, s.x2, s.y2);
    if (d < closestDist) { closestDist = d; closestIdx = i; }
  });
  if (closestIdx >= 0) {
    strokes.splice(closestIdx, 1);
    redrawCanvas();
  }
});

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// Enable eraser canvas click
canvas.addEventListener('click', e => {
  if (currentTool === 'eraser') {
    canvas.classList.add('active');
  }
});

// Sync canvas active state with eraser tool
const origSetTool = setTool;
window.setTool = function(tool) {
  origSetTool(tool);
  if (tool === 'eraser') canvas.classList.add('active');
  else if (!['arrow','dash-arrow','line'].includes(tool)) canvas.classList.remove('active');
};

// ─── DRAG & DROP ────────────────────────────────────────────────────────────
function makeDraggable(el, isPlayer) {
  let offsetX, offsetY, active = false;

  el.addEventListener('pointerdown', e => {
    if (currentTool !== 'select') return;
    e.preventDefault();
    e.stopPropagation();
    active = true;
    const rect = fieldContainer.getBoundingClientRect();
    const elX = parseFloat(el.style.left);
    const elY = parseFloat(el.style.top);
    offsetX = e.clientX - rect.left - elX;
    offsetY = e.clientY - rect.top - elY;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!active) return;
    e.preventDefault();
    const rect = fieldContainer.getBoundingClientRect();
    let x = e.clientX - rect.left - offsetX;
    let y = e.clientY - rect.top - offsetY;
    // Clamp within field
    const half = isPlayer ? 18 : 14;
    x = Math.max(half, Math.min(canvas.width - half, x));
    y = Math.max(half, Math.min(canvas.height - half, y));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });

  el.addEventListener('pointerup', e => {
    active = false;
    el.classList.remove('dragging');
  });
}
</script>
</body>
</html>
