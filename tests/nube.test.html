<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pruebas de la nube</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}
#out{white-space:pre;padding:10px;font-size:14px}</style></head>
<body>
<h1 style="font:700 16px system-ui;padding:10px 10px 0;margin:0">Pruebas de la biblioteca compartida</h1>
<p style="font:13px system-ui;color:#9aa;padding:0 10px;margin:6px 0">
  Aquí no hay Supabase de verdad: se le pone delante un servidor de mentira que responde
  como responde el suyo, y se comprueba que la aplicación le pide y le manda lo que debe.</p>
<div id="out">ejecutando…</div>

<script>
/* ---------------------------------------------------------------------------
   El Supabase de mentira. Guarda lo que le mandan y responde como PostgREST y
   GoTrue: mismos caminos, mismas cabeceras, mismos errores.
   --------------------------------------------------------------------------- */
var BASE = 'https://mentira.supabase.co';
var KEY  = 'clave-anon-de-mentira';
window.PT_NUBE = { url: BASE, key: KEY };

var servidor = {
  peticiones: [],
  usuario: { id: 'u-1', email: 'ana@ejemplo.com' },
  perfil:  { id: 'u-1', nombre: 'Ana Ruiz', club: 'CF Prueba', admin: false },
  ejercicios: [
    { id: 'e-1', autor: 'u-2', publicado: true, oculto: false, titulo: 'Rondo 5v2',
      pitch: 'f11', vista: 'area', momento: 'Calentamiento', categoria: 'Cadete',
      minutos: 12, objetivo: 'Circular rápido', ficha: { titulo: 'Rondo 5v2', objetivo: 'Circular rápido', duracion: '12 min' },
      doc: { pitch: 'f11', view: 'area', card: {}, frames: [{ objects: [], strokes: [] }] },
      aperturas: 3, creado: '2026-09-01', entrenadores: { nombre: 'Marta', club: 'CF Prueba' } }
  ],
  caduca: false,          // para probar la renovación del testigo
  correoSaturado: false,  // Supabase corta los envíos en el plan gratuito
  cuentas: { 'ana@ejemplo.com': 'secreta1' },
  exigeConfirmacion: false,
  reportes: [],
  borradas: [],
  ultimoId: 1,              // solo sube, como un uuid: nunca se reutiliza
  cofre: { sal: 'c2FsZGVwcnVlYmE=', maestra: 'bWFlc3RyYQ==', bloque: 'Ym9scXVl',
           version: 7, actualizado: '2026-09-17T10:00:00Z' }
};

var real = window.fetch;
window.fetch = function (url, opts) {
  opts = opts || {};
  url = String(url);
  var cuerpo = opts.body ? JSON.parse(opts.body) : null;
  var h = opts.headers || {};
  servidor.peticiones.push({ url: url, metodo: opts.method || 'GET', cuerpo: cuerpo, cabeceras: h });

  function da(estado, datos) {
    // Un 204 no admite cuerpo, ni siquiera vacío: el navegador lo rechaza.
    return Promise.resolve(new Response(
      estado === 204 || datos === undefined ? null : JSON.stringify(datos),
      { status: estado, headers: { 'Content-Type': 'application/json' } }));
  }
  if (url.indexOf(BASE) !== 0) return da(404, { message: 'fuera del servidor' });
  var ruta = url.slice(BASE.length);
  var aut = String(h.Authorization || '');

  // Con el testigo caducado, Supabase contesta 401 a todo menos a la renovación.
  if (servidor.caduca && aut.indexOf('Bearer t-1') === 0 &&
      ruta.indexOf('grant_type=refresh_token') < 0) {
    return da(401, { message: 'JWT expired' });
  }

  // --- GoTrue ---
  if (ruta.indexOf('/auth/v1/otp') === 0) {
    if (!cuerpo || !cuerpo.email) return da(400, { message: 'falta el correo' });
    if (servidor.correoSaturado) return da(429, { message: 'email rate limit exceeded' });
    return da(200, {});
  }
  if (ruta.indexOf('/auth/v1/token?grant_type=password') === 0) {
    if (!cuerpo || !cuerpo.email || !cuerpo.password)
      return da(400, { message: 'missing credentials' });
    if (!servidor.cuentas[cuerpo.email] || servidor.cuentas[cuerpo.email] !== cuerpo.password)
      return da(400, { message: 'Invalid login credentials' });
    return da(200, { access_token: 't-1', refresh_token: 'r-1', expires_in: 3600 });
  }
  if (ruta.indexOf('/auth/v1/signup') === 0) {
    if (!cuerpo || !cuerpo.email) return da(400, { message: 'falta el correo' });
    if (String(cuerpo.password || '').length < 6)
      return da(422, { message: 'Password should be at least 6 characters' });
    if (servidor.cuentas[cuerpo.email]) return da(422, { message: 'User already registered' });
    servidor.cuentas[cuerpo.email] = cuerpo.password;
    if (servidor.exigeConfirmacion) return da(200, { id: 'u-9', email: cuerpo.email });
    return da(200, { access_token: 't-1', refresh_token: 'r-1', expires_in: 3600 });
  }
  if (ruta.indexOf('/auth/v1/token?grant_type=refresh_token') === 0) {
    if (!cuerpo || cuerpo.refresh_token !== 'r-1') return da(400, { message: 'testigo inválido' });
    servidor.caduca = false;
    return da(200, { access_token: 't-2', refresh_token: 'r-1', expires_in: 3600 });
  }
  if (ruta.indexOf('/auth/v1/logout') === 0) return da(204);
  if (ruta.indexOf('/auth/v1/recover') === 0) {
    if (!cuerpo || cuerpo.email !== 'ana@ejemplo.com') return da(400, { message: 'User not found' });
    return da(200, {});
  }
  if (ruta.indexOf('/auth/v1/user') === 0) {
    if (servidor.caduca && aut.indexOf('t-1') > 0) return da(401, { message: 'caducado' });
    if (aut.indexOf('Bearer t-') < 0) return da(401, { message: 'sin sesión' });
    if (opts.method === 'PUT') {
      if (!cuerpo || String(cuerpo.password || '').length < 6)
        return da(422, { message: 'Password should be at least 6 characters' });
      servidor.clave = cuerpo.password;
      return da(200, servidor.usuario);
    }
    return da(200, servidor.usuario);
  }

  // --- PostgREST ---
  /* El cofre. Lo que importa de estas dos rutas es que la de «¿ha cambiado?»
     conteste SOLO el número: se pregunta cada pocos segundos y traerse el
     bloque entero para descubrir que no ha cambiado nada sería gastar la
     conexión de alguien por gusto. */
  if (ruta.indexOf('/rest/v1/cofres') === 0) {
    if (!servidor.cofre) return da(200, []);
    var pedido = (ruta.match(/select=([^&]*)/) || [, ''])[1].split(',');
    var fila = {};
    pedido.forEach(function (k) { if (k in servidor.cofre) fila[k] = servidor.cofre[k]; });
    return da(200, [fila]);
  }

  if (ruta.indexOf('/rest/v1/entrenadores') === 0) {
    if (opts.method === 'PATCH') {
      servidor.perfil.nombre = cuerpo.nombre; servidor.perfil.club = cuerpo.club;
      return da(200, [servidor.perfil]);
    }
    return da(200, [servidor.perfil]);
  }
  if (ruta.indexOf('/rest/v1/ejercicios') === 0) {
    if (opts.method === 'POST') {
      var nuevo = JSON.parse(JSON.stringify(cuerpo));
      /* Un contador que solo sube, como haría un uuid. Antes era
         «e-» + (cuántos hay), y al borrar una fila la siguiente volvía a
         nacer con el mismo identificador. Ninguna base de datos hace eso, y
         aquí escondía un fallo de verdad: la prueba de «si la fila ya no
         está, se vuelve a crear» no podía distinguir la nueva de la muerta. */
      nuevo.id = 'e-' + (++servidor.ultimoId);
      nuevo.entrenadores = { nombre: servidor.perfil.nombre, club: servidor.perfil.club };
      servidor.ejercicios.push(nuevo);
      return da(201, [nuevo]);
    }
    if (opts.method === 'PATCH') {
      var id = /id=eq\.([^&]+)/.exec(ruta)[1];
      /* Se aplica el cuerpo ENTERO, no solo «publicado». Guardar una pizarra
         que ya está en tu cuenta manda el título, el dibujo y la ficha, y con
         el servidor de antes esos cambios se perdían sin que nada fallara.
         Y si no encaja ninguna fila vuelve una lista vacía, que es lo que
         hace PostgREST y de lo que depende volver a crearla. */
      var tocadas = servidor.ejercicios.filter(function (e) { return e.id === id; });
      tocadas.forEach(function (e) {
        Object.keys(cuerpo).forEach(function (k) { e[k] = cuerpo[k]; });
      });
      return da(200, tocadas);
    }
    if (opts.method === 'DELETE') {
      var q = /id=eq\.([^&]+)/.exec(ruta)[1];
      servidor.ejercicios = servidor.ejercicios.filter(function (e) { return e.id !== q; });
      return da(204);
    }
    // lectura: se aplican los filtros que vengan en la dirección
    var filas = servidor.ejercicios.slice();
    var mAutor = /autor=eq\.([^&]+)/.exec(ruta);
    if (mAutor) filas = filas.filter(function (e) { return e.autor === mAutor[1]; });
    if (/publicado=eq\.true/.test(ruta)) filas = filas.filter(function (e) { return e.publicado; });
    var mP = /[?&]pitch=eq\.([^&]+)/.exec(ruta);
    if (mP) filas = filas.filter(function (e) { return e.pitch === decodeURIComponent(mP[1]); });
    var mM = /[?&]momento=eq\.([^&]+)/.exec(ruta);
    if (mM) filas = filas.filter(function (e) { return e.momento === decodeURIComponent(mM[1]); });
    var mB = /busca=ilike\.\*([^&*]*)\*/.exec(ruta);
    if (mB) {
      var t = decodeURIComponent(mB[1]);
      filas = filas.filter(function (e) { return (e.titulo + ' ' + e.objetivo).toLowerCase().indexOf(t) >= 0; });
    }
    return da(200, filas);
  }
  if (ruta.indexOf('/rest/v1/rpc/suma_apertura') === 0) {
    servidor.reportes.push('apertura:' + cuerpo.ej); return da(204);
  }
  /* Borrar la cuenta. Como en el servidor de verdad: no lleva a quién borrar
     —lo dice el testigo— y sin testigo no hace nada. Devuelve 204 y nada. */
  if (ruta.indexOf('/rest/v1/rpc/borra_mi_cuenta') === 0) {
    if (aut.indexOf('Bearer t-') < 0) return da(401, { message: 'sin sesión' });
    servidor.borradas.push(true);
    return da(204);
  }
  if (ruta.indexOf('/rest/v1/reportes') === 0) {
    if (servidor.reportes.indexOf('r:' + cuerpo.ejercicio) >= 0)
      return da(409, { message: 'duplicate key value violates unique constraint' });
    servidor.reportes.push('r:' + cuerpo.ejercicio);
    return da(201, [cuerpo]);
  }
  return da(404, { message: 'ruta desconocida: ' + ruta });
};
</script>

<!-- La sesión llega en el ancla, igual que al volver del enlace del correo.
     Y con el valor de un solo uso que la aplicación se guardó antes de mandar
     el correo: sin él, la vuelta se tira, que es justo lo que se prueba más
     abajo con una falsificada. -->
<script>
try { localStorage.removeItem('pt-nube'); } catch (e) {}
try { localStorage.setItem('pt-vuelta', JSON.stringify({ v: 'testigo-bueno', at: Date.now() })); } catch (e) {}
history.replaceState(null, '', location.pathname + '?v=testigo-bueno' +
  '#access_token=t-1&refresh_token=r-1&expires_in=3600&token_type=bearer');
</script>
<script src="../app/nube.js"></script>

<script>
var log = [], fails = 0;
function ok(n, c, x) { log.push((c ? 'PASA  ' : 'FALLA ') + n + (x ? '  (' + x + ')' : '')); if (!c) fails++; }
function ultima(fragmento) {
  for (var i = servidor.peticiones.length - 1; i >= 0; i--)
    if (servidor.peticiones[i].url.indexOf(fragmento) >= 0) return servidor.peticiones[i];
  return null;
}

(async function () {
  var N = window.PTNube;

  // ---- configuración y vuelta del correo ----
  ok('la nube se activa cuando hay configuración', N.hay());
  ok('recoge la sesión del enlace del correo', N.dentro());
  ok('y limpia la dirección del navegador', location.hash === '', JSON.stringify(location.hash));
  ok('la sesión sobrevive a recargar', !!JSON.parse(localStorage.getItem('pt-nube') || 'null'));

  // ---- perfil ----
  var yo = await N.quienSoy();
  ok('sabe quién eres', yo && yo.id === 'u-1' && yo.nombre === 'Ana Ruiz', yo && yo.nombre);
  ok('trae también tu correo para enseñarlo', yo && yo.email === 'ana@ejemplo.com');
  var pet = ultima('/auth/v1/user');
  ok('pregunta con tu testigo, no con la clave pública',
     pet.cabeceras.Authorization === 'Bearer t-1', pet.cabeceras.Authorization);
  ok('manda siempre la clave del proyecto', pet.cabeceras.apikey === KEY);

  await N.perfil({ nombre: 'Ana Torres', club: 'CD Nuevo' });
  ok('guardar el perfil lo cambia en el servidor', servidor.perfil.nombre === 'Ana Torres', servidor.perfil.nombre);
  ok('el perfil se guarda con PATCH sobre tu fila',
     ultima('/rest/v1/entrenadores').metodo === 'PATCH' &&
     /id=eq\.u-1/.test(ultima('/rest/v1/entrenadores').url));

  /* ---- el cofre: preguntar tiene que ser barato ----------------------------

     La aplicación pregunta cada pocos segundos si ha cambiado algo, para que
     el móvil encima de la mesa se entere de lo que acabas de hacer en el
     ordenador. Eso solo se puede hacer si preguntar cuesta un número. Si
     alguien «simplifica» esto y se trae la fila entera, una temporada de
     150 KB viajaría seis veces por minuto y por dispositivo. */
  var v = await N.versionCofre();
  ok('la versión del cofre se puede preguntar sola', v === 7, String(v));
  var q = ultima('/rest/v1/cofres');
  ok('y se pide SOLO la versión, no el cofre entero',
     /select=version(&|$)/.test(q.url), q.url.replace(BASE, ''));
  ok('preguntando por tu fila, no por todas', /id=eq\.u-1/.test(q.url));
  ok('con tu testigo', q.cabeceras.Authorization === 'Bearer t-1');

  var entero = await N.cofre();
  ok('y el cofre entero sí trae lo que hace falta para abrirlo',
     entero && entero.sal && entero.maestra && entero.bloque && entero.version === 7);

  servidor.cofre = null;
  ok('sin cofre todavía, la versión es null y no un error',
     (await N.versionCofre()) === null);
  servidor.cofre = { sal: 'c2FsZGVwcnVlYmE=', maestra: 'bWFlc3RyYQ==', bloque: 'Ym9scXVl',
                     version: 7, actualizado: '2026-09-17T10:00:00Z' };

  /* ---- subir la misma pizarra dos veces no la duplica ----------------------

     Desde que guardar sube sola, cada vez que guardas se llama a «publica» con
     el identificador de la fila que ya hay. Si eso creara una fila nueva, en
     un mes tendrías la misma pizarra treinta veces en tu cuenta, y al
     compartirla, treinta en la biblioteca común.

     Y el caso que estaba mal y no se veía: si esa fila YA NO ESTÁ —la borraste
     desde el otro dispositivo— el PATCH no encuentra nada y antes devolvía
     «undefined» tan tranquilo, dejando la pizarra sin subir para siempre,
     porque el identificador viejo seguía apuntando a una fila muerta. Ahora se
     vuelve a crear. */
  var antesDeSubir = servidor.ejercicios.length;
  var f1 = await N.publica({ pitch: 'f11', view: 'full', card: { titulo: 'Mi rondo' } },
                           { publicado: false });
  ok('guardar sube una fila privada', !!f1 && f1.publicado === false, JSON.stringify(f1 && f1.publicado));
  ok('y solo una', servidor.ejercicios.length === antesDeSubir + 1);

  var f2 = await N.publica({ pitch: 'f11', view: 'full', card: { titulo: 'Mi rondo' } },
                           { publicado: false, id: f1.id });
  ok('volver a guardarla actualiza la misma fila, no crea otra',
     servidor.ejercicios.length === antesDeSubir + 1 && f2.id === f1.id);

  var f3 = await N.publica({ pitch: 'f11', view: 'full', card: { titulo: 'Mi rondo' } },
                           { publicado: true, id: f1.id });
  ok('compartirla es esa misma fila, ahora pública',
     servidor.ejercicios.length === antesDeSubir + 1 && f3.id === f1.id && f3.publicado === true);

  // Y si la fila ya no está, se crea de nuevo en vez de perderse.
  var perdida = f1.id;
  servidor.ejercicios = servidor.ejercicios.filter(function (e) { return e.id !== perdida; });
  var f4 = await N.publica({ pitch: 'f11', view: 'full', card: { titulo: 'Mi rondo' } },
                           { publicado: false, id: perdida });
  ok('y si esa fila ya no existe, se vuelve a crear en vez de perderse',
     !!f4 && f4.id !== perdida && servidor.ejercicios.length === antesDeSubir + 1,
     f4 ? 'nueva fila ' + f4.id : 'no ha devuelto nada');

  // ---- la biblioteca común ----
  var lista = await N.lista({ pitch: 'f11' }, 0, 60);
  ok('trae los ejercicios compartidos', lista.length === 1 && lista[0].titulo === 'Rondo 5v2');
  ok('trae el nombre de quien lo hizo', lista[0].entrenadores.nombre === 'Marta');
  var q = ultima('/rest/v1/ejercicios?').url;
  ok('pide solo lo publicado y no escondido',
     /publicado=eq\.true/.test(q) && /oculto=eq\.false/.test(q));
  ok('pide lo más nuevo primero', /order=creado\.desc/.test(q));
  ok('la lista pública no necesita sesión',
     ultima('/rest/v1/ejercicios?').cabeceras.Authorization === 'Bearer ' + KEY);
  ok('pide de página en página', /^\d+-\d+$/.test(ultima('/rest/v1/ejercicios?').cabeceras.Range || ''),
     ultima('/rest/v1/ejercicios?').cabeceras.Range);

  // ---- los filtros se traducen a la consulta ----
  await N.lista({ pitch: 'futsal', momento: 'Balón parado', duracion: 'media', q: 'rondo' });
  var f = ultima('/rest/v1/ejercicios?').url;
  ok('la modalidad viaja al servidor', /pitch=eq\.futsal/.test(f));
  ok('el momento del juego también', /momento=eq\.Bal/.test(f), decodeURIComponent(f.match(/momento=eq\.[^&]+/)[0]));
  ok('la duración se convierte en un rango', /minutos=gte\.16/.test(f) && /minutos=lte\.25/.test(f));
  ok('el texto libre se busca sin distinguir mayúsculas', /busca=ilike\.\*rondo\*/.test(f));

  var corta = await N.lista({ duracion: 'corta' });
  ok('«hasta 15 min» es un tope, no un rango',
     /minutos=lte\.15/.test(ultima('/rest/v1/ejercicios?').url) &&
     !/minutos=gte/.test(ultima('/rest/v1/ejercicios?').url));

  // ---- compartir ----
  var doc = {
    pitch: 'f7', view: 'half',
    card: { titulo: 'Salida en 3', objetivo: 'Progresar por dentro', duracion: '18 min',
            momento: 'Ataque organizado', categoria: 'Infantil', material: '4 chinos' },
    frames: [{ objects: [{ id: 1, kind: 'player' }], strokes: [] }]
  };
  var subido = await N.publica(doc, { publicado: true });
  var envio = ultima('/rest/v1/ejercicios').cuerpo;
  ok('compartir sube la pizarra entera',
     envio.doc && envio.doc.frames.length === 1 && envio.doc.pitch === 'f7');
  ok('y firma con tu identidad, no con la que le digan', envio.autor === 'u-1', envio.autor);
  ok('saca el título de la ficha', envio.titulo === 'Salida en 3');
  ok('saca los minutos del texto de la duración', envio.minutos === 18, String(envio.minutos));
  ok('copia modalidad y vista', envio.pitch === 'f7' && envio.vista === 'half');
  ok('copia el momento y la categoría para poder filtrar',
     envio.momento === 'Ataque organizado' && envio.categoria === 'Infantil');
  ok('guarda la ficha entera aparte', envio.ficha.material === '4 chinos');
  ok('lo sube ya compartido cuando se lo pides', envio.publicado === true);
  ok('el servidor devuelve la fila creada', !!(subido && subido.id), subido && subido.id);
  ok('compartir sí va con tu sesión',
     ultima('/rest/v1/ejercicios').cabeceras.Authorization === 'Bearer t-1');

  // Un «0 min» escrito por despiste hacía fallar la subida entera: la base de
  // datos solo admite de 1 a 240 minutos.
  await N.publica({ pitch: 'f11', card: { titulo: 'Cero', duracion: '0 min' }, frames: [] }, {});
  ok('una duración de cero no se manda como cero',
     ultima('/rest/v1/ejercicios').cuerpo.minutos === null,
     String(ultima('/rest/v1/ejercicios').cuerpo.minutos));
  await N.publica({ pitch: 'f11', card: { titulo: 'Larga', duracion: '900 min' }, frames: [] }, {});
  ok('y una desmesurada se recorta al tope',
     ultima('/rest/v1/ejercicios').cuerpo.minutos === 240,
     String(ultima('/rest/v1/ejercicios').cuerpo.minutos));
  await N.publica({ pitch: 'f11', card: { titulo: '   Con espacios   ' }, frames: [] }, {});
  ok('el título se manda sin espacios de sobra',
     ultima('/rest/v1/ejercicios').cuerpo.titulo === 'Con espacios',
     JSON.stringify(ultima('/rest/v1/ejercicios').cuerpo.titulo));

  var sinTitulo = await N.publica({ pitch: 'f11', card: {}, frames: [] }, {});
  ok('sin título no se queda en blanco', ultima('/rest/v1/ejercicios').cuerpo.titulo.length > 0,
     ultima('/rest/v1/ejercicios').cuerpo.titulo);
  ok('sin duración escrita, minutos va vacío', ultima('/rest/v1/ejercicios').cuerpo.minutos === null);

  // ---- los tuyos ----
  /* Se coge la fila por su identificador, no por su sitio en la lista ni por
     un «e-2» escrito a mano. Eso se rompió en cuanto otra prueba de más
     arriba creó una fila: un identificador literal en una prueba es una
     atadura que no comprueba nada y que se cae sola. */
  var miaTuya = servidor.ejercicios[1];
  miaTuya.autor = 'u-1';
  var mios = await N.mios();
  ok('«mías» pide solo las tuyas', /autor=eq\.u-1/.test(ultima('/rest/v1/ejercicios?').url));
  ok('y no filtra por publicado: también salen las que no compartes',
     !/publicado=eq\.true/.test(ultima('/rest/v1/ejercicios?').url));

  await N.cambiaPublicado(miaTuya.id, false);
  ok('retirar deja de compartirlo',
     servidor.ejercicios.filter(function (e) { return e.id === miaTuya.id; })[0].publicado === false,
     miaTuya.id);

  // ---- reportar ----
  await N.reporta('e-1', 'no es un ejercicio');
  ok('reportar manda el ejercicio y quién avisa',
     ultima('/rest/v1/reportes').cuerpo.ejercicio === 'e-1' &&
     ultima('/rest/v1/reportes').cuerpo.quien === 'u-1');
  var repetido = await N.reporta('e-1', '').then(function () { return null; }, function (e) { return e; });
  ok('reportar dos veces lo mismo da error, no un aviso falso', !!repetido);

  // ---- contar aperturas ----
  await N.apertura('e-1');
  ok('abrir uno de otro suma una apertura',
     servidor.reportes.indexOf('apertura:e-1') >= 0);

  // ---- renovación del testigo ----
  servidor.caduca = true;
  var mios2 = await N.mios();
  ok('si el testigo caduca lo renueva sin que se note', Array.isArray(mios2), typeof mios2);
  ok('y para eso llama a la renovación', !!ultima('grant_type=refresh_token'));
  ok('la sesión guardada se queda con el testigo nuevo',
     JSON.parse(localStorage.getItem('pt-nube')).access_token === 't-2',
     JSON.parse(localStorage.getItem('pt-nube')).access_token);
  ok('y reintenta la petición que había fallado, ya con el testigo bueno',
     ultima('/rest/v1/ejercicios?').cabeceras.Authorization === 'Bearer t-2',
     ultima('/rest/v1/ejercicios?').cabeceras.Authorization);

  // ---- entrar y crear cuenta, sin un solo correo ----
  await N.sale();
  var mala = await N.entra('ana@ejemplo.com', 'noesesta').then(function () { return null; },
                                                                   function (e) { return e; });
  ok('una contraseña que no es, se dice claro',
     !!mala && /no coinciden/.test(mala.message), mala && mala.message);

  ok('con la buena se entra al instante, sin correos',
     await N.entra('ana@ejemplo.com', 'secreta1').then(function () { return N.dentro(); }));
  ok('y no se ha mandado ningún correo', !ultima('/auth/v1/otp'));

  // ---- recuperar y cambiar la contraseña ----
  // Sin esto, quien olvida su contraseña pierde su biblioteca de la nube para
  // siempre: no hay otra manera de volver a entrar.
  await N.sale();
  ok('se puede pedir recuperar la contraseña',
     await N.recupera('ana@ejemplo.com').then(function () { return true; }, function () { return false; }));
  var pr = ultima('/auth/v1/recover');
  ok('el «volver a» viaja en la dirección, no en el cuerpo',
     /redirect_to=/.test(pr.url) && !(pr.cuerpo && pr.cuerpo.redirect_to), pr.url);
  ok('y devuelve a la aplicación, que es donde está la cuenta',
     /%2F[^&]*$/.test(pr.url) || /redirect_to=http/.test(pr.url),
     decodeURIComponent((pr.url.split('redirect_to=')[1] || '')));
  var sinCuenta = await N.recupera('nadie@ejemplo.com').then(function () { return null; },
                                                             function (e) { return e; });
  ok('un correo sin cuenta se explica en cristiano',
     !!sinCuenta && /no hay ninguna cuenta/i.test(sinCuenta.message), sinCuenta && sinCuenta.message);

  var sinSesion = await N.cambiaClave('loquesea').then(function () { return null; },
                                                       function (e) { return e; });
  ok('sin sesión no se puede cambiar la contraseña', !!sinSesion, sinSesion && sinSesion.message);

  await N.entra('ana@ejemplo.com', 'secreta1');
  var corta = await N.cambiaClave('123').then(function () { return null; }, function (e) { return e; });
  ok('una contraseña corta la rechaza el servidor y se traduce',
     !!corta && /al menos 6/.test(corta.message), corta && corta.message);
  await N.cambiaClave('secreta9');
  ok('con la sesión abierta, la contraseña se cambia', servidor.clave === 'secreta9', servidor.clave);
  ok('y se cambia con PUT sobre tu usuario', ultima('/auth/v1/user').metodo === 'PUT');

  await N.sale();
  var alta = await N.entraOCrea('nuevo@club.com', 'secreta2', 'Nuevo');
  ok('un correo desconocido crea la cuenta y entra', alta.dentro && alta.nueva === true);
  ok('la cuenta nueva guarda el nombre para firmar',
     ultima('/auth/v1/signup').cuerpo.data.nombre === 'Nuevo');

  await N.sale();
  var repe = await N.entraOCrea('nuevo@club.com', 'secreta2', 'Nuevo');
  ok('la segunda vez ya solo entra, no crea nada', repe.dentro && repe.nueva === false);

  var corta = await N.registra('otro@club.com', '123').then(function () { return null; },
                                                            function (e) { return e; });
  ok('una contraseña corta se explica antes de mandarla',
     !!corta && /6 caracteres/.test(corta.message), corta && corta.message);

  // Si el proyecto exige confirmar el correo, hay que decir exactamente eso.
  servidor.exigeConfirmacion = true;
  var conf = await N.registra('confirmame@club.com', 'secreta3').then(function () { return null; },
                                                                      function (e) { return e; });
  ok('si el proyecto exige confirmar, se dice y se dice dónde apagarlo',
     !!conf && conf.confirmacion === true && /Confirm email/.test(conf.message));
  servidor.exigeConfirmacion = false;

  await N.entra('ana@ejemplo.com', 'secreta1');
  await N.sale();
  ok('salir cierra la sesión', !N.dentro());

  /* ---------- 8 · el consentimiento y el borrado de la cuenta ----------

     Lo que se prueba aquí no es que la casilla se marque, sino que el sí viaja
     DENTRO del registro. Si fuera una llamada aparte de después, entre una cosa
     y la otra cabe una cuenta creada sin aceptar nada: se corta la red, se
     cierra la pestaña. Ese es el caso que no puede quedar a medias. */
  await N.registra('conconsentimiento@club.com', 'secreta4', 'Quique', true);
  var alta1 = ultima('/auth/v1/signup');
  ok('el sí a las condiciones viaja dentro del propio registro',
     !!alta1.cuerpo.data && alta1.cuerpo.data.acepto === 'si', JSON.stringify(alta1.cuerpo.data));
  /* Y viaja como un sí pelado, no como un número de versión: qué versión se
     acepta lo decide el servidor. Si lo dijera el navegador, cualquiera podría
     anotarse una versión futura y no volver a ver nunca la pregunta. */
  ok('pero no dice QUÉ versión acepta: eso lo pone el servidor',
     !/\d{4}-\d{2}/.test(String(alta1.cuerpo.data.acepto)), alta1.cuerpo.data.acepto);
  await N.sale();

  await N.registra('sinconsentimiento@club.com', 'secreta5', 'Rosa');
  ok('sin decir que sí, no se manda ningún consentimiento',
     ultima('/auth/v1/signup').cuerpo.data.acepto === '');
  await N.sale();

  ok('la aplicación sabe qué versión de las condiciones enseña',
     /^\d{4}-\d{2}-[a-z]$/.test(String(N.condiciones)), N.condiciones);

  // Borrar la cuenta.
  var sinEntrar = await N.borraCuenta().then(function () { return null; }, function (e) { return e; });
  ok('sin sesión no se puede pedir el borrado', !!sinEntrar, sinEntrar && sinEntrar.message);
  ok('y no se ha llamado al servidor siquiera', servidor.borradas.length === 0);

  await N.entra('ana@ejemplo.com', 'secreta1');
  servidor.peticiones.length = 0;
  var borrada = await N.borraCuenta();
  var llamada = ultima('/rest/v1/rpc/borra_mi_cuenta');
  ok('con sesión, se borra', borrada === true && servidor.borradas.length === 1);
  ok('se pide por POST a la función del servidor', llamada.metodo === 'POST');
  /* El cuerpo tiene que ser un objeto vacío, no la cadena "{}" entrecomillada:
     «pide» ya convierte a JSON lo que se le da, y pasarle texto lo convertía
     dos veces. PostgREST contesta 404 a eso y el borrado no llegaba a pasar. */
  ok('con un cuerpo vacío de verdad, no con texto entrecomillado',
     llamada.cuerpo && typeof llamada.cuerpo === 'object' &&
     Object.keys(llamada.cuerpo).length === 0, JSON.stringify(llamada.cuerpo));
  /* No lleva a quién borrar. Es lo que hace imposible borrar la cuenta de otro
     por mucho que se manipule el navegador: la decide el testigo. */
  ok('y sin decir a quién: lo decide el testigo, no el navegador',
     !/id|user|uid|email/i.test(JSON.stringify(llamada.cuerpo || {})));
  ok('después del borrado, aquí no queda sesión', !N.dentro());
  var guardado = null;
  try { guardado = localStorage.getItem('pt-nube'); } catch (e) {}
  ok('ni guardada en el almacén del navegador', guardado === null, String(guardado));
  ok('y no deja rastro en el navegador', !localStorage.getItem('pt-nube'));

  var falla = await N.publica({ pitch: 'f11', card: {}, frames: [] }, {})
    .then(function () { return null; }, function (e) { return e; });
  ok('sin sesión, compartir avisa en vez de fallar en silencio',
     !!falla && /correo/i.test(falla.message), falla && falla.message);

  // ---- errores del servidor ----
  var previo = window.fetch;
  window.fetch = function () { return Promise.reject(new Error('sin red')); };
  var caido = await N.lista({}).then(function () { return null; }, function (e) { return e; });
  ok('si el servidor no contesta, la promesa falla y no cuelga', !!caido);
  window.fetch = previo;

  /* ---- la vuelta del correo no se acepta de cualquiera ------------------

     Antes, nube.js recogía CUALQUIER ancla que trajera un «access_token». Con
     eso, mandándote

         https://klym.xyz/app/#access_token=<el mío>&type=recovery

     quedabas dentro de MI cuenta sin enterarte: el ancla se borra de la barra
     al instante. Lo que compartieras se publicaba a mi nombre y yo lo podía
     editar o borrar; y con «type=recovery» te llevaba además a escribir una
     contraseña nueva en mi cuenta.

     Ahora la ida y la vuelta van atadas por un valor de un solo uso. Esto lo
     comprueba cargando nube.js otra vez en un banco aparte, porque recogeVuelta
     se ejecuta una sola vez al cargar el módulo. */
  var guardadaAntes = localStorage.getItem('pt-nube');
  async function vueltaDe(modo) {
    var m = document.createElement('iframe');
    m.style.cssText = 'position:fixed;left:-9999px;width:400px;height:300px';
    var ancla = '#access_token=ROBADO&refresh_token=r-x&expires_in=3600&type=recovery';
    m.src = 'vuelta.html?modo=' + modo + '&v=testigo-x' + ancla;
    document.body.appendChild(m);
    await new Promise(function (res) { m.onload = res; setTimeout(res, 4000); });
    await new Promise(function (res) { setTimeout(res, 120); });
    var r = null;
    try { r = m.contentWindow.RESULTADO; } catch (e) {}
    m.remove();
    return r || { dentro: null };
  }

  var buena = await vueltaDe('buena');
  ok('la vuelta que pidió la propia aplicación sí entra',
     buena.dentro === true && buena.guardada === true, JSON.stringify(buena && buena.dentro));
  ok('y es de recuperación, para que te pida una contraseña nueva',
     !!buena.vuelta && buena.vuelta.recuperando === true);

  var falsa = await vueltaDe('falsa');
  ok('una vuelta que nadie pidió NO entra: es la cuenta de otro',
     falsa.dentro === false && falsa.guardada === false, JSON.stringify(falsa));
  ok('y tampoco deja el testigo de nadie en la barra del navegador',
     falsa.ancla === '', JSON.stringify(falsa.ancla));

  var caducada = await vueltaDe('caducada');
  ok('una vuelta de hace dos horas ya no vale', caducada.dentro === false);

  var otro = await vueltaDe('otro');
  ok('ni una con un valor que no es el que se pidió', otro.dentro === false);

  // El valor es de un solo uso: repetir el mismo enlace ya no entra.
  var repe = await vueltaDe('falsa');
  ok('y el valor se gasta: el mismo enlace no sirve dos veces', repe.dentro === false);

  try { if (guardadaAntes) localStorage.setItem('pt-nube', guardadaAntes); } catch (e) {}

  document.getElementById('out').textContent =
    log.join('\n') + '\n\nRESULTADO: ' + (fails ? fails + ' FALLOS' : 'TODO CORRECTO (' + log.length + ' comprobaciones)');
  document.title = fails ? 'FALLOS' : 'OK';
})().catch(function (e) {
  var ult = servidor.peticiones.slice(-4).map(function (p) {
    return p.metodo + ' ' + p.url.replace(BASE, '') + '  cuerpo=' + JSON.stringify(p.cuerpo);
  }).join('\n');
  document.getElementById('out').textContent = log.join('\n') + '\n\nEXCEPCION: ' + e.message +
    '\n\nÚLTIMAS PETICIONES:\n' + ult + '\n' + e.stack;
  document.title = 'FALLOS';
});
</script>
</body></html>
