<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pruebas de la pizarra</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}
iframe{width:1200px;height:820px;border:0}#out{white-space:pre;padding:10px;font-size:14px}</style></head>
<body>
<h1 style="font:700 16px system-ui;padding:10px 10px 0;margin:0">Pruebas de la pizarra táctica</h1>
<p style="font:13px system-ui;color:#9aa;padding:0 10px;margin:6px 0">Sirve el repositorio (<code>python3 -m http.server</code>) y abre este archivo. Se ejecuta solo.</p>
<div id="out">ejecutando…</div><iframe id="fr"></iframe>
<script>
/* La pizarra guarda lo suyo en el navegador: pt-autosave, pt-prefs, pt-boards,
   pt-catalogo, pt-nube. Si no se limpia, la segunda pasada arranca con lo que
   dejó la primera —la modalidad cambiada a sala, la ficha ya rellena— y fallan
   pruebas que no tienen nada que ver con lo que se está comprobando. Se limpia
   ANTES de cargar la aplicación, por eso el iframe no trae src en el HTML. */
try{ Object.keys(localStorage).filter(function(k){return k.indexOf('pt-')===0;})
       .forEach(function(k){localStorage.removeItem(k);}); }catch(e){}
var log=[],fails=0;
function ok(n,c,x){log.push((c?'PASA  ':'FALLA ')+n+(x?'  ('+x+')':''));if(!c)fails++;}
function raf(){return new Promise(function(r){setTimeout(r,70);});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var fr=document.getElementById('fr'),errors=[],arrancado=false;
fr.addEventListener('load',function(){var w=fr.contentWindow,d=fr.contentDocument;
  /* Un iframe sin src carga about:blank y también avisa: solo cuenta la carga
     que trae la pizarra dentro, y solo una vez. */
  if(arrancado||!d||!d.getElementById('board'))return; arrancado=true;
  w.addEventListener('error',function(e){errors.push(e.message);});
  run(w,d).catch(function(e){log.push('EXCEPCION: '+e.message);fails++;}).then(report);});
fr.src='../app/';
function px(cv,x,y){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  return c.getImageData(Math.round(x*dpr),Math.round(y*dpr),1,1).data;}
function pointerAt(w,el,x,y,t){var r=el.getBoundingClientRect();
  el.dispatchEvent(new w.PointerEvent(t,{clientX:r.left+x,clientY:r.top+y,bubbles:true,pointerId:1,isPrimary:true,buttons:1}));}
function region(cv,x,y,s){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  var d=c.getImageData(Math.round((x-s)*dpr),Math.round((y-s)*dpr),Math.round(2*s*dpr),Math.round(2*s*dpr)).data;
  var sum=0;for(var i=0;i<d.length;i+=4)sum+=d[i]+d[i+1]+d[i+2];return sum;}
async function run(w,d){
  await wait(400);
  var cv=d.getElementById('board');
  ok('el canvas existe y tiene tamaño',!!cv&&cv.width>200,cv?cv.width+'x'+cv.height:'no');
  var p=px(cv,cv.clientWidth/2,cv.clientHeight/2);
  ok('el campo se dibuja en verde',p[1]>p[0]&&p[1]>p[2]&&p[1]>40,'rgb('+p[0]+','+p[1]+','+p[2]+')');
  ok('la línea de tiempo arranca con 1 fotograma',d.getElementById('frames').children.length===2);
  ok('el 4-3-3 inicial pinta jugadores',region(cv,cv.clientWidth*0.10,cv.clientHeight*0.5,26)>0);
  var before=region(cv,300,620,22);
  d.querySelector('[data-place="cone"]').click(); await raf();
  ok('la herramienta de colocar queda activa',d.querySelector('[data-place="cone"]').getAttribute('aria-pressed')==='true');
  pointerAt(w,cv,300,620,'pointerdown');pointerAt(w,cv,300,620,'pointerup');await raf();
  ok('al tocar el campo se coloca el cono',region(cv,300,620,22)!==before);
  var mats=['goal','hurdle','ladder','dummy','ring','flag','pole','disc','minigoal','ball','player'],okM=true,det='';
  for(var i=0;i<mats.length;i++){var b=d.querySelector('[data-place="'+mats[i]+'"]');
    if(!b){okM=false;det+=mats[i]+' sin botón; ';continue;} b.click();
    var X=200+i*66,Y=120,pre=region(cv,X,Y,24);
    pointerAt(w,cv,X,Y,'pointerdown');pointerAt(w,cv,X,Y,'pointerup');await raf();
    if(region(cv,X,Y,24)===pre){okM=false;det+=mats[i]+' no pinta; ';}}
  ok('los 11 elementos colocables se dibujan',okM,det);
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,300,620,'pointerdown');await raf();
  ok('el inspector aparece al seleccionar',d.getElementById('inspector').classList.contains('show'));
  pointerAt(w,cv,430,530,'pointermove');pointerAt(w,cv,430,530,'pointerup');await raf();
  ok('arrastrar mueve el objeto',region(cv,430,530,22)!==region(cv,700,620,22));
  var tools=['pass','run','dribble','free'],okT=true,dt='';
  for(var t=0;t<tools.length;t++){d.querySelector('[data-tool="'+tools[t]+'"]').click();await raf();
    var y0=300+t*60,pre=region(cv,700,y0,26);
    pointerAt(w,cv,600,y0+20,'pointerdown');
    for(var k=1;k<=8;k++)pointerAt(w,cv,600+k*26,y0+20-k*4,'pointermove');
    pointerAt(w,cv,810,y0-12,'pointerup');await raf();
    if(region(cv,700,y0,26)===pre){okT=false;dt+=tools[t]+' no pinta; ';}}
  ok('las 4 herramientas de trazo dibujan',okT,dt);
  d.querySelector('[data-tool="zone"]').click();await raf();
  var pz=region(cv,300,250,30);
  pointerAt(w,cv,240,200,'pointerdown');pointerAt(w,cv,380,310,'pointermove');pointerAt(w,cv,380,310,'pointerup');await raf();
  ok('la zona sombreada se dibuja',region(cv,300,250,30)!==pz);
  d.querySelector('.frame.add').click();await raf();
  ok('añadir fotograma crea el segundo',d.getElementById('frames').children.length===3);
  ok('el botón de reproducir se habilita',!d.getElementById('play').disabled);
  d.querySelector('[data-tool="select"]').click();
  var jx=cv.clientWidth*0.10,jy=cv.clientHeight*0.5;
  pointerAt(w,cv,jx,jy,'pointerdown');pointerAt(w,cv,jx+160,jy+40,'pointermove');pointerAt(w,cv,jx+160,jy+40,'pointerup');await raf();
  d.getElementById('play').click();await wait(300);
  ok('la animación arranca',d.getElementById('progress').classList.contains('show'));
  var w1=d.querySelector('#progress i').style.width;await wait(500);
  ok('la animación avanza',w1!==d.querySelector('#progress i').style.width,w1+' -> '+d.querySelector('#progress i').style.width);
  await wait(1800);
  ok('la animación termina sola',!d.getElementById('progress').classList.contains('show'));
  ok('deshacer está disponible',!d.getElementById('undo').disabled);
  d.getElementById('undo').click();await raf();
  ok('rehacer se habilita tras deshacer',!d.getElementById('redo').disabled);
  d.getElementById('redo').click();await raf();
  var sel=d.getElementById('form-away');sel.value='4-4-2';
  sel.dispatchEvent(new w.Event('change',{bubbles:true}));await raf();
  ok('la formación visitante coloca jugadores',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);
  d.querySelector('[data-view="half"]').click();await wait(150);
  ok('el medio campo se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="blank"]').click();await wait(150);
  ok('la superficie libre se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="full"]').click();await wait(150);
  var threw=null,got=false,old=w.HTMLCanvasElement.prototype.toBlob;
  w.HTMLCanvasElement.prototype.toBlob=function(cb){got=true;try{cb(new w.Blob(['x']));}catch(e){}};
  try{d.getElementById('ex-png').click();}catch(e){threw=e.message;}
  await wait(450);
  w.HTMLCanvasElement.prototype.toBlob=old;
  ok('exportar a PNG no lanza errores',!threw&&got,threw||'');
  // La pizarra corre dentro de un iframe, donde el navegador bloquea las descargas:
  // debe recurrir al diálogo que muestra el archivo para copiarlo a mano.
  d.getElementById('ex-json').click(); await wait(500);
  var fdlg=d.getElementById('dlg-file');
  ok('exportar a JSON embebido abre el diálogo de archivo',fdlg.open);
  ok('el diálogo trae el JSON de la pizarra',
     (d.getElementById('file-text').value||'').indexOf('"frames"')>0,
     (d.getElementById('file-text').value||'').slice(0,40));
  d.querySelector('#dlg-file [data-close]').click(); await raf();
  d.getElementById('help').click();await raf();
  ok('el diálogo de ayuda se abre',d.getElementById('dlg-help').open);
  d.querySelector('#dlg-help [data-close]').click();await raf();
  ok('el diálogo se cierra',!d.getElementById('dlg-help').open);
  d.querySelector('[data-place="text"]').click();await raf();
  pointerAt(w,cv,500,240,'pointerdown');pointerAt(w,cv,500,240,'pointerup');await raf();
  ok('colocar texto abre el diálogo propio',d.getElementById('dlg-ask').open);
  var pt=region(cv,500,240,40);
  d.getElementById('ask-input').value='Presión alta';
  d.getElementById('ask-ok').click();await raf();
  ok('el texto se escribe en el campo',region(cv,500,240,40)!==pt);
  ok('el diálogo se cierra al aceptar',!d.getElementById('dlg-ask').open);

  d.querySelector('[data-tool="select"]').click();
  d.getElementById('clear').click();await raf();
  ok('vaciar pide confirmación en un diálogo',d.getElementById('dlg-ask').open);
  d.querySelector('#dlg-ask [data-close]').click();await raf();
  ok('cancelar no vacía el fotograma',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);

  var lp=d.getElementById('loop');
  lp.click();await raf();
  ok('el bucle se activa como interruptor',lp.getAttribute('aria-pressed')==='true');
  lp.click();await raf();
  var sp=d.getElementById('speed'),v0=sp.textContent;
  sp.click();await raf();
  ok('la velocidad cambia al pulsarla',sp.textContent!==v0,v0+' -> '+sp.textContent);

  // giro: ahora TODO el material se puede girar
  var rotables=['cone','disc','pole','ring','flag','goal','minigoal','hurdle','ladder','dummy'];
  var okRot=true,dr='';
  for(var r0=0;r0<rotables.length;r0++){
    d.querySelector('[data-place="'+rotables[r0]+'"]').click();await raf();
    var RX=260+r0*62,RY=560;
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    d.querySelector('[data-tool="select"]').click();await raf();
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    var rb=d.querySelector('#inspector [data-rot="90"]');
    if(!rb){okRot=false;dr+=rotables[r0]+' sin botón de giro; ';continue;}
    var pre=region(cv,RX,RY,30);
    rb.click();await raf();
    if(region(cv,RX,RY,30)===pre){okRot=false;dr+=rotables[r0]+' no cambia al girar; ';}
  }
  ok('las 10 piezas de material se pueden girar',okRot,dr);

  // la página no debe poder desplazarse
  var scrollable=await new Promise(function(res){
    w.scrollTo(0,300);
    setTimeout(function(){res(w.scrollY!==0||d.documentElement.scrollHeight>d.documentElement.clientHeight+1);},60);
  });
  ok('la pantalla de la pizarra no hace scroll',!scrollable,
     'scrollY='+w.scrollY+' alto='+d.documentElement.scrollHeight+'/'+d.documentElement.clientHeight);

  // --- zoom con dos dedos ---
  function two(type,a,b2){
    var r=cv.getBoundingClientRect();
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+a[0],clientY:r.top+a[1],pointerId:11,isPrimary:true,bubbles:true,buttons:1}));
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+b2[0],clientY:r.top+b2[1],pointerId:12,isPrimary:false,bubbles:true,buttons:1}));
  }
  var zbtn=d.getElementById('zoom');
  ok('el botón de ajustar está oculto al inicio',zbtn.hidden);
  var antes=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  two('pointerdown',[380,300],[520,300]);
  two('pointermove',[300,300],[600,300]);
  await raf();
  ok('el pellizco acerca el campo',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==antes);
  ok('aparece el botón de ver el campo entero',!zbtn.hidden);
  two('pointerup',[300,300],[600,300]);
  await raf();
  var conZoom=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  zbtn.click();await raf();
  ok('ajustar devuelve la vista completa',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==conZoom&&zbtn.hidden);

  // tras el gesto se debe poder seguir dibujando con un dedo
  d.querySelector('[data-tool="pass"]').click();await raf();
  var pz=region(cv,500,250,30);
  pointerAt(w,cv,430,290,'pointerdown');
  for(var q=1;q<=6;q++)pointerAt(w,cv,430+q*24,290-q*8,'pointermove');
  pointerAt(w,cv,580,240,'pointerup');await raf();
  ok('después del pellizco se sigue dibujando con un dedo',region(cv,500,250,30)!==pz);

  // --- modalidades de campo ---
  var modal=[['f7','Fútbol 7'],['futsal','Fútbol sala'],['f11','Fútbol 11']];
  var okMod=true,dm='';
  for(var mi=0;mi<modal.length;mi++){
    d.querySelector('[data-pitch="'+modal[mi][0]+'"]').click();
    await wait(200);
    var c0=px(cv,cv.clientWidth/2,cv.clientHeight/2);
    if(!(c0[0]+c0[1]+c0[2]>60)){okMod=false;dm+=modal[mi][0]+' no pinta; ';}
    if(d.querySelector('[data-pitch="'+modal[mi][0]+'"]').getAttribute('aria-pressed')!=='true'){okMod=false;dm+=modal[mi][0]+' sin marcar; ';}
  }
  ok('las tres modalidades de campo se dibujan',okMod,dm);

  d.querySelector('[data-pitch="futsal"]').click(); await wait(200);
  var fsOpts=d.getElementById('form-home').options.length;
  ok('el fútbol sala trae sus propias alineaciones',fsOpts>1&&
     d.getElementById('form-home').options[1].text.indexOf('-')>0,fsOpts+' opciones');
  d.querySelector('[data-pitch="f11"]').click(); await wait(200);
  ok('al volver a fútbol 11 hay 6 sistemas',d.getElementById('form-home').options.length===7,
     d.getElementById('form-home').options.length+' opciones');

  // --- regla ---
  d.querySelector('[data-tool="measure"]').click();await raf();
  var pm=region(cv,500,420,40);
  pointerAt(w,cv,400,380,'pointerdown');
  pointerAt(w,cv,620,470,'pointermove');
  pointerAt(w,cv,620,470,'pointerup');await raf();
  ok('la regla dibuja la medida sobre el campo',region(cv,500,420,40)!==pm);

  // --- vídeo de la jugada ---
  var started=false,stopped=false;
  var RealRec=w.MediaRecorder;
  w.MediaRecorder=function(){ started=true; this.start=function(){}; this.stop=function(){ stopped=true; if(this.onstop)this.onstop(); };
    this.ondataavailable=null; this.onstop=null; };
  w.MediaRecorder.isTypeSupported=function(){return true;};
  if(!w.HTMLCanvasElement.prototype.captureStream)
    w.HTMLCanvasElement.prototype.captureStream=function(){return {};};
  d.getElementById('ex-video').click();
  await wait(220);
  ok('grabar la jugada arranca el grabador',started);
  ok('el botón de exportar se marca mientras graba',d.getElementById('export').classList.contains('rec'));
  await wait(4200);
  ok('la grabación termina sola',stopped&&!d.getElementById('export').classList.contains('rec'));
  w.MediaRecorder=RealRec;

  // --- selección múltiple ---
  d.querySelector('[data-tool="select"]').click();await raf();
  // dejamos tres conos juntos en una esquina despejada
  d.querySelector('[data-place="cone"]').click();await raf();
  var base=[[180,560],[240,560],[300,560]];
  for(var ci=0;ci<base.length;ci++){
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerdown');
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerup');await raf();
  }
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,140,510,'pointerdown');
  pointerAt(w,cv,250,540,'pointermove');
  pointerAt(w,cv,340,610,'pointermove');
  pointerAt(w,cv,340,610,'pointerup');await raf();
  var bar=d.querySelector('#inspector .name');
  ok('el recuadro selecciona varias piezas',!!bar&&/seleccionados/.test(bar.textContent),
     bar?bar.textContent:'sin barra de grupo');

  var antesG=region(cv,240,560,60);
  pointerAt(w,cv,240,560,'pointerdown');
  pointerAt(w,cv,240,470,'pointermove');
  pointerAt(w,cv,240,470,'pointerup');await raf();
  ok('arrastrar mueve todo el grupo a la vez',region(cv,240,560,60)!==antesG);

  d.querySelector('#g-del').click();await raf();
  ok('se puede borrar el grupo entero',!d.getElementById('inspector').classList.contains('show'));

  // --- hoja de sesión ---
  // Ya no se abre una pestaña nueva: la bloquean el iPhone y los navegadores
  // que van dentro de otra aplicación, y el botón se quedaba muerto.
  d.getElementById('ex-sheet').click();await wait(400);
  ok('la hoja de sesión pide un título',d.getElementById('dlg-ask').open);
  d.getElementById('ask-ok').click();
  await wait(2400);
  var hojaM=[].filter.call(d.querySelectorAll('iframe'),function(m){
    return m.getAttribute('title')==='Hoja para imprimir'&&!m.id;})[0];
  ok('la hoja se genera con los fotogramas',
     !!hojaM&&hojaM.contentDocument.querySelectorAll('img').length>0,
     hojaM?'marco listo':'no se preparó');
  ok('la hoja sale a tamaño de folio',!!hojaM&&/210mm/.test(hojaM.style.width),
     hojaM?hojaM.style.width:'-');
  if(hojaM&&hojaM.parentNode)hojaM.parentNode.removeChild(hojaM);
  if(d.getElementById('dlg-hoja').open)d.getElementById('dlg-hoja').close();
  await wait(200);

  // --- ficha del ejercicio ---
  d.getElementById('card-edit').click();await wait(120);
  var dlgF=d.getElementById('dlg-card');
  ok('la ficha del ejercicio se abre desde la pizarra',dlgF.open);
  ok('la ficha trae la fecha de hoy puesta',/\d{1,2}\/\d{1,2}\/\d{4}/.test(d.getElementById('f-fecha').value),
     d.getElementById('f-fecha').value);

  // dos jugadores y dos conos, para que el relleno automático tenga qué contar
  var antesJ=d.getElementById('f-jugadores').value;
  d.getElementById('f-auto').click();await raf();
  ok('rellenar desde la pizarra cuenta los jugadores',
     d.getElementById('f-jugadores').value!==antesJ&&/\d/.test(d.getElementById('f-jugadores').value),
     d.getElementById('f-jugadores').value);
  ok('rellenar desde la pizarra deduce el espacio',/m$/.test(d.getElementById('f-espacio').value),
     d.getElementById('f-espacio').value);
  ok('cuenta como mucho un portero por portería',
     Number(d.getElementById('f-porteros').value||0)<=2,d.getElementById('f-porteros').value);

  d.getElementById('f-titulo').value='Salida de balón bajo presión';
  d.getElementById('f-objetivo').value='Progresar desde portería con pase interior.';
  d.getElementById('f-consignas').value='Perfil abierto al recibir\nPrimer pase al lado contrario';
  d.getElementById('f-normas').value='Máximo dos toques';
  d.getElementById('f-guardar').click();await wait(150);
  ok('guardar la ficha cierra el formulario',!dlgF.open);

  // la ficha viaja dentro del documento: sobrevive a deshacer y rehacer
  d.getElementById('undo').click();await wait(60);
  d.getElementById('redo').click();await wait(60);
  d.getElementById('card-edit').click();await wait(120);
  ok('la ficha se guarda con la pizarra',
     d.getElementById('f-titulo').value==='Salida de balón bajo presión',
     d.getElementById('f-titulo').value);
  ok('rellenar no pisa lo que ya has escrito',
     (d.getElementById('f-auto').click(),d.getElementById('f-titulo').value==='Salida de balón bajo presión'));

  // una ficha ya rellenada tiene que poder volver a abrirse; el botón de la
  // barra de arriba es ahora el único camino, y no imprime sola
  d.querySelector('#dlg-card [data-close]').click();await wait(150);
  var imprimio=false,oldOpen3=w.open;
  w.open=function(){ imprimio=true; return {document:{write:function(){},close:function(){}},
    focus:function(){},print:function(){}}; };
  d.getElementById('card-edit').click();await wait(400);
  w.open=oldOpen3;
  ok('la ficha rellenada se vuelve a abrir, no se imprime sola',
     d.getElementById('dlg-card').open&&!imprimio,
     'diálogo '+d.getElementById('dlg-card').open+' · imprimió '+imprimio);
  ok('la ficha conserva lo que ya tenía escrito',
     d.getElementById('f-titulo').value==='Salida de balón bajo presión',
     d.getElementById('f-titulo').value);

  // La ficha se imprime desde un marco de folio del propio documento, sin
  // abrir pestañas: las bloquean el iPhone y los navegadores incrustados.
  var emerg=0,oldOpen2=w.open;
  w.open=function(){ emerg++; return null; };
  d.getElementById('f-imprimir').click();await wait(2600);
  w.open=oldOpen2;
  var fichaM=[].filter.call(d.querySelectorAll('iframe'),function(m){
    return m.getAttribute('title')==='Hoja para imprimir'&&!m.id;})[0];
  var fh=fichaM?fichaM.contentDocument.documentElement.innerHTML:'';
  ok('imprimir la ficha no abre ninguna pestaña nueva',emerg===0,emerg+' intentos');
  ok('la ficha se prepara para imprimir',!!fichaM);
  ok('la ficha lleva el dibujo de la pizarra',
     !!fichaM&&!!fichaM.contentDocument.querySelector('.shot img[src^="data:image/png"]'));
  ok('la ficha se maqueta por bloques delimitados',
     !!fichaM&&!!fichaM.contentDocument.querySelector('.page')&&
     fichaM.contentDocument.querySelectorAll('.panel').length>=4,
     fichaM?fichaM.contentDocument.querySelectorAll('.panel').length+' bloques':'sin ficha');
  ok('la ficha lleva el título y el objetivo',
     /Salida de balón bajo presión/.test(fh)&&/pase interior/.test(fh));
  ok('cada consigna es un punto de la lista',
     !!fichaM&&fichaM.contentDocument.querySelectorAll('li').length>=3,
     fichaM?fichaM.contentDocument.querySelectorAll('li').length+' puntos':'sin ficha');
  ok('la ficha recoge las medidas del campo',/105 × 68 m/.test(fh));

  // --- MP4 propio: se fuerza el camino de WebCodecs y se valida el contenedor ---
  // Este Chromium no trae H.264, así que se codifica VP8 de verdad y se inyecta un
  // avcC: lo que se comprueba es el contenedor que escribimos nosotros.
  if (typeof w.VideoEncoder !== 'undefined') {
    var RealVE = w.VideoEncoder;
    var realSup2 = w.MediaRecorder.isTypeSupported;
    w.MediaRecorder.isTypeSupported = function(t2){ return /webm/.test(t2); };

    var FakeVE = function(init){
      var primero = true;
      var real = new RealVE({
        output: function(chunk, meta){
          if (primero) {
            primero = false;
            init.output(chunk, { decoderConfig: { description: new Uint8Array(
              [1,66,0,31,255,225,0,13,103,66,192,31,218,1,64,22,232,6,208,161,53,1,0,4,104,206,9,200]) } });
          } else init.output(chunk, {});
        },
        error: init.error
      });
      this.configure = function(cfg){
        real.configure({codec:'vp8', width:cfg.width, height:cfg.height,
                        bitrate:cfg.bitrate, framerate:cfg.framerate});
      };
      this.encode = function(f,o){ real.encode(f,o); };
      this.flush  = function(){ return real.flush(); };
      this.close  = function(){ try{ real.close(); }catch(e){} };
      Object.defineProperty(this,'encodeQueueSize',{get:function(){return real.encodeQueueSize;}});
    };
    FakeVE.isConfigSupported = function(cfg){ return Promise.resolve({supported:/^avc1/.test(cfg.codec)}); };
    w.VideoEncoder = FakeVE;

    var mp4Blob = null, realURL2 = w.URL.createObjectURL.bind(w.URL);
    w.URL.createObjectURL = function(b3){ if(b3 && b3.type === 'video/mp4') mp4Blob = b3; return realURL2(b3); };

    d.getElementById('export').click(); await wait(150);
    d.getElementById('ex-video').click();
    for (var espera=0; espera<40 && !mp4Blob; espera++) await wait(300);

    w.URL.createObjectURL = realURL2;
    w.VideoEncoder = RealVE;
    w.MediaRecorder.isTypeSupported = realSup2;

    ok('se genera un archivo MP4 sin MediaRecorder', !!mp4Blob,
       mp4Blob ? Math.round(mp4Blob.size/1024)+' KB' : 'no se generó');

    if (mp4Blob) {
      var buf = await mp4Blob.arrayBuffer();
      var dv = new DataView(buf);
      function cajas(ini, fin){
        var r = [], q = ini;
        while (q + 8 <= fin) {
          var size = dv.getUint32(q);
          var type = String.fromCharCode(dv.getUint8(q+4),dv.getUint8(q+5),dv.getUint8(q+6),dv.getUint8(q+7));
          if (size < 8 || q + size > fin) break;
          r.push({type:type, start:q, size:size});
          q += size;
        }
        return r;
      }
      function buscar(lista, t2){ for (var q=0;q<lista.length;q++) if (lista[q].type===t2) return lista[q]; return null; }
      function dentro(b4){ return cajas(b4.start+8, b4.start+b4.size); }

      var raiz = cajas(0, buf.byteLength);
      var tipos = raiz.map(function(x){return x.type;}).join(',');
      ok('el MP4 tiene ftyp, mdat y moov', tipos === 'ftyp,mdat,moov', tipos);

      var moov = buscar(raiz,'moov'), mdat = buscar(raiz,'mdat');
      var trak = moov && buscar(dentro(moov),'trak');
      var mdia = trak && buscar(dentro(trak),'mdia');
      var minf = mdia && buscar(dentro(mdia),'minf');
      var stbl = minf && buscar(dentro(minf),'stbl');
      var stsd = stbl && buscar(dentro(stbl),'stsd');
      ok('la jerarquía moov/trak/mdia/minf/stbl/stsd es correcta', !!stsd);

      if (stsd) {
        var avc1 = cajas(stsd.start+16, stsd.start+stsd.size)[0];
        ok('la muestra se declara como avc1', avc1 && avc1.type === 'avc1', avc1 ? avc1.type : 'nada');
        var avcC = avc1 && buscar(cajas(avc1.start+8+78, avc1.start+avc1.size), 'avcC');
        ok('lleva la configuración avcC del códec', !!avcC);

        var stsz = buscar(dentro(stbl),'stsz');
        var nMuestras = stsz ? dv.getUint32(stsz.start+16) : 0;
        ok('hay muestras de vídeo en el índice', nMuestras > 10, nMuestras+' muestras');

        var stco = buscar(dentro(stbl),'stco');
        var offset = stco ? dv.getUint32(stco.start+16) : -1;
        ok('el índice apunta al inicio real de los datos', offset === mdat.start + 8,
           offset+' vs '+(mdat.start+8));
      }
    }
  }

  await wait(250);
  // La biblioteca tiene que seguir en pie aunque el servidor no conteste.
  ok('el catálogo se ve aunque el servidor no responda',
     d.querySelectorAll('.lib-card').length>0,
     d.getElementById('lib-cuenta').textContent);

  // abrir un ejercicio trae pizarra y ficha
  d.getElementById('lib-pitch').value='futsal';
  d.getElementById('lib-pitch').dispatchEvent(new Event('change',{bubbles:true}));await wait(300);
  d.querySelector('.lib-card .tbtn.primary').click();await wait(600);
  ok('abrir un ejercicio cierra la biblioteca',!lib.open);
  ok('el ejercicio trae su modalidad y sus piezas',
     d.querySelector('[data-pitch="futsal"]').getAttribute('aria-pressed')==='true');
  d.getElementById('card-edit').click();await wait(250);
  ok('el ejercicio trae la ficha rellena',
     /pivote/i.test(d.getElementById('f-titulo').value+' '+d.getElementById('f-objetivo').value),
     d.getElementById('f-titulo').value);

  // plantilla: rellena la ficha sin tocar la pizarra
  var plant=d.getElementById('f-plantilla');
  ok('la ficha ofrece plantillas',plant.options.length>=11,plant.options.length-1+' plantillas');
  d.getElementById('f-titulo').value='';d.getElementById('f-objetivo').value='';
  d.getElementById('f-descripcion').value='';d.getElementById('f-consignas').value='';
  d.getElementById('f-normas').value='';d.getElementById('f-variantes').value='';
  d.getElementById('f-duracion').value='';d.getElementById('f-series').value='';
  d.getElementById('f-descanso').value='';d.getElementById('f-jugadores').value='';
  d.getElementById('f-porteros').value='';d.getElementById('f-espacio').value='';
  d.getElementById('f-material').value='';d.getElementById('f-momento').value='';
  plant.value='rondo-4v2';plant.dispatchEvent(new Event('change',{bubbles:true}));await wait(350);
  ok('la plantilla rellena la ficha entera',
     /Rondo/.test(d.getElementById('f-titulo').value)&&
     d.getElementById('f-consignas').value.split('\n').length>=3,
     d.getElementById('f-titulo').value);
  ok('el selector de plantilla vuelve a su sitio tras usarlo',plant.value==='');
  d.querySelector('#dlg-card [data-close]').click();await raf();

  // --- la ficha, por apartados y con sugerencias ---
  d.getElementById('card-edit').click();await wait(300);
  ok('la ficha abre por el primer apartado',
     [].filter.call(d.querySelectorAll('.paso'),function(p){return !p.hidden;}).length===1&&
     !d.getElementById('paso-ident').hidden);
  d.querySelectorAll('.paso-btn')[1].click();await wait(200);
  ok('cada apartado enseña solo lo suyo',
     !d.getElementById('paso-organizacion').hidden&&d.getElementById('paso-ident').hidden&&
     d.getElementById('paso-contenido').hidden);
  var sugD=d.querySelector('[data-para="f-duracion"] .sug');
  ok('los campos traen sugerencias',!!sugD,
     d.querySelectorAll('.sug').length+' en toda la ficha');
  d.getElementById('f-duracion').value='';
  sugD.click();await raf();
  ok('la sugerencia rellena el campo de una línea',d.getElementById('f-duracion').value===sugD.textContent,
     d.getElementById('f-duracion').value);
  d.querySelectorAll('.paso-btn')[2].click();await wait(200);
  d.getElementById('f-consignas').value='';
  var sugC=d.querySelectorAll('[data-para="f-consignas"] .sug');
  sugC[0].click();sugC[1].click();sugC[0].click();await raf();
  ok('en las listas la sugerencia suma una línea y no repite',
     d.getElementById('f-consignas').value.split('\n').length===2,
     JSON.stringify(d.getElementById('f-consignas').value));
  d.querySelector('#dlg-card [data-close]').click();await wait(200);

  // --- ajustes ---
  d.getElementById('cfg').click();await wait(250);
  ok('los ajustes se abren',d.getElementById('dlg-cfg').open);
  ok('marcan la modalidad que tienes puesta',
     d.querySelector('[data-cfg-pitch="f11"]').getAttribute('aria-pressed')==='true');
  d.querySelector('[data-cfg-pitch="f7"]').click();await wait(250);
  d.getElementById('cfg-categoria').value='Cadete A';
  d.getElementById('cfg-categoria').dispatchEvent(new Event('change',{bubbles:true}));
  d.querySelector('#dlg-cfg [data-close]').click();await wait(250);
  d.getElementById('open').click();await wait(500);
  ok('la biblioteca abre en la modalidad de los ajustes',
     d.getElementById('lib-pitch').value==='f7'&&
     /fútbol 7/.test(d.getElementById('lib-cuenta').textContent),
     d.getElementById('lib-cuenta').textContent);
  d.querySelector('#dlg-lib [data-close]').click();await wait(200);
  d.getElementById('card-edit').click();await wait(250);
  ok('la ficha hereda tu equipo',d.getElementById('f-categoria').value==='Cadete A',
     d.getElementById('f-categoria').value);
  d.querySelector('#dlg-card [data-close]').click();await wait(200);
  d.getElementById('cfg').click();await wait(200);
  d.querySelector('[data-cfg-pitch="f11"]').click();await wait(200);
  d.querySelector('#dlg-cfg [data-close]').click();await wait(200);

  // --- vista de zona ---
  var antesZona=region(cv,cv.width/2,cv.height/2,80);
  d.querySelector('[data-view="area"]').click();await wait(250);
  ok('la vista de zona encuadra el centro del campo',
     region(cv,cv.width/2,cv.height/2,80)!==antesZona&&
     d.querySelector('[data-view="area"]').getAttribute('aria-pressed')==='true');
  d.querySelector('[data-view="full"]').click();await wait(200);

  // --- cada pestaña abre su sección (solo en pantalla estrecha) ---
  var marco=w.frameElement;marco.style.width='390px';await wait(600);
  d.querySelectorAll('.tab')[3].click();await wait(400);
  var visibles=[].filter.call(d.querySelectorAll('.block'),function(b){return b.offsetParent!==null;});
  ok('la pestaña de material abre solo material',
     visibles.length===1&&visibles[0].id==='b-mats',visibles.map(function(b){return b.id;}).join(','));
  ok('la hoja dice en qué sección estás',d.getElementById('sheet-tit').textContent==='Material',
     d.getElementById('sheet-tit').textContent);
  d.querySelectorAll('.tab')[5].click();await wait(400);
  var vis2=[].filter.call(d.querySelectorAll('.block'),function(b){return b.offsetParent!==null;});
  ok('la pestaña de pizarra lleva a las acciones',vis2.length===1&&vis2[0].id==='b-actions',
     vis2.map(function(b){return b.id;}).join(','));
  ok('hay una pestaña por sección',d.querySelectorAll('.tab').length===6);
  d.getElementById('scrim').click();await wait(300);
  marco.style.width='1200px';await wait(500);
  ok('en pantalla ancha el panel las enseña todas',
     [].filter.call(d.querySelectorAll('.block'),function(b){return b.offsetParent!==null;}).length>=6);

  // --- cada material se dibuja como lo que es ---
  d.querySelector('[data-pitch="f11"]').click();await wait(250);   // en sala la pista es azul
  d.querySelector('[data-view="area"]').click();await wait(200);
  d.getElementById('clear').click();await wait(250);
  d.getElementById('ask-ok').click();await wait(400);
  function alto(x,y,s){  // cuánto se pinta por encima del punto donde se coloca
    var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width),n=0;
    var im=c.getImageData(Math.round((x-s)*dpr),Math.round((y-2.2*s)*dpr),
                          Math.round(2*s*dpr),Math.round(1.6*s*dpr)).data;
    // el césped es verde dominante; una pieza tiene rojo o azul a la altura del verde
    for(var i=0;i<im.length;i+=4){var r=im[i],g=im[i+1],b=im[i+2];
      if((r>g*0.9||b>g*0.9)&&r+g+b>150)n++;}   // ni césped ni fondo oscuro
    return n;}
  var X=cv.clientWidth*0.32,Y=cv.clientHeight*0.55,X2=cv.clientWidth*0.55;
  d.querySelector('[data-place="pole"]').click();
  pointerAt(w,cv,X,Y,'pointerdown');pointerAt(w,cv,X,Y,'pointerup');await wait(200);
  d.querySelector('[data-place="disc"]').click();
  pointerAt(w,cv,X2,Y,'pointerdown');pointerAt(w,cv,X2,Y,'pointerup');await wait(200);
  // sin nada seleccionado: el anillo de selección también pinta por encima
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,cv.clientWidth*0.88,cv.clientHeight*0.15,'pointerdown');
  pointerAt(w,cv,cv.clientWidth*0.88,cv.clientHeight*0.15,'pointerup');await wait(250);
  var aPica=alto(X,Y,26),aChino=alto(X2,Y,26);
  ok('la pica se dibuja de pie, no como un punto',aPica>60,aPica+' px pintados encima');
  ok('el chino se dibuja bajo, no como un cono de tráfico',aChino<60,aChino+' px pintados encima');
  ok('la pica se ve bastante más alta que el chino',aPica>aChino*2,aPica+' contra '+aChino);
  pointerAt(w,cv,X,Y-16,'pointerdown');pointerAt(w,cv,X,Y-16,'pointerup');await raf();
  ok('la pica se puede seleccionar tocando el palo',
     d.getElementById('inspector').classList.contains('show'));
  d.getElementById('clear').click();await wait(250);
  d.getElementById('ask-ok').click();await wait(300);
  d.querySelector('[data-view="full"]').click();await wait(200);

  // --- consistencia entre menús ---
  var comps = w.getComputedStyle;
  d.getElementById('card-edit').click();await wait(300);
  var campoFicha = comps(d.getElementById('f-titulo'));
  d.querySelector('#dlg-card [data-close]').click();await wait(200);
  d.getElementById('open').click();await wait(500);
  var campoLib = comps(d.getElementById('lib-q'));
  d.querySelector('#dlg-lib [data-close]').click();await wait(200);
  ok('los campos de todos los menús se ven igual',
     campoFicha.fontSize===campoLib.fontSize&&campoFicha.borderRadius===campoLib.borderRadius&&
     campoFicha.backgroundColor===campoLib.backgroundColor,
     campoFicha.fontSize+' / '+campoLib.fontSize);
  ok('los apartados usan el mismo control que el resto',
     d.querySelector('.pasos').classList.contains('seg'));
  ok('los rótulos de sección son todos el mismo',
     d.querySelectorAll('.ex-group').length===0&&d.querySelectorAll('.form-group').length>=5,
     d.querySelectorAll('.form-group').length+' rótulos');
  var cierres=[].map.call(d.querySelectorAll('.dfoot [data-close]'),function(b){return b.textContent.trim();});
  ok('cerrar se dice igual en todas partes',
     cierres.filter(function(t){return t!=='Cerrar'&&t!=='Cancelar';}).length===0,
     cierres.join(' · '));

  // --- cada cosa en un solo sitio ---
  // Había dos «Ajustes» a la vez en el móvil (el engranaje y una fila del
  // panel), la ficha estaba en el panel y dentro de Exportar, y la hoja de
  // sesión salía dos veces.
  function cuantos(fn){return [].filter.call(d.querySelectorAll('button,label'),fn).length;}
  ok('los ajustes están en un solo sitio',
     cuantos(function(b){return /^ajustes$/i.test((b.textContent||'').trim())||
       /^ajustes$/i.test(b.getAttribute('aria-label')||'');})===1);
  ok('la ayuda está en un solo sitio',
     cuantos(function(b){return /cómo se usa/i.test((b.textContent||'').trim());})===1);
  ok('la ficha está en un solo sitio',
     cuantos(function(b){return /^ficha( del ejercicio)?$/i.test((b.textContent||'').trim());})===1);
  ok('la hoja de sesión está en un solo sitio',
     cuantos(function(b){return /hoja de sesión/i.test((b.textContent||'').trim());})===1);
  ok('la ficha tiene sitio propio en la barra de arriba',
     !!d.querySelector('.topbar #card-edit'));

  // --- ningún botón muerto en el panel ni en la barra ---
  // «Hoja de sesión para imprimir» llevaba tiempo en el panel sin un solo
  // oyente detrás: se pulsaba y no pasaba nada. Se comprueba contra el motor.
  var motor=await fetch('../app/board.js').then(function(r){return r.text();});
  var huerfanos=[].filter.call(
    d.querySelectorAll('.topbar button[id], .aside .row-btn[id]'),
    function(b){return motor.indexOf("'#"+b.id+"'")<0&&motor.indexOf('"#'+b.id+'"')<0;})
    .map(function(b){return '#'+b.id;});
  ok('ningún botón de la barra o del panel se queda sin oyente',
     huerfanos.length===0,huerfanos.join(', '));

  // --- la barra de arriba cabe entera en un teléfono ---
  // El logo era lo único que podía encogerse, así que absorbía todo lo que
  // sobraba y salía cortado por la mitad.
  var marcoB=w.frameElement,anchoPrevio=marcoB.style.width;
  var medidas=[];
  for(var ai=0;ai<3;ai++){
    var an=[320,360,390][ai];
    marcoB.style.width=an+'px';await wait(600);
    medidas.push((function(){
      var t=d.querySelector('.topbar'),est=w.getComputedStyle(t);
      var hijos=[].filter.call(t.children,function(c){return c.offsetParent!==null;});
      var suma=parseFloat(est.paddingLeft)+parseFloat(est.paddingRight)+
               parseFloat(est.gap)*Math.max(0,hijos.length-1);
      hijos.forEach(function(c){if(!c.classList.contains('spacer'))
        suma+=c.getBoundingClientRect().width;});
      var logo=d.querySelector('.logo');
      return {ancho:an,desborde:Math.round(suma-t.getBoundingClientRect().width),
        logoEntero:logo.offsetParent===null||logo.clientWidth>=logo.scrollWidth-1,
        botones:Math.round(Math.min.apply(null,[].map.call(
          t.querySelectorAll('button'),function(x){return x.getBoundingClientRect().width;})))};
    })());
  }
  marcoB.style.width=anchoPrevio||'1200px';await wait(600);
  ok('la barra de arriba cabe entera en cualquier teléfono',
     medidas.every(function(m){return m.desborde<=0;}),
     medidas.map(function(m){return m.ancho+'px:'+m.desborde;}).join(' · '));
  ok('el logo nunca sale cortado',medidas.every(function(m){return m.logoEntero;}),
     medidas.map(function(m){return m.ancho+'px:'+(m.logoEntero?'ok':'CORTADO');}).join(' · '));
  ok('los botones de la barra siguen siendo tocables',
     medidas.every(function(m){return m.botones>=34;}),
     medidas.map(function(m){return m.ancho+'px:'+m.botones+'px';}).join(' · '));

  // --- la hoja del móvil no se mete debajo de la barra de pestañas ---
  var marco2=w.frameElement;marco2.style.width='390px';await wait(650);
  d.querySelectorAll('.tab')[2].click();await wait(500);
  var caja=d.getElementById('aside').getBoundingClientRect();
  var barra=d.querySelector('.tabbar').getBoundingClientRect();
  ok('la hoja se apoya encima de la barra, no debajo',caja.bottom<=barra.top+0.5,
     Math.round(caja.bottom-barra.top)+' px de solape');
  var selVis=d.getElementById('form-away').getBoundingClientRect();
  ok('el último control de la sección se ve entero',selVis.bottom<=caja.bottom+0.5,
     Math.round(selVis.bottom-caja.bottom)+' px fuera');
  d.getElementById('scrim').click();await wait(300);
  marco2.style.width='1200px';await wait(550);

  // --- guardar la ficha guarda el ejercicio ---
  // Antes se rellenaba la ficha, se le daba a Guardar y en la biblioteca no
  // había nada: la ficha se quedaba dentro del documento y ya está.
  w.localStorage.removeItem('pt-boards');
  d.getElementById('card-edit').click();await wait(400);
  d.getElementById('f-titulo').value='Prueba de guardado';
  d.getElementById('f-guardar').click();await wait(500);
  var guardadas=JSON.parse(w.localStorage.getItem('pt-boards')||'{}');
  ok('guardar la ficha deja el ejercicio en la biblioteca',
     !!guardadas['Prueba de guardado'],Object.keys(guardadas).join(','));
  ok('y guarda la pizarra entera con ella',
     !!(guardadas['Prueba de guardado']&&guardadas['Prueba de guardado'].doc.frames.length));
  d.getElementById('card-edit').click();await wait(400);
  d.getElementById('f-guardar').click();await wait(500);
  ok('volver a guardarla no crea una copia',
     Object.keys(JSON.parse(w.localStorage.getItem('pt-boards')||'{}')).length===1);
  ok('el nombre que propone Guardar es el de la ficha',
     (function(){d.getElementById('save').click();
      var v=d.getElementById('ask-input').value;
      d.querySelector('#dlg-ask [data-close]').click();
      return v==='Prueba de guardado';})());
  await wait(300);
  w.localStorage.removeItem('pt-boards');

  // --- imprimir sin ventanas emergentes ---
  // En el iPhone y dentro de otras aplicaciones las bloquean, y el botón se
  // quedaba muerto. Ahora se imprime desde un marco del propio documento.
  var emergentes=0,abrirReal=w.open;
  w.open=function(){emergentes++;return abrirReal.apply(w,arguments);};
  d.getElementById('export').click();await wait(300);
  d.getElementById('ex-sheet').click();await wait(400);
  d.getElementById('ask-ok').click();await wait(2500);
  var marcoImp=[].filter.call(d.querySelectorAll('iframe'),function(m){
    return m.getAttribute('title')==='Hoja para imprimir'&&!m.id;})[0];
  ok('imprimir no abre ninguna ventana emergente',emergentes===0,emergentes+' intentos');
  ok('la hoja de sesión se prepara en un marco de folio',!!marcoImp);
  ok('y lleva dentro el dibujo de la pizarra',
     !!marcoImp&&marcoImp.contentDocument.querySelectorAll('img').length>0);
  w.open=abrirReal;
  if(marcoImp&&marcoImp.parentNode)marcoImp.parentNode.removeChild(marcoImp);
  if(d.getElementById('dlg-hoja').open)d.getElementById('dlg-hoja').close();
  await wait(200);

  ok('sin errores de JavaScript',errors.length===0,errors.join(' | '));
}
function report(){document.getElementById('out').textContent=log.join('\n')+
  '\n\nRESULTADO: '+(fails?fails+' FALLOS':'TODO CORRECTO ('+log.length+' comprobaciones)');
  document.title=fails?'FALLOS':'OK';}
</script></body></html>
