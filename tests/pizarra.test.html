<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pruebas de la pizarra</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}
iframe{width:1200px;height:820px;border:0}#out{white-space:pre;padding:10px;font-size:14px}</style></head>
<body>
<h1 style="font:700 16px system-ui;padding:10px 10px 0;margin:0">Pruebas de la pizarra táctica</h1>
<p style="font:13px system-ui;color:#9aa;padding:0 10px;margin:6px 0">Sirve el repositorio (<code>python3 -m http.server</code>) y abre este archivo. Se ejecuta solo.</p>
<div id="out">ejecutando…</div><iframe id="fr"></iframe>
<script>
/* La pizarra guarda lo suyo en el navegador: pt-autosave, pt-prefs, pt-boards,
   pt-catalogo, pt-nube. Si no se limpia, la segunda pasada arranca con lo que
   dejó la primera —la modalidad cambiada a sala, la ficha ya rellena— y fallan
   pruebas que no tienen nada que ver con lo que se está comprobando. Se limpia
   ANTES de cargar la aplicación, por eso el iframe no trae src en el HTML. */
try{ Object.keys(localStorage).filter(function(k){return k.indexOf('pt-')===0;})
       .forEach(function(k){localStorage.removeItem(k);}); }catch(e){}
var log=[],fails=0;
function ok(n,c,x){log.push((c?'PASA  ':'FALLA ')+n+(x?'  ('+x+')':''));if(!c)fails++;}
function raf(){return new Promise(function(r){setTimeout(r,70);});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* Ir a una sección. El interruptor Pizarra/Equipo de la barra ya no existe: se
   navega por el cajón, que es abrir, elegir y que se cierre solo. Las pruebas
   lo hacen como lo haría un dedo, no llamando por dentro. */
async function irA(d,x){
  d.getElementById('cajon-btn').click();
  await new Promise(function(r){setTimeout(r,320);});
  d.querySelector('.cajon-ir[data-ir="'+x+'"]').click();
  await new Promise(function(r){setTimeout(r,420);});
}

var fr=document.getElementById('fr'),errors=[],arrancado=false;
fr.addEventListener('load',function(){var w=fr.contentWindow,d=fr.contentDocument;
  /* Un iframe sin src carga about:blank y también avisa: solo cuenta la carga
     que trae la pizarra dentro, y solo una vez. */
  if(arrancado||!d||!d.getElementById('board'))return; arrancado=true;
  w.addEventListener('error',function(e){errors.push(e.message);});
  run(w,d).catch(function(e){log.push('EXCEPCION: '+e.message);fails++;}).then(report);});
fr.src='../app/';
function px(cv,x,y){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  return c.getImageData(Math.round(x*dpr),Math.round(y*dpr),1,1).data;}
function pointerAt(w,el,x,y,t){var r=el.getBoundingClientRect();
  el.dispatchEvent(new w.PointerEvent(t,{clientX:r.left+x,clientY:r.top+y,bubbles:true,pointerId:1,isPrimary:true,buttons:1}));}
function region(cv,x,y,s){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  var d=c.getImageData(Math.round((x-s)*dpr),Math.round((y-s)*dpr),Math.round(2*s*dpr),Math.round(2*s*dpr)).data;
  var sum=0;for(var i=0;i<d.length;i+=4)sum+=d[i]+d[i+1]+d[i+2];return sum;}
async function run(w,d){
  await wait(400);
  var cv=d.getElementById('board');
  ok('el canvas existe y tiene tamaño',!!cv&&cv.width>200,cv?cv.width+'x'+cv.height:'no');
  var p=px(cv,cv.clientWidth/2,cv.clientHeight/2);
  ok('el campo se dibuja en verde',p[1]>p[0]&&p[1]>p[2]&&p[1]>40,'rgb('+p[0]+','+p[1]+','+p[2]+')');
  ok('la línea de tiempo arranca con 1 fotograma',d.getElementById('frames').children.length===2);
  ok('el 4-3-3 inicial pinta jugadores',region(cv,cv.clientWidth*0.10,cv.clientHeight*0.5,26)>0);
  var before=region(cv,300,620,22);
  d.querySelector('[data-place="cone"]').click(); await raf();
  ok('la herramienta de colocar queda activa',d.querySelector('[data-place="cone"]').getAttribute('aria-pressed')==='true');
  pointerAt(w,cv,300,620,'pointerdown');pointerAt(w,cv,300,620,'pointerup');await raf();
  ok('al tocar el campo se coloca el cono',region(cv,300,620,22)!==before);
  var mats=['goal','hurdle','ladder','dummy','ring','flag','pole','disc','minigoal','ball','player'],okM=true,det='';
  for(var i=0;i<mats.length;i++){var b=d.querySelector('[data-place="'+mats[i]+'"]');
    if(!b){okM=false;det+=mats[i]+' sin botón; ';continue;} b.click();
    var X=200+i*66,Y=120,pre=region(cv,X,Y,24);
    pointerAt(w,cv,X,Y,'pointerdown');pointerAt(w,cv,X,Y,'pointerup');await raf();
    if(region(cv,X,Y,24)===pre){okM=false;det+=mats[i]+' no pinta; ';}}
  ok('los 11 elementos colocables se dibujan',okM,det);
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,300,620,'pointerdown');await raf();
  ok('el inspector aparece al seleccionar',d.getElementById('inspector').classList.contains('show'));
  pointerAt(w,cv,430,530,'pointermove');pointerAt(w,cv,430,530,'pointerup');await raf();
  ok('arrastrar mueve el objeto',region(cv,430,530,22)!==region(cv,700,620,22));
  var tools=['pass','run','dribble','free'],okT=true,dt='';
  for(var t=0;t<tools.length;t++){d.querySelector('[data-tool="'+tools[t]+'"]').click();await raf();
    var y0=300+t*60,pre=region(cv,700,y0,26);
    pointerAt(w,cv,600,y0+20,'pointerdown');
    for(var k=1;k<=8;k++)pointerAt(w,cv,600+k*26,y0+20-k*4,'pointermove');
    pointerAt(w,cv,810,y0-12,'pointerup');await raf();
    if(region(cv,700,y0,26)===pre){okT=false;dt+=tools[t]+' no pinta; ';}}
  ok('las 4 herramientas de trazo dibujan',okT,dt);
  d.querySelector('[data-tool="zone"]').click();await raf();
  var pz=region(cv,300,250,30);
  pointerAt(w,cv,240,200,'pointerdown');pointerAt(w,cv,380,310,'pointermove');pointerAt(w,cv,380,310,'pointerup');await raf();
  ok('la zona sombreada se dibuja',region(cv,300,250,30)!==pz);
  d.querySelector('.frame.add').click();await raf();
  ok('añadir fotograma crea el segundo',d.getElementById('frames').children.length===3);
  ok('el botón de reproducir se habilita',!d.getElementById('play').disabled);
  d.querySelector('[data-tool="select"]').click();
  var jx=cv.clientWidth*0.10,jy=cv.clientHeight*0.5;
  pointerAt(w,cv,jx,jy,'pointerdown');pointerAt(w,cv,jx+160,jy+40,'pointermove');pointerAt(w,cv,jx+160,jy+40,'pointerup');await raf();
  d.getElementById('play').click();await wait(300);
  ok('la animación arranca',d.getElementById('progress').classList.contains('show'));
  var w1=d.querySelector('#progress i').style.width;await wait(500);
  ok('la animación avanza',w1!==d.querySelector('#progress i').style.width,w1+' -> '+d.querySelector('#progress i').style.width);
  await wait(1800);
  ok('la animación termina sola',!d.getElementById('progress').classList.contains('show'));
  ok('deshacer está disponible',!d.getElementById('undo').disabled);
  d.getElementById('undo').click();await raf();
  ok('rehacer se habilita tras deshacer',!d.getElementById('redo').disabled);
  d.getElementById('redo').click();await raf();
  var sel=d.getElementById('form-away');sel.value='4-4-2';
  sel.dispatchEvent(new w.Event('change',{bubbles:true}));await raf();
  ok('la formación visitante coloca jugadores',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);
  d.querySelector('[data-view="half"]').click();await wait(150);
  ok('el medio campo se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="blank"]').click();await wait(150);
  ok('la superficie libre se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="full"]').click();await wait(150);

  /* --- los once caen dentro de lo que se está viendo ---
     Las formaciones están escritas sobre el campo entero. En medio campo, el
     visitante se colocaba en la mitad de enfrente: pulsabas «Colocar equipo
     visitante» y no aparecía nadie, porque los once estaban fuera del
     encuadre. Se comprueba con las piezas, no con píxeles: el dibujo recorta,
     y lo que hay que saber es dónde han quedado. */
  /* Los límites de lo que se ve, escritos aquí a mano para no preguntárselos a
     quien se está probando: el campo lleva un margen de fuera de banda del
     3,5 % del largo (3,675 m en fútbol 11) y la zona de trabajo son los 32 m
     centrales con 2 m de respiro. */
  var encuadres=[['full',-3.7,108.7],['half',-3.7,56.2],['area',34.5,70.5]];
  var seEscapan=[];
  for (var iE=0;iE<encuadres.length;iE++){
    var e=encuadres[iE];
    d.querySelector('[data-view="'+e[0]+'"]').click();await wait(200);
    ['form-home','form-away'].forEach(function(id){
      var s2=d.getElementById(id);
      s2.value='4-4-2';
      s2.dispatchEvent(new w.Event('change',{bubbles:true}));
    });
    await wait(1300);                      // el autoguardado va con retardo
    var guardado=JSON.parse(w.localStorage.getItem('pt-autosave')||'{}');
    /* El fotograma que está delante, que a estas alturas de la batería no
       tiene por qué ser el primero: la formación se coloca en ese. */
    var cual=Math.max(0,[].map.call(d.querySelectorAll('#frames .frame'),function(b){
      return b.getAttribute('aria-pressed')==='true';}).indexOf(true));
    (function(enc){
      ((guardado.frames||[])[cual]||{objects:[]}).objects
        .filter(function(o){return o.kind==='player';})
        .forEach(function(o){
          if(o.x<enc[1]-1||o.x>enc[2]+1) seEscapan.push(enc[0]+' '+o.team+' x='+Math.round(o.x));
        });
    })(e);
  }
  d.querySelector('[data-view="full"]').click();await wait(150);
  ok('una formación cae dentro del encuadre que haya, sea cual sea',
     seEscapan.length===0, seEscapan.slice(0,6).join(' · ') || 'los 22 dentro en los tres encuadres');

  var threw=null,got=false,old=w.HTMLCanvasElement.prototype.toBlob;
  w.HTMLCanvasElement.prototype.toBlob=function(cb){got=true;try{cb(new w.Blob(['x']));}catch(e){}};
  try{d.getElementById('ex-png').click();}catch(e){threw=e.message;}
  await wait(450);
  w.HTMLCanvasElement.prototype.toBlob=old;
  ok('exportar a PNG no lanza errores',!threw&&got,threw||'');
  // La pizarra corre dentro de un iframe, donde el navegador bloquea las descargas:
  // debe recurrir al diálogo que muestra el archivo para copiarlo a mano.
  d.getElementById('ex-json').click(); await wait(500);
  var fdlg=d.getElementById('dlg-file');
  ok('exportar a JSON embebido abre el diálogo de archivo',fdlg.open);
  ok('el diálogo trae el JSON de la pizarra',
     (d.getElementById('file-text').value||'').indexOf('"frames"')>0,
     (d.getElementById('file-text').value||'').slice(0,40));
  d.querySelector('#dlg-file [data-close]').click(); await raf();
  d.getElementById('help').click();await raf();
  ok('el diálogo de ayuda se abre',d.getElementById('dlg-help').open);
  /* La ayuda decía «diez ejercicios» con sesenta y cuatro dentro. Un número
     escrito a mano en una ayuda envejece solo, así que lo cuenta la propia
     biblioteca y aquí se comprueba contra ella. */
  /* Se cuentan aparte, desde el mismo archivo del que tira la aplicación. Que
     «tests/catalogo.mjs» ya comprueba que todos son buenos es lo que permite
     contarlos aquí a secas. */
  var cuantosHay=(await fetch('../assets/biblioteca.json').then(function(r){return r.json();}))
                 .ejercicios.length;
  ok('la ayuda dice cuántos ejercicios trae la biblioteca, contándolos',
     new RegExp('los '+cuantosHay+' ejercicios')
       .test(d.getElementById('help-cuantos').textContent),
     d.getElementById('help-cuantos').textContent+' · hay '+cuantosHay);
  ok('y cuenta también el otro lado de la aplicación',
     /plantilla/i.test(d.getElementById('dlg-help').textContent) &&
     /partidos/i.test(d.getElementById('dlg-help').textContent));
  d.querySelector('#dlg-help [data-close]').click();await raf();
  ok('el diálogo se cierra',!d.getElementById('dlg-help').open);
  d.querySelector('[data-place="text"]').click();await raf();
  pointerAt(w,cv,500,240,'pointerdown');pointerAt(w,cv,500,240,'pointerup');await raf();
  ok('colocar texto abre el diálogo propio',d.getElementById('dlg-ask').open);
  var pt=region(cv,500,240,40);
  d.getElementById('ask-input').value='Presión alta';
  d.getElementById('ask-ok').click();await raf();
  ok('el texto se escribe en el campo',region(cv,500,240,40)!==pt);
  ok('el diálogo se cierra al aceptar',!d.getElementById('dlg-ask').open);

  d.querySelector('[data-tool="select"]').click();
  d.getElementById('clear').click();await raf();
  ok('vaciar pide confirmación en un diálogo',d.getElementById('dlg-ask').open);
  d.querySelector('#dlg-ask [data-close]').click();await raf();
  ok('cancelar no vacía el fotograma',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);

  var lp=d.getElementById('loop');
  lp.click();await raf();
  ok('el bucle se activa como interruptor',lp.getAttribute('aria-pressed')==='true');
  lp.click();await raf();
  var sp=d.getElementById('speed'),v0=sp.textContent;
  sp.click();await raf();
  ok('la velocidad cambia al pulsarla',sp.textContent!==v0,v0+' -> '+sp.textContent);

  // giro: ahora TODO el material se puede girar
  var rotables=['cone','disc','pole','ring','flag','goal','minigoal','hurdle','ladder','dummy'];
  var okRot=true,dr='';
  for(var r0=0;r0<rotables.length;r0++){
    d.querySelector('[data-place="'+rotables[r0]+'"]').click();await raf();
    var RX=260+r0*62,RY=560;
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    d.querySelector('[data-tool="select"]').click();await raf();
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    var rb=d.querySelector('#inspector [data-rot="90"]');
    if(!rb){okRot=false;dr+=rotables[r0]+' sin botón de giro; ';continue;}
    var pre=region(cv,RX,RY,30);
    rb.click();await raf();
    if(region(cv,RX,RY,30)===pre){okRot=false;dr+=rotables[r0]+' no cambia al girar; ';}
  }
  ok('las 10 piezas de material se pueden girar',okRot,dr);

  // la página no debe poder desplazarse
  var scrollable=await new Promise(function(res){
    w.scrollTo(0,300);
    setTimeout(function(){res(w.scrollY!==0||d.documentElement.scrollHeight>d.documentElement.clientHeight+1);},60);
  });
  ok('la pantalla de la pizarra no hace scroll',!scrollable,
     'scrollY='+w.scrollY+' alto='+d.documentElement.scrollHeight+'/'+d.documentElement.clientHeight);

  // --- zoom con dos dedos ---
  function two(type,a,b2){
    var r=cv.getBoundingClientRect();
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+a[0],clientY:r.top+a[1],pointerId:11,isPrimary:true,bubbles:true,buttons:1}));
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+b2[0],clientY:r.top+b2[1],pointerId:12,isPrimary:false,bubbles:true,buttons:1}));
  }
  var zbtn=d.getElementById('zoom');
  ok('el botón de ajustar está oculto al inicio',zbtn.hidden);
  var antes=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  two('pointerdown',[380,300],[520,300]);
  two('pointermove',[300,300],[600,300]);
  await raf();
  ok('el pellizco acerca el campo',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==antes);
  ok('aparece el botón de ver el campo entero',!zbtn.hidden);
  two('pointerup',[300,300],[600,300]);
  await raf();
  var conZoom=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  zbtn.click();await raf();
  ok('ajustar devuelve la vista completa',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==conZoom&&zbtn.hidden);

  // tras el gesto se debe poder seguir dibujando con un dedo
  d.querySelector('[data-tool="pass"]').click();await raf();
  var pz=region(cv,500,250,30);
  pointerAt(w,cv,430,290,'pointerdown');
  for(var q=1;q<=6;q++)pointerAt(w,cv,430+q*24,290-q*8,'pointermove');
  pointerAt(w,cv,580,240,'pointerup');await raf();
  ok('después del pellizco se sigue dibujando con un dedo',region(cv,500,250,30)!==pz);

  // --- modalidades de campo ---
  var modal=[['f7','Fútbol 7'],['futsal','Fútbol sala'],['f11','Fútbol 11']];
  var okMod=true,dm='';
  for(var mi=0;mi<modal.length;mi++){
    d.querySelector('[data-pitch="'+modal[mi][0]+'"]').click();
    await wait(200);
    var c0=px(cv,cv.clientWidth/2,cv.clientHeight/2);
    if(!(c0[0]+c0[1]+c0[2]>60)){okMod=false;dm+=modal[mi][0]+' no pinta; ';}
    if(d.querySelector('[data-pitch="'+modal[mi][0]+'"]').getAttribute('aria-pressed')!=='true'){okMod=false;dm+=modal[mi][0]+' sin marcar; ';}
  }
  ok('las tres modalidades de campo se dibujan',okMod,dm);

  d.querySelector('[data-pitch="futsal"]').click(); await wait(200);
  var fsOpts=d.getElementById('form-home').options.length;
  ok('el fútbol sala trae sus propias alineaciones',fsOpts>1&&
     d.getElementById('form-home').options[1].text.indexOf('-')>0,fsOpts+' opciones');
  d.querySelector('[data-pitch="f11"]').click(); await wait(200);
  ok('al volver a fútbol 11 hay 6 sistemas',d.getElementById('form-home').options.length===7,
     d.getElementById('form-home').options.length+' opciones');

  // --- regla ---
  d.querySelector('[data-tool="measure"]').click();await raf();
  var pm=region(cv,500,420,40);
  pointerAt(w,cv,400,380,'pointerdown');
  pointerAt(w,cv,620,470,'pointermove');
  pointerAt(w,cv,620,470,'pointerup');await raf();
  ok('la regla dibuja la medida sobre el campo',region(cv,500,420,40)!==pm);

  // --- vídeo de la jugada ---
  var started=false,stopped=false;
  var RealRec=w.MediaRecorder;
  w.MediaRecorder=function(){ started=true; this.start=function(){}; this.stop=function(){ stopped=true; if(this.onstop)this.onstop(); };
    this.ondataavailable=null; this.onstop=null; };
  w.MediaRecorder.isTypeSupported=function(){return true;};
  if(!w.HTMLCanvasElement.prototype.captureStream)
    w.HTMLCanvasElement.prototype.captureStream=function(){return {};};
  d.getElementById('ex-video').click();
  await wait(220);
  ok('grabar la jugada arranca el grabador',started);
  ok('el botón de exportar se marca mientras graba',d.getElementById('export').classList.contains('rec'));
  await wait(4200);
  ok('la grabación termina sola',stopped&&!d.getElementById('export').classList.contains('rec'));
  w.MediaRecorder=RealRec;

  // --- selección múltiple ---
  d.querySelector('[data-tool="select"]').click();await raf();
  // dejamos tres conos juntos en una esquina despejada
  d.querySelector('[data-place="cone"]').click();await raf();
  var base=[[180,560],[240,560],[300,560]];
  for(var ci=0;ci<base.length;ci++){
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerdown');
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerup');await raf();
  }
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,140,510,'pointerdown');
  pointerAt(w,cv,250,540,'pointermove');
  pointerAt(w,cv,340,610,'pointermove');
  pointerAt(w,cv,340,610,'pointerup');await raf();
  var bar=d.querySelector('#inspector .name');
  ok('el recuadro selecciona varias piezas',!!bar&&/seleccionados/.test(bar.textContent),
     bar?bar.textContent:'sin barra de grupo');

  var antesG=region(cv,240,560,60);
  pointerAt(w,cv,240,560,'pointerdown');
  pointerAt(w,cv,240,470,'pointermove');
  pointerAt(w,cv,240,470,'pointerup');await raf();
  ok('arrastrar mueve todo el grupo a la vez',region(cv,240,560,60)!==antesG);

  d.querySelector('#g-del').click();await raf();
  ok('se puede borrar el grupo entero',!d.getElementById('inspector').classList.contains('show'));

  // --- hoja de la jugada ---
  // Ya no se abre una pestaña nueva: la bloquean el iPhone y los navegadores
  // que van dentro de otra aplicación, y el botón se quedaba muerto.
  d.getElementById('ex-sheet').click();await wait(400);
  ok('la hoja de la jugada pide un título',d.getElementById('dlg-ask').open);
  d.getElementById('ask-ok').click();
  await wait(2400);
  var hojaM=[].filter.call(d.querySelectorAll('iframe'),function(m){
    return m.getAttribute('title')==='Hoja para imprimir'&&!m.id;})[0];
  ok('la hoja se genera con los fotogramas',
     !!hojaM&&hojaM.contentDocument.querySelectorAll('img').length>0,
     hojaM?'marco listo':'no se preparó');
  ok('la hoja sale a tamaño de folio',!!hojaM&&/210mm/.test(hojaM.style.width),
     hojaM?hojaM.style.width:'-');
  if(hojaM&&hojaM.parentNode)hojaM.parentNode.removeChild(hojaM);
  if(d.getElementById('dlg-hoja').open)d.getElementById('dlg-hoja').close();
  await wait(200);

  // --- ficha del ejercicio ---
  /* La ficha ya no es un diálogo aparte: vive dentro de la hoja de guardar,
     detrás de «Añadir detalles». «Ficha del ejercicio» abre esa hoja con el
     plegable ya fuera, que es lo que se comprueba. */
  d.getElementById('ficha-row').click();await wait(200);
  var dlgF=d.getElementById('dlg-save');
  ok('la ficha del ejercicio se abre desde la pizarra',dlgF.open);
  ok('y se abre con los detalles desplegados, no plegados',
     d.getElementById('save-detalles').open);
  ok('la ficha trae la fecha de hoy puesta',/\d{1,2}\/\d{1,2}\/\d{4}/.test(d.getElementById('f-fecha').value),
     d.getElementById('f-fecha').value);

    var FakeVE = function(init){
      var primero = true;
      var real = new RealVE({
        output: function(chunk, meta){
          if (primero) {
            primero = false;
            init.output(chunk, { decoderConfig: { description: new Uint8Array(
              [1,66,0,31,255,225,0,13,103,66,192,31,218,1,64,22,232,6,208,161,53,1,0,4,104,206,9,200]) } });

        error: init.error

      this.configure = function(cfg){
        real.configure({codec:'vp8', width:cfg.width, height:cfg.height,
                        bitrate:cfg.bitrate, framerate:cfg.framerate});
      };
      this.encode = function(f,o){ real.encode(f,o); };
      this.flush  = function(){ return real.flush(); };
      this.close  = function(){ try{ real.close(); }catch(e){} };
      Object.defineProperty(this,'encodeQueueSize',{get:function(){return real.encodeQueueSize;}});
    };
    FakeVE.isConfigSupported = function(cfg){ return Promise.resolve({supported:/^avc1/.test(cfg.codec)}); };
    w.VideoEncoder = FakeVE;

    var mp4Blob = null, realURL2 = w.URL.createObjectURL.bind(w.URL);
    w.URL.createObjectURL = function(b3){ if(b3 && b3.type === 'video/mp4') mp4Blob = b3; return realURL2(b3); };

    if (mp4Blob) {
      var buf = await mp4Blob.arrayBuffer();
      var dv = new DataView(buf);
      function cajas(ini, fin){
        var r = [], q = ini;
        while (q + 8 <= fin) {
          var size = dv.getUint32(q);
          var type = String.fromCharCode(dv.getUint8(q+4),dv.getUint8(q+5),dv.getUint8(q+6),dv.getUint8(q+7));
          if (size < 8 || q + size > fin) break;
          r.push({type:type, start:q, size:size});
          q += size;
        }
        return r;
      }
      function buscar(lista, t2){ for (var q=0;q<lista.length;q++) if (lista[q].type===t2) return lista[q]; return null; }
      function dentro(b4){ return cajas(b4.start+8, b4.start+b4.size); }

      var raiz = cajas(0, buf.byteLength);
      var tipos = raiz.map(function(x){return x.type;}).join(',');
      ok('el MP4 tiene ftyp, mdat y moov', tipos === 'ftyp,mdat,moov', tipos);

      var moov = buscar(raiz,'moov'), mdat = buscar(raiz,'mdat');
      var trak = moov && buscar(dentro(moov),'trak');
      var mdia = trak && buscar(dentro(trak),'mdia');
      var minf = mdia && buscar(dentro(mdia),'minf');
      var stbl = minf && buscar(dentro(minf),'stbl');
      var stsd = stbl && buscar(dentro(stbl),'stsd');
      ok('la jerarquía moov/trak/mdia/minf/stbl/stsd es correcta', !!stsd);

      if (stsd) {
        var avc1 = cajas(stsd.start+16, stsd.start+stsd.size)[0];
        ok('la muestra se declara como avc1', avc1 && avc1.type === 'avc1', avc1 ? avc1.type : 'nada');
        var avcC = avc1 && buscar(cajas(avc1.start+8+78, avc1.start+avc1.size), 'avcC');
        ok('lleva la configuración avcC del códec', !!avcC);

        var stsz = buscar(dentro(stbl),'stsz');
        var nMuestras = stsz ? dv.getUint32(stsz.start+16) : 0;
        ok('hay muestras de vídeo en el índice', nMuestras > 10, nMuestras+' muestras');

        var stco = buscar(dentro(stbl),'stco');
        var offset = stco ? dv.getUint32(stco.start+16) : -1;
        ok('el índice apunta al inicio real de los datos', offset === mdat.start + 8,
           offset+' vs '+(mdat.start+8));
      }
    }

     honrado es decir «trayendo» y no «no hay nada», porque puede que sí haya.
     Exigir uno de los dos hacía que la prueba fallara o no según lo que tardara
     el servidor en contestar. */
  selM.value='';selM.dispatchEvent(new Event('change',{bubbles:true}));await wait(200);
  var busca=d.getElementById('lib-q');
  busca.value='zxqwkj';busca.dispatchEvent(new Event('input',{bubbles:true}));await wait(400);
  ok('una búsqueda sin resultados se queda vacía y lo dice',
     d.querySelectorAll('.lib-card').length===0&&
     /Ningún ejercicio|Trayendo/i.test(d.getElementById('lib-grid').textContent),
     d.getElementById('lib-grid').textContent.slice(0,50));
  busca.value='';busca.dispatchEvent(new Event('input',{bubbles:true}));await wait(300);

  /* ---- el filtro de espacio MIDE, no mira el encuadre ---------------------

     Esto salía del «view» de cada ejercicio, y era un fallo con consecuencias:
     el fútbol sala solo tiene el encuadre «Completo», así que un rondo de ocho
     metros por ocho en una esquina de la pista figuraba como «necesita la
     pista entera» y desaparecía en cuanto alguien filtraba por medio campo.
     En fútbol base, que es compartir campo, eso escondía media biblioteca.

     Se comprueba con el caso que lo destapó: «fs-rondo» se dibuja sobre la
     pista completa y tiene que salir al pedir «un área». */
  var selE=d.getElementById('lib-espacio');
  selP.value='futsal';selP.dispatchEvent(new Event('change',{bubbles:true}));await wait(250);
  var salaTodos=d.querySelectorAll('.lib-card').length;
  selE.value='area';selE.dispatchEvent(new Event('change',{bubbles:true}));await wait(300);
  var enUnArea=titulos();
  ok('un rondo de sala dibujado sobre la pista entera cabe en un área',
     enUnArea.some(function(x){return /rondo/i.test(x);}),
     enUnArea.length+' de '+salaTodos+' de sala caben en un área');
  ok('y filtrar por espacio deja fuera a los que no caben',
     enUnArea.length>0&&enUnArea.length<salaTodos,
     enUnArea.length+' < '+salaTodos);

  /* Y al revés: lo que de verdad ocupa la pista entera no puede aparecer
     cuando se pide un área. Si esto no se comprobara, el filtro podría
     «arreglarse» dejando pasar todo. */
  ok('lo que sí necesita la pista entera no sale al pedir un área',
     !enUnArea.some(function(x){return /3-1/i.test(x);}), enUnArea.join(' · ').slice(0,90));
  selE.value='';selE.dispatchEvent(new Event('change',{bubbles:true}));await wait(250);

  d.getElementById('lib-limpiar').click();await wait(300);
  ok('quitar filtros vuelve a tu modalidad, no a todo',
     d.querySelectorAll('.lib-card').length===total&&d.getElementById('lib-pitch').value==='f11');
  ok('la biblioteca general dice de dónde sale y de cuándo es',
     /trae la aplicación/.test(d.getElementById('lib-nota').textContent)&&
     /\d+\/\d+\/\d{4}/.test(d.getElementById('lib-nota').textContent),
     d.getElementById('lib-nota').textContent);
  /* --- compartir desde la biblioteca ---
     Pasarle un ejercicio a otro entrenador se hace con la biblioteca delante,
     no después de abrirlo. Por eso el botón tiene que estar en TODAS las
     tarjetas, y lo que mande tiene que ser ese ejercicio y no lo que hubiera en
     la pizarra. */
  var tarjetas=d.querySelectorAll('.lib-card');
  var conIcono=d.querySelectorAll('.lib-card .lib-pie .tbtn.icono');
  ok('cada ejercicio lleva su botón de compartir',
     tarjetas.length>0&&conIcono.length===tarjetas.length,
     conIcono.length+' de '+tarjetas.length);
  if(conIcono.length){
    var bIco=conIcono[0],rIco=bIco.getBoundingClientRect();
    ok('el botón de compartir se ve y se puede pulsar con el dedo',
       !!bIco.querySelector('svg')&&rIco.width>=34&&rIco.height>=34,
       Math.round(rIco.width)+'×'+Math.round(rIco.height)+' px');
    ok('y dice lo que hace, también a quien no lo ve',
       /por enlace/.test(bIco.title||'')&&bIco.getAttribute('aria-label')===bIco.title,
       bIco.title);

    // Se finge la hoja del teléfono para ver qué se le entrega.
    var mandado=null,shareAntes=w.navigator.share;
    try{w.navigator.share=function(x){mandado=x;return Promise.resolve();};}catch(e){}
    if(w.navigator.share!==shareAntes){
      var suNombre=tarjetas[0].querySelector('.lib-txt b').textContent;
      bIco.click();await wait(700);
      ok('pulsar compartir abre la hoja del teléfono con ese ejercicio',
         !!mandado&&mandado.text===suNombre,mandado?mandado.text:'(no se abrió)');
      ok('y la jugada va dentro del enlace, detrás del #',
         !!mandado&&/#[^#]+=/.test(mandado.url||''),
         mandado?(mandado.url||'').length+' caracteres':'');
      ok('compartir no es abrir: la biblioteca se queda donde estaba',
         d.getElementById('dlg-lib').open&&
         d.querySelectorAll('.lib-card').length===tarjetas.length);
      try{w.navigator.share=shareAntes;}catch(e){}
    }
  }

  // --- mandar la jugada por enlace ---
  // La jugada viaja dentro del enlace. Lo que hay que comprobar no es que el
  // texto sea bonito, sino que lo que entra sale idéntico: con su ficha, con
  // sus fotogramas y, sobre todo, con la identidad de cada pieza intacta entre
  // fotogramas, que es de lo que depende que la jugada se anime en vez de
  // parpadear.
  var E=w.PTEnlace;
  ok('el enlace de la jugada está montado',!!E&&typeof E.direccion==='function');
  if(E){
    var jugada={pitch:'f7',view:'half',
      card:{titulo:'Jugada de prueba',objetivo:'Comprobar el enlace',consignas:'Una\nY otra'},
      frames:[0,1,2].map(function(i){return {
        objects:[{id:'aa',kind:'player',team:'home',num:'7',x:10+i*3,y:20+i*1.5,rot:0},
                 {id:'bb',kind:'cone',x:30,y:12,rot:45},
                 {id:'cc',kind:'ball',x:11+i*3,y:21+i*1.5,rot:0}],
        strokes:i===0?[{id:'dd',tool:'pass',color:'#F1C40F',width:0.32,
                        pts:[{x:10,y:20},{x:22,y:26}]}]:[]};})};
    var txt=await E.empaqueta(jugada);
    var v=await E.desempaqueta(txt);
    ok('la jugada vuelve entera del enlace',
       !!v&&v.pitch==='f7'&&v.view==='half'&&v.frames.length===3,
       v?v.pitch+' · '+v.frames.length+' fotogramas':'no vuelve');
    ok('con su ficha',v&&v.card.titulo==='Jugada de prueba'&&/Y otra/.test(v.card.consignas||''));
    ok('con sus trazos',v&&v.frames[0].strokes.length===1&&v.frames[0].strokes[0].tool==='pass');
    ok('y con las posiciones en su sitio',
       v&&Math.abs(v.frames[2].objects[0].x-16)<0.06&&Math.abs(v.frames[2].objects[0].y-23)<0.06,
       v?v.frames[2].objects[0].x+','+v.frames[2].objects[0].y:'-');
    var ids0=v?v.frames[0].objects.map(function(o){return o.id;}).sort().join(','):'';
    ok('cada pieza conserva su identidad en todos los fotogramas (si no, no se anima)',
       v&&v.frames.every(function(f){
         return f.objects.map(function(o){return o.id;}).sort().join(',')===ids0;}),ids0);
    ok('lo que se movía se ha movido y lo que no, no',
       v&&v.frames[2].objects[0].x>v.frames[0].objects[0].x&&
       v.frames[2].objects[1].x===v.frames[0].objects[1].x);
    var dir=await E.direccion(jugada,'https://klym.xyz/app/');
    ok('la dirección lleva la jugada detrás del #',/^https:\/\/klym\.xyz\/app\/#j=/.test(dir));
    ok('y una jugada normal cabe en cualquier sitio',dir.length<E.comodo,dir.length+' caracteres');
    var rotos=await Promise.all(['','basura','!!!','AAAA'].map(function(m){return E.desempaqueta(m);}));
    ok('un enlace roto no revienta: devuelve nada',
       rotos.every(function(x){return x===null||typeof x==='object';}));
  }

  // --- la nube, esté configurada o no, no puede romper nada ---
  var conNube=w.PTNube&&w.PTNube.hay();
  // Compartir se ve siempre: si desaparece, quien lo busca cree que la
  // aplicación no le deja compartir.
  ok('el botón de compartir siempre está',!d.getElementById('compartir').hidden);
  ok('la cuenta solo se ofrece si hay servidor detrás',
     conNube ? !!d.getElementById('cuenta-entrar') : !d.getElementById('cuenta-entrar'),
     conNube ? 'con servidor' : 'sin servidor');

  /* --- la cuenta, a la vista y a un toque ---

     Estaba al final de Ajustes, detrás de un scroll, y en el móvil dentro de
     Equipo no se llegaba DE NINGUNA MANERA: esa pantalla no tiene «Más», que
     es donde vive Ajustes en el teléfono. Así que lo que se comprueba no es
     que el botón exista, sino que se llega a la cuenta desde los dos modos y
     en los dos tamaños, que es lo que fallaba. */
  var anchoOrig=w.innerWidth;
  var veAncho=function(id){var e=d.getElementById(id);return !!(e&&e.offsetParent!==null);};
  if(conNube){
    ok('el botón de la cuenta está en la barra, sin abrir nada',veAncho('cuenta-btn'));
    ok('y dice lo que hace cuando no has entrado',
       /entrar/i.test(d.getElementById('cuenta-btn').getAttribute('aria-label')||''),
       d.getElementById('cuenta-btn').getAttribute('aria-label'));
    // La prueba de fondo: los dos modos. Equipo era el que no tenía salida.
    var modos=['pizarra','hoy'],llega=[];
    for(var iM=0;iM<modos.length;iM++){
      await irA(d,modos[iM]);
      var seVeAqui=veAncho('cuenta-btn');
      d.getElementById('cuenta-btn').click();await wait(350);
      var abrio=d.getElementById('dlg-cuenta').open;
      if(d.getElementById('dlg-cuenta').open)d.querySelector('#dlg-cuenta [data-close]').click();
      await wait(250);
      llega.push(modos[iM]+(seVeAqui&&abrio?' sí':' NO'));
    }
    ok('se llega a la cuenta desde los dos modos',
       llega.join(' ').indexOf('NO')<0,llega.join(' · '));
    await irA(d,'pizarra');await wait(300);
    // Y la cuenta ya no vive dentro de Ajustes: son dos diálogos distintos.
    ok('la cuenta tiene diálogo propio, no un rincón de Ajustes',
       !!d.getElementById('dlg-cuenta')&&
       !d.getElementById('dlg-cfg').contains(d.getElementById('cuenta-entrar')));

    /* El apretón está aquí, en Pizarra: es el modo que llena la barra. Cabe
       porque la Biblioteca bajó a la hoja de «Más». La barra recorta por los
       lados sin avisar, así que si alguien la sube otra vez el botón de la
       cuenta desaparece y nada falla: por eso se MIDE, no se mira si existe. */
    var anchosB=[430,390,360,320],apretados=[];
    for(var iB=0;iB<anchosB.length;iB++){
      fr.style.width=anchosB[iB]+'px';await wait(320);
      var bar=d.querySelector('.topbar').getBoundingClientRect();
      var rb=d.getElementById('cuenta-btn').getBoundingClientRect();
      if(!(rb.width>0&&rb.left>=bar.left-0.5&&rb.right<=bar.right+0.5)){
        apretados.push(anchosB[iB]+'px →'+Math.round(rb.right)+' de '+Math.round(bar.right));
      }
    }
    fr.style.width='';await wait(320);
    ok('en Pizarra el botón de la cuenta cabe en la barra a cualquier ancho de móvil',
       apretados.length===0,apretados.join(' · ')||'430·390·360·320 px');

    /* Cabe el botón, pero NO la palabra: por debajo de 430 px la barra se
       queda sin sitio y «Entrar» se esconde. Entonces la única puerta es una
       silueta muda que además se parece al icono del modo Equipo. Así que en
       el móvil tiene que haber, en alguna parte, una puerta con su nombre
       escrito. Se comprueba lo que importa —que se pueda leer y que lleve a la
       cuenta—, no dónde está puesta. */
    fr.style.width='390px';await wait(400);
    var palabraArriba=d.getElementById('cuenta-btn-txt');
    var seLeeArriba=palabraArriba&&palabraArriba.offsetParent!==null;
    d.querySelector('.tab[data-section="b-actions"]').click();await wait(500);
    var fila=d.getElementById('cuenta-row');
    var seLeeAbajo=!!(fila&&fila.offsetParent!==null&&/entrar/i.test(fila.textContent));
    ok('en el móvil se entra desde un sitio que dice «entrar», no solo desde un icono',
       seLeeArriba||seLeeAbajo,
       'arriba: '+seLeeArriba+' · en el panel: '+(fila?fila.textContent.trim():'no hay'));

    /* Y en la BARRA, que es donde se busca. Un icono de silueta en una barra
       llena de iconos finos no se lee como «entrar», y encima se parece al del
       modo Equipo que tiene al lado. A 320 px no cabe la palabra y se acepta
       —ahí la puerta escrita es la del panel—, pero de 360 para arriba, que es
       donde está cualquier teléfono en uso, tiene que estar escrita. */
    var conPalabra=[],sinPalabra=[];
    for(var iP=0;iP<3;iP++){
      var anP=[360,390,430][iP];
      fr.style.width=anP+'px';await wait(420);
      var bt=d.getElementById('cuenta-btn');
      var pal=d.getElementById('cuenta-btn-txt');
      var seLee=!!(pal&&pal.offsetParent!==null&&/entrar/i.test(pal.textContent));
      var barra=d.querySelector('.topbar').getBoundingClientRect();
      var rr=bt.getBoundingClientRect();
      var cabeEntero=rr.width>0&&rr.left>=barra.left-0.5&&rr.right<=barra.right+0.5;
      (seLee&&cabeEntero?conPalabra:sinPalabra).push(anP+'px'+(seLee?'':' sin palabra')+
        (cabeEntero?'':' SE SALE'));
    }
    fr.style.width='390px';await wait(400);
    ok('y en la barra de arriba pone «Entrar», entero y sin salirse',
       sinPalabra.length===0,sinPalabra.join(' · ')||conPalabra.join(' · '));
    if(seLeeAbajo){
      fila.click();await wait(450);
      ok('y esa puerta abre la cuenta de verdad',d.getElementById('dlg-cuenta').open);
      if(d.getElementById('dlg-cuenta').open)d.querySelector('#dlg-cuenta [data-close]').click();
      await wait(250);
    }
    // Desde la biblioteca, «Mías» sin sesión también ofrece entrar sin salir a buscarlo.
    d.getElementById('open').click();await wait(1100);
    d.querySelectorAll('.lib-tab')[1].click();await wait(500);
    var desdeLib=d.getElementById('lib-entrar');
    ok('y en «Mías», donde viene a cuento, se entra sin salir a buscar el botón',
       !!(desdeLib&&desdeLib.offsetParent!==null),
       d.getElementById('lib-nota').textContent.slice(0,90));
    if(desdeLib){
      desdeLib.click();await wait(500);
      ok('y ahí también abre la cuenta',d.getElementById('dlg-cuenta').open);
      if(d.getElementById('dlg-cuenta').open)d.querySelector('#dlg-cuenta [data-close]').click();
      await wait(250);
    }
    /* Se deja la biblioteca como estaba: abierta y en la general. Lo que viene
       después cuenta con ella así, y «entrar» la cierra a propósito. */
    if(!d.getElementById('dlg-lib').open){d.getElementById('open').click();await wait(1100);}
    else{d.querySelectorAll('.lib-tab')[0].click();await wait(500);}
    fr.style.width='';await wait(350);
    // Y lo que bajó a la hoja para dejarle sitio sigue llegando a su sitio.
    ok('y la Biblioteca, que bajó a la hoja, sigue teniendo su fila',
       !!d.getElementById('open-row'));
  }
  d.getElementById('compartir').click();await wait(500);
  if(conNube){
    // Con servidor, compartir sube a la biblioteca de todos, y para eso pide cuenta.
    ok('compartir lleva a crear cuenta cuando no la tienes',
       d.getElementById('dlg-ask').open&&/^Compartir «/.test(d.getElementById('ask-title').textContent),
       d.getElementById('ask-title').textContent);
    ok('y explica que se crea sin confirmar nada',
       /sin confirmar/.test(d.getElementById('ask-msg').textContent));
    ok('entrar es correo y contraseña, sin enlaces por correo',
       !!d.getElementById('cuenta-clave'));
    // Registrarse y entrar son cosas distintas: cada una con lo suyo.
    ok('entrar y crear cuenta están separados',
       d.querySelectorAll('#cuenta-modo button').length===2);
    // Hay que abrir el diálogo de la cuenta: cerrado no se ve nada y la
    // comprobación pasaría sola sin comprobar nada.
    if(d.getElementById('dlg-ask').open)d.querySelector('#dlg-ask [data-close]').click();
    await wait(200);
    d.getElementById('cuenta-btn').click();await wait(400);
    // Se mira si SE VE, no el display del campo: un hijo de algo oculto
    // conserva su propio display y engaña a la comprobación.
    var seVe=function(id){var e=d.getElementById(id);return !!(e&&e.offsetParent!==null);};
    ok('el botón de la barra abre la cuenta',d.getElementById('dlg-cuenta').open);
    ok('al entrar solo se pide correo y contraseña',
       !seVe('cuenta-alta-nombre')&&!seVe('cuenta-alta-club')&&
       /^Entrar$/.test(d.getElementById('cuenta-entrar').textContent.trim()),
       d.getElementById('cuenta-entrar').textContent);
    d.querySelector('#cuenta-modo [data-modo="crear"]').click();await wait(300);
    ok('al crear cuenta se eligen nombre y club, y el botón lo dice',
       seVe('cuenta-alta-nombre')&&seVe('cuenta-alta-club')&&
       /^Crear cuenta$/.test(d.getElementById('cuenta-entrar').textContent.trim()),
       d.getElementById('cuenta-entrar').textContent);

    /* --- el consentimiento ---
       La casilla solo sale al crear la cuenta, que es cuando de verdad se
       acepta algo, y sin marcarla no se crea nada. Lo importante de esta
       comprobación es lo segundo: que el botón NO llame al servidor, no que
       aparezca un aviso. Un aviso bonito con la cuenta ya creada detrás no
       serviría de nada. */
    ok('al crear cuenta se pide aceptar la privacidad y las condiciones',
       seVe('cuenta-acepto-caja'));
    ok('con un enlace a leerlas, no una casilla a ciegas',
       !!d.querySelector('#cuenta-acepto-caja a[href*="privacidad"]'));
    var aceptar=d.getElementById('cuenta-acepto');
    ok('y viene sin marcar: la acepta quien la marca',!aceptar.checked);

    // Se cuenta lo que sale por la red. Sin marcar no puede salir nada.
    var salidas=[],fetchReal=w.fetch;
    w.fetch=function(u){salidas.push(String(u));return fetchReal.apply(this,arguments);};
    d.getElementById('cuenta-email').value='prueba@ejemplo.com';
    d.getElementById('cuenta-clave').value='secreta1';
    d.getElementById('cuenta-entrar').click();await wait(400);
    ok('sin aceptarlas, crear la cuenta no manda nada al servidor',
       !salidas.some(function(u){return /signup|\/auth\/v1\/token/.test(u);}),salidas.join(' '));
    ok('y se dice por qué, no se queda el botón mudo',
       !d.getElementById('cuenta-aviso').hidden&&
       /aceptar/i.test(d.getElementById('cuenta-aviso').textContent),
       d.getElementById('cuenta-aviso').textContent);
    w.fetch=fetchReal;
    d.getElementById('cuenta-email').value='';
    d.getElementById('cuenta-clave').value='';

    /* Entrar con una cuenta que ya existe no vuelve a preguntar: lo que se
       aceptó quedó anotado el día que se creó. */
    d.querySelector('#cuenta-modo [data-modo="entrar"]').click();await wait(200);
    ok('a quien ya tiene cuenta no se le vuelve a preguntar cada vez',
       !seVe('cuenta-acepto-caja'));

    /* --- borrar la cuenta ---
       No se puede deshacer y se lleva por delante lo compartido, así que un
       clic no basta: hay que escribir la palabra. Se prueba el camino de
       verdad —el botón, el diálogo, lo escrito— con la llamada al servidor
       cambiada por una que solo apunta que la han llamado. */
    var borrados=0,borraReal=w.PTNube.borraCuenta;
    w.PTNube.borraCuenta=function(){borrados++;return Promise.resolve(true);};
    d.getElementById('cuenta-dentro').hidden=false;await wait(50);
    /* Y se tiene que ver que borra ESTANDO QUIETO. El aviso vivía solo en el
       «hover», y en un móvil no hay hover: «Borrar mi cuenta» salía calcado a
       «Cambiar la contraseña», que está justo encima. Dos botones iguales y
       uno sin vuelta atrás. */
    var pinta=function(id){var s=w.getComputedStyle(d.getElementById(id));
      return s.color+' | '+s.borderColor;};
    ok('el botón de borrar no se parece al de al lado, sin pasar el ratón',
       pinta('cuenta-borrar')!==pinta('cuenta-clave-nueva'),
       'borrar: '+pinta('cuenta-borrar'));
    d.getElementById('cuenta-borrar').click();await wait(300);
    ok('borrar la cuenta pide confirmarlo escribiendo, no con un clic',
       d.getElementById('dlg-ask').open&&!d.getElementById('ask-field').hidden,
       d.getElementById('ask-title').textContent);
    ok('y avisa de que se lleva lo compartido y no tiene vuelta',
       /no se puede deshacer/i.test(d.getElementById('ask-msg').textContent)&&
       /compartid/i.test(d.getElementById('ask-msg').textContent),
       d.getElementById('ask-msg').textContent);
    /* El aviso y el campo se tocaban: con un mensaje de tres líneas la última
       quedaba debajo del borde del campo y el aro del foco encima de las
       letras. Un aviso que no se lee entero no avisa de nada. */
    var rMsg=d.getElementById('ask-msg').getBoundingClientRect(),
        rCam=d.getElementById('ask-input').getBoundingClientRect();
    ok('y se lee entero: el campo no se le monta encima',
       rCam.top-rMsg.bottom>=8,Math.round(rCam.top-rMsg.bottom)+'px de hueco');
    // Escribiendo otra cosa —o dándole a Aceptar sin más— no se borra nada.
    d.getElementById('ask-input').value='si';
    d.getElementById('ask-ok').click();await wait(300);
    ok('escribiendo cualquier otra cosa no se borra nada',borrados===0);
    // Y con la palabra, sí.
    d.getElementById('cuenta-borrar').click();await wait(300);
    d.getElementById('ask-input').value='borrar';
    d.getElementById('ask-ok').click();await wait(400);
    ok('con la palabra escrita, se borra (y da igual cómo se escriba)',borrados===1);
    w.PTNube.borraCuenta=borraReal;
    d.getElementById('cuenta-dentro').hidden=true;
    if(d.getElementById('dlg-ask').open)d.querySelector('#dlg-ask [data-close]').click();
    await wait(200);
    d.querySelector('#dlg-cuenta [data-close]').click();await wait(250);
  } else {
    ok('sin servidor, compartir prepara el ejercicio para mandarlo',
       d.getElementById('dlg-file').open||d.getElementById('toast').textContent.length>0);
  }
  if(d.getElementById('dlg-ask').open)d.querySelector('#dlg-ask [data-close]').click();

     siguiente campo que se añada. Por eso esto no mira tres campos, los mira

  var deSerie=[];
  [].forEach.call(d.querySelectorAll('input,select,textarea'),function(el){

       ejercicio en crudo la lleva puesta a mano para que las llaves y las
       comas caigan en columna. */
    var cuadrado=parseFloat(s.borderTopLeftRadius)<4;
    var otraLetra=s.fontFamily.indexOf('Inter')<0&&s.fontFamily.indexOf('Outfit')<0&&

    if(cuadrado||otraLetra){
      deSerie.push((el.id||el.placeholder||el.tagName)+
        (cuadrado?' esquinas='+s.borderTopLeftRadius:'')+
        (otraLetra?' letra='+s.fontFamily.split(',')[0]:''));

  function toca(el,tipo,x,y){

     !!guardado&&Object.keys(guardado).length===1,
     guardado?Object.keys(guardado).join(' · '):'-');

  // En el móvil van abiertos: allí la pestaña ya acota.
  marcoP.style.width='390px';await wait(500);
  w.dispatchEvent(new w.Event('resize'));await wait(350);
  ok('en el móvil los bloques van abiertos, que la pestaña ya acota',
     estado().every(function(x){return /abierto$/.test(x);}),estado().join(' · '));
  /* Y ahí su línea vuelve a ser un rótulo. Si se pudiera pulsar, un toque
     plegaría «Materiales» y NADA lo volvería a abrir: en el móvil no hay quien
     lo ajuste salvo girar el teléfono. Casi se me cuela. */
  var rotulos=PLEGABLES.map(function(id){
    var sm=d.getElementById(id).querySelector('summary');
    return id+'='+w.getComputedStyle(sm).pointerEvents;});
  ok('y su rótulo no se puede pulsar: en el móvil no es un mando',
     rotulos.every(function(x){return /=none$/.test(x);}),rotulos.join(' · '));
  marcoP.style.width=anchoP||'1200px';await wait(500);
  w.dispatchEvent(new w.Event('resize'));await wait(300);

  /* --- el cajón -----------------------------------------------------------

     Sustituye al interruptor Pizarra/Equipo de la barra, que ocupaba 145 px
     donde a 320 px sobraban seis. Lo de cerca —las pestañas de abajo— sigue
     donde estaba: el cajón es para saltar lejos. */
  ok('el interruptor de modo ya no está en la barra',
     !d.getElementById('modos'),'#modos');
  var cajon=d.getElementById('cajon');
  ok('y en su sitio hay un cajón, cerrado y fuera del alcance del teclado',
     !!cajon&&!cajon.classList.contains('open')&&cajon.hidden);

  d.getElementById('cajon-btn').click();await wait(400);
  ok('el botón lo abre',cajon.classList.contains('open')&&!cajon.hidden);
  ok('y se ve el velo por encima de todo',
     d.getElementById('cajon-scrim').classList.contains('show'));
  /* El mapa entero. Con dos entradas el cajón no era un mapa, era un
     interruptor con otra forma: no decía de qué va la aplicación. Ahora están
     los cuatro apartados de Equipo —que ya existían como pestañas—, la
     biblioteca, la pizarra y el pie. */
  var DESTINOS=['hoy','sesiones','ejercicios','pizarra','plantilla','partidos',
                'datos','cuenta','ajustes','ayuda'];
  var hay=[].map.call(d.querySelectorAll('.cajon-ir'),function(b){
    return b.dataset.ir;});
  ok('están todos los destinos, y en el orden en que se trabaja',
     hay.join(',')===DESTINOS.join(','),hay.join(' · '));
  ok('la biblioteca es uno de ellos: deja de estar escondida en un botón',
     hay.indexOf('ejercicios')>=0);
  ok('y los tres de abajo van aparte, que no son sitios a los que ir',
     [].every.call(d.querySelectorAll('.cajon-pie .cajon-ir'),function(b){
       return ['cuenta','ajustes','ayuda'].indexOf(b.dataset.ir)>=0;})&&
     d.querySelectorAll('.cajon-pie .cajon-ir').length===3);
  ok('y marcada la que estás mirando',
     (d.querySelector('.cajon-ir[aria-current="true"]')||{}).dataset.ir==='pizarra');
  /* «Entrar» solo si hay servidor detrás. En el archivo suelto —el que se manda
     por correo— no lo hay, y un destino que no lleva a ninguna parte es peor
     que no tenerlo. Las otras tres puertas a la cuenta ya se apagaban ahí. */
  var hayServidor=!!(w.PTNube&&w.PTNube.hay());
  ok('y «Entrar» solo está puesto si hay servidor detrás',
     d.querySelector('.cajon-ir[data-ir="cuenta"]').hidden===!hayServidor,
     hayServidor?'con servidor':'sin servidor');

  /* Las pistas. Sin ellas la lista son nueve nombres; con ellas es lo que te
     guía, porque ves dónde te falta trabajo sin entrar a mirar. Esta pizarra
     arranca sin plantilla: es el primer día de cualquiera. */
  function pista(id){
    var e=d.querySelector('[data-pista="'+id+'"]');
    return e?e.textContent.trim():'(no está)';}
  ok('sin plantilla, «Hoy» es por donde se empieza',
     pista('hoy')==='Empieza por aquí',pista('hoy'));
  ok('y la plantilla lo dice sin rodeos',
     pista('plantilla')==='Sin montar todavía',pista('plantilla'));
  ok('y Datos no finge que hay nada apuntado',
     /Cuando apuntes algo/.test(pista('datos')),pista('datos'));

  /* La misma pantalla, el mismo nombre en todos los sitios. El cajón la
     llamaba «Análisis» y las dos barras de pestañas, «Datos»; y a la
     biblioteca, «Ejercicios» en el cajón y «Biblioteca» en la barra de arriba.
     Con eso uno se queda pensando si son dos sitios distintos. */
  var desiguales=[].filter.call(d.querySelectorAll('.cajon-ir[data-ir]'),function(b){
    var tab=d.querySelector('.tabbar-eq [data-eq="'+b.dataset.ir+'"]');
    if(!tab) return false;
    return b.querySelector('span').textContent.trim().toLowerCase()!==
           tab.textContent.trim().toLowerCase();
  }).map(function(b){
    return b.dataset.ir+': «'+b.querySelector('span').textContent.trim()+'» vs «'+
           d.querySelector('.tabbar-eq [data-eq="'+b.dataset.ir+'"]').textContent.trim()+'»';});
  ok('cada pantalla se llama igual en el cajón que en las pestañas',
     desiguales.length===0, desiguales.join(' · ') || 'todas coinciden');

  // Escape lo cierra, que es lo que espera cualquiera.
  d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  await wait(400);
  ok('Escape lo cierra',!cajon.classList.contains('open'));

  await irA(d,'hoy');
  ok('elegir una sección lleva a ella y cierra el cajón',
     d.querySelector('.app').dataset.modo==='equipo'&&!cajon.classList.contains('open'));
  ok('y el botón dice dónde estás: un icono de tres rayas solo dice «hay más»',
     d.getElementById('cajon-btn-txt').textContent==='Hoy',
     d.getElementById('cajon-btn-txt').textContent);

  /* Los cuatro apartados de Equipo llevan a SU apartado, no a Equipo a secas.
     Era el riesgo de subirlos: que el cajón te dejara en la pestaña de antes. */
  var llegadas=[];
  var APS=[['sesiones','sesiones'],['plantilla','plantilla'],['partidos','partidos'],
           ['datos','datos'],['hoy','hoy']];
  for(var iA=0;iA<APS.length;iA++){
    await irA(d,APS[iA][0]);
    var sel=d.querySelector('.tabbar-eq [aria-selected="true"]');
    llegadas.push(APS[iA][0]+'→'+((sel&&sel.dataset.eq)||'?'));
  }
  ok('cada apartado del cajón abre el suyo, no el último que miraste',
     llegadas.every(function(x){var p=x.split('→');return p[0]===p[1];}),
     llegadas.join(' · '));

  // Y el de la biblioteca la abre sin moverte de sitio.
  var dondeEstaba=d.querySelector('.app').dataset.modo;
  await irA(d,'ejercicios');
  ok('«Ejercicios» abre la biblioteca',d.getElementById('dlg-lib').open);
  ok('y no te saca de donde estabas',
     d.querySelector('.app').dataset.modo===dondeEstaba);
  d.getElementById('dlg-lib').close();await wait(250);

  // Ajustes y Ayuda igual: abren lo suyo y te dejan donde estás.
  await irA(d,'ajustes');
  ok('«Ajustes» abre los ajustes',d.getElementById('dlg-cfg').open);
  d.getElementById('dlg-cfg').close();await wait(250);
  await irA(d,'ayuda');
  ok('«Ayuda» abre la ayuda',d.getElementById('dlg-help').open);
  d.getElementById('dlg-help').close();await wait(250);

  /* Volver a la pizarra tiene que MEDIRLA. Aviso para el que venga: no es que
     el campo se quede en blanco —«resize» tiene un suelo de 240 px, así que a
     cero no baja nunca—; es que se queda con la medida VIEJA. Cambias de
     sección, giras el teléfono, vuelves, y el campo está dibujado para un ancho
     que ya no existe. Se comprueba contra el hueco que tiene, no contra cero,
     que es lo que hace que la prueba mida algo.

     Aviso de honestidad para el que venga: NO he conseguido hacerla fallar
     quitando el «resize» de «vaModo». La aplicación vuelve a medir por más de
     un camino, así que esto fija la propiedad, no caza ese fallo concreto. */
  var marcoC=w.frameElement,anchoC=marcoC.style.width;
  await irA(d,'hoy');
  marcoC.style.width='700px';await wait(450);   // girar el teléfono, ya en Equipo
  w.dispatchEvent(new w.Event('resize'));await wait(350);
  await irA(d,'pizarra');
  var lienzo=d.getElementById('board').getBoundingClientRect().width;
  var hueco=d.querySelector('.stage').clientWidth;
  ok('al volver, el campo se mide contra el hueco que hay AHORA',
     Math.abs(lienzo-hueco)<=20,
     Math.round(lienzo)+'px de lienzo para '+hueco+'px de hueco');
  marcoC.style.width=anchoC||'1200px';await wait(450);
  w.dispatchEvent(new w.Event('resize'));await wait(350);

  // --- imprimir sin ventanas emergentes ---
  // En el iPhone y dentro de otras aplicaciones las bloquean, y el botón se
  // quedaba muerto. Ahora se imprime desde un marco del propio documento.
  var emergentes=0,abrirReal=w.open;
  w.open=function(){emergentes++;return abrirReal.apply(w,arguments);};
  d.getElementById('export').click();await wait(300);
  d.getElementById('ex-sheet').click();await wait(400);
  d.getElementById('ask-ok').click();await wait(2500);
  var marcoImp=[].filter.call(d.querySelectorAll('iframe'),function(m){
    return m.getAttribute('title')==='Hoja para imprimir'&&!m.id;})[0];
  ok('imprimir no abre ninguna ventana emergente',emergentes===0,emergentes+' intentos');
  ok('la hoja de la jugada se prepara en un marco de folio',!!marcoImp);
  ok('y lleva dentro el dibujo de la pizarra',
     !!marcoImp&&marcoImp.contentDocument.querySelectorAll('img').length>0);
  w.open=abrirReal;
  if(marcoImp&&marcoImp.parentNode)marcoImp.parentNode.removeChild(marcoImp);
  if(d.getElementById('dlg-hoja').open)d.getElementById('dlg-hoja').close();
  await wait(200);

  /* --- la copia de seguridad de antes de tocar el guardado -----------------

     Lo que hay en este navegador es lo único que hay: no se sincroniza con
     ningún sitio a propósito. Si el guardado se rompe, no hay servidor del que
     recuperar la biblioteca de un entrenador ni un año de asistencia. Va al
     final de la tanda porque recarga la aplicación. */
  ok('un navegador estrenado no se guarda una copia de nada',
     w.localStorage.getItem('pt-backup-v1')===null,
     String(w.localStorage.getItem('pt-backup-v1')).slice(0,40));

  // Se deja algo que perder y se recarga: la copia tiene que salir sola.
  var antesBoards=JSON.stringify({'Rondo de los martes':{at:1,doc:{pitch:'f11',view:'full',
    card:{titulo:'Rondo de los martes'},frames:[{objects:[],strokes:[]}]}}});
  w.localStorage.setItem('pt-boards',antesBoards);
  w.localStorage.setItem('pt-squad',JSON.stringify({actual:'2026/27',
    temporadas:{'2026/27':[{id:'j1',nombre:'Ana Ferrer',dorsal:'7'}]}}));
  w.localStorage.removeItem('pt-backup-v1');

  /* Tras recargar, «w» y «d» apuntan al documento VIEJO. Hay que volver a
     pedírselos al marco, que es lo único que sobrevive a la recarga. */
  var marcoR=w.frameElement;
  var recarga=function(){return new Promise(function(res){
    var alCargar=function(){marcoR.removeEventListener('load',alCargar);setTimeout(res,900);};
    marcoR.addEventListener('load',alCargar);
    marcoR.contentWindow.location.reload();});};
  await recarga();
  var w2=marcoR.contentWindow;
  var copia=null;
  try{copia=JSON.parse(w2.localStorage.getItem('pt-backup-v1'));}catch(e){}
  ok('con algo que perder, al arrancar se guarda una copia',!!copia,
     copia?'hecha el '+String(copia.hecha).slice(0,10):'no hay copia');
  ok('y la copia trae la biblioteca tal cual estaba',
     !!copia&&copia.claves&&copia.claves['pt-boards']===antesBoards,
     copia&&copia.claves?String(copia.claves['pt-boards']).slice(0,50):'-');
  ok('y también la plantilla, que es lo que no se puede volver a escribir',
     !!copia&&copia.claves&&/Ana Ferrer/.test(copia.claves['pt-squad']||''));
  ok('la pizarra a medias se queda fuera: es lo más volátil y lo que más ocupa',
     !!copia&&copia.claves&&!('pt-autosave' in copia.claves),
     copia&&copia.claves?Object.keys(copia.claves).join(' · '):'-');

  /* Y no se refresca nunca más. Una copia que se rehace sola acabaría copiando
     encima lo que se acaba de romper, que es justo cuando hace falta. */
  w2.localStorage.setItem('pt-boards',JSON.stringify({'Otra cosa':{at:2,doc:{}}}));
  await recarga();
  var w3=marcoR.contentWindow;
  var copia2=null;
  try{copia2=JSON.parse(w3.localStorage.getItem('pt-backup-v1'));}catch(e){}
  ok('y no se rehace: sigue siendo la foto de antes, no la de ahora',
     !!copia2&&copia2.claves&&copia2.claves['pt-boards']===antesBoards,
     copia2&&copia2.claves?String(copia2.claves['pt-boards']).slice(0,50):'-');
  ok('la aplicación arranca igual con la copia hecha',
     !!marcoR.contentDocument.getElementById('board'),'el canvas sigue ahí');

  /* --- el cartel de la primera vez ----------------------------------------

     La pizarra se abre sola y funciona sin que nadie te pida nada: ese es el
     principio de la casa y no se toca. Pero entonces quien entra tampoco se
     entera de que detrás hay su equipo, los ejercicios y los partidos, y un
     botón de tres rayas por sí solo no lo dice. Esto lo dice una vez.

     Aquí mismo, con la biblioteca puesta del bloque de antes, NO tiene que
     salir: a quien ya tiene cosas no se le explica su propia aplicación. */
  ok('a quien ya tiene guardado algo no se le enseña el cartel',
     marcoR.contentDocument.getElementById('pista-cajon').hidden,
     'con pt-boards puesto');

  // Y en un navegador estrenado sí.
  w3.localStorage.clear();
  await recarga();
  var w4=marcoR.contentWindow, d4=marcoR.contentDocument;
  var pista=d4.getElementById('pista-cajon');
  ok('en una instalación nueva sí sale, señalando al menú',!pista.hidden);
  /* Y no es un diálogo: si hubiera velo o fuera modal, estaría pidiendo algo
     antes de dejar dibujar, que es justo lo que no se hace aquí. */
  ok('y no bloquea: ni es modal ni tiene velo por debajo',
     pista.tagName!=='DIALOG' && !pista.closest('dialog') &&
     !d4.getElementById('cajon-scrim').classList.contains('show'));
  ok('tampoco tapa el centro del campo, solo la esquina de arriba',
     (function(){var r=pista.getBoundingClientRect();
       var c=d4.getElementById('board').getBoundingClientRect();
       return r.bottom < c.top + c.height/2;})());
  // Se va al primer trazo, sin tocarlo: quien dibuja ya está haciendo lo suyo.
  var lienzo=d4.getElementById('board'), rl=lienzo.getBoundingClientRect();
  lienzo.dispatchEvent(new w4.PointerEvent('pointerdown',{bubbles:true,pointerId:1,
    clientX:rl.left+rl.width/2,clientY:rl.top+rl.height/2}));
  await wait(300);
  ok('se va solo al primer trazo, sin tener que cerrarlo',pista.hidden);
  await recarga();
  ok('y no vuelve nunca más',
     marcoR.contentDocument.getElementById('pista-cajon').hidden);

  ok('sin errores de JavaScript',errors.length===0,errors.join(' | '));
}
function report(){document.getElementById('out').textContent=log.join('\n')+
  '\n\nRESULTADO: '+(fails?fails+' FALLOS':'TODO CORRECTO ('+log.length+' comprobaciones)');
  document.title=fails?'FALLOS':'OK';}
</script></body></html>
