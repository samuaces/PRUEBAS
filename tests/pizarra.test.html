<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pruebas de la pizarra</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}
iframe{width:1200px;height:820px;border:0}#out{white-space:pre;padding:10px;font-size:14px}</style></head>
<body>
<h1 style="font:700 16px system-ui;padding:10px 10px 0;margin:0">Pruebas de la pizarra táctica</h1>
<p style="font:13px system-ui;color:#9aa;padding:0 10px;margin:6px 0">Sirve el repositorio (<code>python3 -m http.server</code>) y abre este archivo. Se ejecuta solo.</p>
<div id="out">ejecutando…</div><iframe id="fr" src="../app/"></iframe>
<script>
var log=[],fails=0;
function ok(n,c,x){log.push((c?'PASA  ':'FALLA ')+n+(x?'  ('+x+')':''));if(!c)fails++;}
function raf(){return new Promise(function(r){setTimeout(r,70);});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var fr=document.getElementById('fr'),errors=[];
fr.addEventListener('load',function(){var w=fr.contentWindow,d=fr.contentDocument;
  w.addEventListener('error',function(e){errors.push(e.message);});
  run(w,d).catch(function(e){log.push('EXCEPCION: '+e.message);fails++;}).then(report);});
function px(cv,x,y){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  return c.getImageData(Math.round(x*dpr),Math.round(y*dpr),1,1).data;}
function pointerAt(w,el,x,y,t){var r=el.getBoundingClientRect();
  el.dispatchEvent(new w.PointerEvent(t,{clientX:r.left+x,clientY:r.top+y,bubbles:true,pointerId:1,isPrimary:true,buttons:1}));}
function region(cv,x,y,s){var c=cv.getContext('2d'),dpr=cv.width/parseFloat(cv.style.width);
  var d=c.getImageData(Math.round((x-s)*dpr),Math.round((y-s)*dpr),Math.round(2*s*dpr),Math.round(2*s*dpr)).data;
  var sum=0;for(var i=0;i<d.length;i+=4)sum+=d[i]+d[i+1]+d[i+2];return sum;}
async function run(w,d){
  await wait(400);
  var cv=d.getElementById('board');
  ok('el canvas existe y tiene tamaño',!!cv&&cv.width>200,cv?cv.width+'x'+cv.height:'no');
  var p=px(cv,cv.clientWidth/2,cv.clientHeight/2);
  ok('el campo se dibuja en verde',p[1]>p[0]&&p[1]>p[2]&&p[1]>40,'rgb('+p[0]+','+p[1]+','+p[2]+')');
  ok('la línea de tiempo arranca con 1 fotograma',d.getElementById('frames').children.length===2);
  ok('el 4-3-3 inicial pinta jugadores',region(cv,cv.clientWidth*0.10,cv.clientHeight*0.5,26)>0);
  var before=region(cv,300,620,22);
  d.querySelector('[data-place="cone"]').click(); await raf();
  ok('la herramienta de colocar queda activa',d.querySelector('[data-place="cone"]').getAttribute('aria-pressed')==='true');
  pointerAt(w,cv,300,620,'pointerdown');pointerAt(w,cv,300,620,'pointerup');await raf();
  ok('al tocar el campo se coloca el cono',region(cv,300,620,22)!==before);
  var mats=['goal','hurdle','ladder','dummy','ring','flag','pole','disc','minigoal','ball','player'],okM=true,det='';
  for(var i=0;i<mats.length;i++){var b=d.querySelector('[data-place="'+mats[i]+'"]');
    if(!b){okM=false;det+=mats[i]+' sin botón; ';continue;} b.click();
    var X=200+i*66,Y=120,pre=region(cv,X,Y,24);
    pointerAt(w,cv,X,Y,'pointerdown');pointerAt(w,cv,X,Y,'pointerup');await raf();
    if(region(cv,X,Y,24)===pre){okM=false;det+=mats[i]+' no pinta; ';}}
  ok('los 11 elementos colocables se dibujan',okM,det);
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,300,620,'pointerdown');await raf();
  ok('el inspector aparece al seleccionar',d.getElementById('inspector').classList.contains('show'));
  pointerAt(w,cv,430,530,'pointermove');pointerAt(w,cv,430,530,'pointerup');await raf();
  ok('arrastrar mueve el objeto',region(cv,430,530,22)!==region(cv,700,620,22));
  var tools=['pass','run','dribble','free'],okT=true,dt='';
  for(var t=0;t<tools.length;t++){d.querySelector('[data-tool="'+tools[t]+'"]').click();await raf();
    var y0=300+t*60,pre=region(cv,700,y0,26);
    pointerAt(w,cv,600,y0+20,'pointerdown');
    for(var k=1;k<=8;k++)pointerAt(w,cv,600+k*26,y0+20-k*4,'pointermove');
    pointerAt(w,cv,810,y0-12,'pointerup');await raf();
    if(region(cv,700,y0,26)===pre){okT=false;dt+=tools[t]+' no pinta; ';}}
  ok('las 4 herramientas de trazo dibujan',okT,dt);
  d.querySelector('[data-tool="zone"]').click();await raf();
  var pz=region(cv,300,250,30);
  pointerAt(w,cv,240,200,'pointerdown');pointerAt(w,cv,380,310,'pointermove');pointerAt(w,cv,380,310,'pointerup');await raf();
  ok('la zona sombreada se dibuja',region(cv,300,250,30)!==pz);
  d.querySelector('.frame.add').click();await raf();
  ok('añadir fotograma crea el segundo',d.getElementById('frames').children.length===3);
  ok('el botón de reproducir se habilita',!d.getElementById('play').disabled);
  d.querySelector('[data-tool="select"]').click();
  var jx=cv.clientWidth*0.10,jy=cv.clientHeight*0.5;
  pointerAt(w,cv,jx,jy,'pointerdown');pointerAt(w,cv,jx+160,jy+40,'pointermove');pointerAt(w,cv,jx+160,jy+40,'pointerup');await raf();
  d.getElementById('play').click();await wait(300);
  ok('la animación arranca',d.getElementById('progress').classList.contains('show'));
  var w1=d.querySelector('#progress i').style.width;await wait(500);
  ok('la animación avanza',w1!==d.querySelector('#progress i').style.width,w1+' -> '+d.querySelector('#progress i').style.width);
  await wait(1800);
  ok('la animación termina sola',!d.getElementById('progress').classList.contains('show'));
  ok('deshacer está disponible',!d.getElementById('undo').disabled);
  d.getElementById('undo').click();await raf();
  ok('rehacer se habilita tras deshacer',!d.getElementById('redo').disabled);
  d.getElementById('redo').click();await raf();
  var sel=d.getElementById('form-away');sel.value='4-4-2';
  sel.dispatchEvent(new w.Event('change',{bubbles:true}));await raf();
  ok('la formación visitante coloca jugadores',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);
  d.querySelector('[data-view="half"]').click();await wait(150);
  ok('el medio campo se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="blank"]').click();await wait(150);
  ok('la superficie libre se redibuja',px(cv,cv.clientWidth/2,cv.clientHeight/2)[1]>40);
  d.querySelector('[data-view="full"]').click();await wait(150);
  var threw=null,got=false,old=w.HTMLCanvasElement.prototype.toBlob;
  w.HTMLCanvasElement.prototype.toBlob=function(cb){got=true;try{cb(new w.Blob(['x']));}catch(e){}};
  try{d.getElementById('ex-png').click();}catch(e){threw=e.message;}
  await wait(450);
  w.HTMLCanvasElement.prototype.toBlob=old;
  ok('exportar a PNG no lanza errores',!threw&&got,threw||'');
  // La pizarra corre dentro de un iframe, donde el navegador bloquea las descargas:
  // debe recurrir al diálogo que muestra el archivo para copiarlo a mano.
  d.getElementById('ex-json').click(); await wait(500);
  var fdlg=d.getElementById('dlg-file');
  ok('exportar a JSON embebido abre el diálogo de archivo',fdlg.open);
  ok('el diálogo trae el JSON de la pizarra',
     (d.getElementById('file-text').value||'').indexOf('"frames"')>0,
     (d.getElementById('file-text').value||'').slice(0,40));
  d.querySelector('#dlg-file [data-close]').click(); await raf();
  d.getElementById('help').click();await raf();
  ok('el diálogo de ayuda se abre',d.getElementById('dlg-help').open);
  d.querySelector('#dlg-help [data-close]').click();await raf();
  ok('el diálogo se cierra',!d.getElementById('dlg-help').open);
  d.querySelector('[data-place="text"]').click();await raf();
  pointerAt(w,cv,500,240,'pointerdown');pointerAt(w,cv,500,240,'pointerup');await raf();
  ok('colocar texto abre el diálogo propio',d.getElementById('dlg-ask').open);
  var pt=region(cv,500,240,40);
  d.getElementById('ask-input').value='Presión alta';
  d.getElementById('ask-ok').click();await raf();
  ok('el texto se escribe en el campo',region(cv,500,240,40)!==pt);
  ok('el diálogo se cierra al aceptar',!d.getElementById('dlg-ask').open);

  d.querySelector('[data-tool="select"]').click();
  d.getElementById('clear').click();await raf();
  ok('vaciar pide confirmación en un diálogo',d.getElementById('dlg-ask').open);
  d.querySelector('#dlg-ask [data-close]').click();await raf();
  ok('cancelar no vacía el fotograma',region(cv,cv.clientWidth*0.90,cv.clientHeight*0.5,26)>0);

  var lp=d.getElementById('loop');
  lp.click();await raf();
  ok('el bucle se activa como interruptor',lp.getAttribute('aria-pressed')==='true');
  lp.click();await raf();
  var sp=d.getElementById('speed'),v0=sp.textContent;
  sp.click();await raf();
  ok('la velocidad cambia al pulsarla',sp.textContent!==v0,v0+' -> '+sp.textContent);

  // giro: ahora TODO el material se puede girar
  var rotables=['cone','disc','pole','ring','flag','goal','minigoal','hurdle','ladder','dummy'];
  var okRot=true,dr='';
  for(var r0=0;r0<rotables.length;r0++){
    d.querySelector('[data-place="'+rotables[r0]+'"]').click();await raf();
    var RX=260+r0*62,RY=560;
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    d.querySelector('[data-tool="select"]').click();await raf();
    pointerAt(w,cv,RX,RY,'pointerdown');pointerAt(w,cv,RX,RY,'pointerup');await raf();
    var rb=d.querySelector('#inspector [data-rot="90"]');
    if(!rb){okRot=false;dr+=rotables[r0]+' sin botón de giro; ';continue;}
    var pre=region(cv,RX,RY,30);
    rb.click();await raf();
    if(region(cv,RX,RY,30)===pre){okRot=false;dr+=rotables[r0]+' no cambia al girar; ';}
  }
  ok('las 10 piezas de material se pueden girar',okRot,dr);

  // la página no debe poder desplazarse
  var scrollable=await new Promise(function(res){
    w.scrollTo(0,300);
    setTimeout(function(){res(w.scrollY!==0||d.documentElement.scrollHeight>d.documentElement.clientHeight+1);},60);
  });
  ok('la pantalla de la pizarra no hace scroll',!scrollable,
     'scrollY='+w.scrollY+' alto='+d.documentElement.scrollHeight+'/'+d.documentElement.clientHeight);

  // --- zoom con dos dedos ---
  function two(type,a,b2){
    var r=cv.getBoundingClientRect();
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+a[0],clientY:r.top+a[1],pointerId:11,isPrimary:true,bubbles:true,buttons:1}));
    cv.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+b2[0],clientY:r.top+b2[1],pointerId:12,isPrimary:false,bubbles:true,buttons:1}));
  }
  var zbtn=d.getElementById('zoom');
  ok('el botón de ajustar está oculto al inicio',zbtn.hidden);
  var antes=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  two('pointerdown',[380,300],[520,300]);
  two('pointermove',[300,300],[600,300]);
  await raf();
  ok('el pellizco acerca el campo',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==antes);
  ok('aparece el botón de ver el campo entero',!zbtn.hidden);
  two('pointerup',[300,300],[600,300]);
  await raf();
  var conZoom=region(cv,cv.clientWidth/2,cv.clientHeight/2,40);
  zbtn.click();await raf();
  ok('ajustar devuelve la vista completa',region(cv,cv.clientWidth/2,cv.clientHeight/2,40)!==conZoom&&zbtn.hidden);

  // tras el gesto se debe poder seguir dibujando con un dedo
  d.querySelector('[data-tool="pass"]').click();await raf();
  var pz=region(cv,500,250,30);
  pointerAt(w,cv,430,290,'pointerdown');
  for(var q=1;q<=6;q++)pointerAt(w,cv,430+q*24,290-q*8,'pointermove');
  pointerAt(w,cv,580,240,'pointerup');await raf();
  ok('después del pellizco se sigue dibujando con un dedo',region(cv,500,250,30)!==pz);

  // --- modalidades de campo ---
  var modal=[['f7','Fútbol 7'],['futsal','Fútbol sala'],['f11','Fútbol 11']];
  var okMod=true,dm='';
  for(var mi=0;mi<modal.length;mi++){
    d.querySelector('[data-pitch="'+modal[mi][0]+'"]').click();
    await wait(200);
    var c0=px(cv,cv.clientWidth/2,cv.clientHeight/2);
    if(!(c0[0]+c0[1]+c0[2]>60)){okMod=false;dm+=modal[mi][0]+' no pinta; ';}
    if(d.querySelector('[data-pitch="'+modal[mi][0]+'"]').getAttribute('aria-pressed')!=='true'){okMod=false;dm+=modal[mi][0]+' sin marcar; ';}
  }
  ok('las tres modalidades de campo se dibujan',okMod,dm);

  d.querySelector('[data-pitch="futsal"]').click(); await wait(200);
  var fsOpts=d.getElementById('form-home').options.length;
  ok('el fútbol sala trae sus propias alineaciones',fsOpts>1&&
     d.getElementById('form-home').options[1].text.indexOf('-')>0,fsOpts+' opciones');
  d.querySelector('[data-pitch="f11"]').click(); await wait(200);
  ok('al volver a fútbol 11 hay 6 sistemas',d.getElementById('form-home').options.length===7,
     d.getElementById('form-home').options.length+' opciones');

  // --- regla ---
  d.querySelector('[data-tool="measure"]').click();await raf();
  var pm=region(cv,500,420,40);
  pointerAt(w,cv,400,380,'pointerdown');
  pointerAt(w,cv,620,470,'pointermove');
  pointerAt(w,cv,620,470,'pointerup');await raf();
  ok('la regla dibuja la medida sobre el campo',region(cv,500,420,40)!==pm);

  // --- vídeo de la jugada ---
  var started=false,stopped=false;
  var RealRec=w.MediaRecorder;
  w.MediaRecorder=function(){ started=true; this.start=function(){}; this.stop=function(){ stopped=true; if(this.onstop)this.onstop(); };
    this.ondataavailable=null; this.onstop=null; };
  w.MediaRecorder.isTypeSupported=function(){return true;};
  if(!w.HTMLCanvasElement.prototype.captureStream)
    w.HTMLCanvasElement.prototype.captureStream=function(){return {};};
  d.getElementById('ex-video').click();
  await wait(220);
  ok('grabar la jugada arranca el grabador',started);
  ok('el botón de exportar se marca mientras graba',d.getElementById('export').classList.contains('rec'));
  await wait(4200);
  ok('la grabación termina sola',stopped&&!d.getElementById('export').classList.contains('rec'));
  w.MediaRecorder=RealRec;

  // --- selección múltiple ---
  d.querySelector('[data-tool="select"]').click();await raf();
  // dejamos tres conos juntos en una esquina despejada
  d.querySelector('[data-place="cone"]').click();await raf();
  var base=[[180,560],[240,560],[300,560]];
  for(var ci=0;ci<base.length;ci++){
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerdown');
    pointerAt(w,cv,base[ci][0],base[ci][1],'pointerup');await raf();
  }
  d.querySelector('[data-tool="select"]').click();await raf();
  pointerAt(w,cv,140,510,'pointerdown');
  pointerAt(w,cv,250,540,'pointermove');
  pointerAt(w,cv,340,610,'pointermove');
  pointerAt(w,cv,340,610,'pointerup');await raf();
  var bar=d.querySelector('#inspector .name');
  ok('el recuadro selecciona varias piezas',!!bar&&/seleccionados/.test(bar.textContent),
     bar?bar.textContent:'sin barra de grupo');

  var antesG=region(cv,240,560,60);
  pointerAt(w,cv,240,560,'pointerdown');
  pointerAt(w,cv,240,470,'pointermove');
  pointerAt(w,cv,240,470,'pointerup');await raf();
  ok('arrastrar mueve todo el grupo a la vez',region(cv,240,560,60)!==antesG);

  d.querySelector('#g-del').click();await raf();
  ok('se puede borrar el grupo entero',!d.getElementById('inspector').classList.contains('show'));

  // --- hoja de sesión ---
  var opened=null,oldOpen=w.open;
  w.open=function(){ opened={html:'',document:{write:function(h){opened.html+=h;},close:function(){}},
    focus:function(){},print:function(){opened.printed=true;}}; return opened; };
  d.getElementById('ex-sheet').click();await wait(400);
  ok('la hoja de sesión pide un título',d.getElementById('dlg-ask').open);
  d.getElementById('ask-ok').click();
  await wait(900);
  w.open=oldOpen;
  ok('la hoja se genera con los fotogramas',!!opened&&/data:image\/png/.test(opened.html),
     opened?String(opened.html.length)+' caracteres':'no se abrió');
  ok('la hoja se manda a imprimir',!!opened&&opened.printed===true);

  // --- hoja de exportación ---
  d.getElementById('export').click();await wait(150);
  ok('el botón de exportar abre la hoja de opciones',d.getElementById('dlg-export').open);
  ok('la hoja ofrece imagen, hoja, vídeo, GIF y archivo',
     ['ex-png','ex-sheet','ex-video','ex-gif','ex-json'].every(function(i){return !!d.getElementById(i);}));
  d.querySelector('#dlg-export [data-close]').click();await raf();

  // --- prioridad de formato: MP4 antes que WebM ---
  var soportados=[];
  var realSupported=w.MediaRecorder.isTypeSupported;
  w.MediaRecorder.isTypeSupported=function(t){ soportados.push(t); return /mp4/.test(t); };
  d.getElementById('export').click();await wait(150);
  var fmt=d.getElementById('ex-video-fmt').textContent;
  w.MediaRecorder.isTypeSupported=realSupported;
  d.querySelector('#dlg-export [data-close]').click();await raf();
  ok('se prefiere MP4 cuando el navegador lo admite',/MP4/.test(fmt),fmt);
  ok('MP4 se consulta antes que WebM',soportados.length>0&&/mp4/.test(soportados[0]),soportados[0]||'nada');

  // --- GIF ---
  var gifBlob=null, realDL=w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL=function(b2){ if(b2&&b2.type==='image/gif') gifBlob=b2; return realDL(b2); };
  d.getElementById('export').click();await wait(150);
  d.getElementById('ex-gif').click();
  await wait(4000);
  w.URL.createObjectURL=realDL;
  ok('el GIF se genera',!!gifBlob,gifBlob?Math.round(gifBlob.size/1024)+' KB':'no se generó');
  if(gifBlob){
    var head=new Uint8Array(await gifBlob.slice(0,6).arrayBuffer());
    ok('el GIF tiene una cabecera válida',String.fromCharCode.apply(null,head)==='GIF89a');
    var okImg=await new Promise(function(res){
      var im=new w.Image();
      im.onload=function(){res(im.naturalWidth>0&&im.naturalHeight>0);};
      im.onerror=function(){res(false);};
      im.src=realDL(gifBlob);
    });
    ok('el navegador decodifica el GIF',okImg);
  }

  ok('sin errores de JavaScript',errors.length===0,errors.join(' | '));
}
function report(){document.getElementById('out').textContent=log.join('\n')+
  '\n\nRESULTADO: '+(fails?fails+' FALLOS':'TODO CORRECTO ('+log.length+' comprobaciones)');
  document.title=fails?'FALLOS':'OK';}
</script></body></html>
