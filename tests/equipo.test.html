<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8">
<title>Pruebas · Mi equipo, asistencia y estadísticas</title>
<style>
 body{font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#0b1017;color:#e8eef6;padding:20px}
 #out{white-space:pre-wrap}
 iframe{position:fixed;left:-9999px;width:900px;height:800px}
 .PASA{color:#5fd48a}.FALLA{color:#ff6b81;font-weight:700}
</style>
<h1>Mi equipo, asistencia y estadísticas</h1>
<p>Sirve el repositorio (<code>python3 -m http.server</code>) y abre este archivo. Se ejecuta solo.</p>
<div id="out">ejecutando…</div><iframe id="fr"></iframe>

<script>
/* Las cuentas de este archivo están hechas a mano, a propósito.

   Si las calculara con el mismo código que estoy probando, la prueba diría que
   sí a cualquier cosa. Cada número que se comprueba aquí abajo está sumado en
   el comentario de al lado: si el día de mañana alguien cambia una regla, la
   prueba tiene que fallar y obligar a mirar. */
var log = [], fails = 0;
function ok(n, c, x){ log.push((c?'PASA  ':'FALLA ') + n + (x ? '  (' + x + ')' : '')); if(!c) fails++; }
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
/* Ir a una sección. El interruptor Pizarra/Equipo de la barra ya no existe: se
   navega por el cajón, que es abrir, elegir y que se cierre solo. Las pruebas
   lo hacen como lo haría un dedo, no llamando por dentro. */
async function irA(d,x){
  d.getElementById('cajon-btn').click();
  await new Promise(function(r){setTimeout(r,320);});
  d.querySelector('.cajon-ir[data-ir="'+x+'"]').click();
  await new Promise(function(r){setTimeout(r,420);});
}


var DIA = 86400000;
var w, d, E;

// Un momento fijo para que las pruebas no cambien de resultado según la hora.
// Martes 15 de septiembre de 2026, mediodía.
var AHORA = new Date('2026-09-15T12:00:00').getTime();

function limpia(){
  /* «pt-borrados» tiene que estar aquí. Son las notas de lo que se ha
     borrado, y si se quedaran de un bloque para otro, un jugador creado en el
     bloque siguiente con el mismo identificador saldría borrado de nacimiento
     y el fallo no se parecería en nada a su causa. */
  ['pt-squad','pt-asistencia','pt-sesiones','pt-partidos','pt-boards','pt-autosave',
   'pt-prefs','pt-catalogo','pt-nube','pt-borrados','pt-llave','pt-sincro']
    .forEach(function(k){ try{ w.localStorage.removeItem(k); }catch(e){} });
}

// Una pizarra guardada a la manera VIEJA, con los jugadores enganchados. Ya no
// se escribe así: se conserva para probar que lo de antes se pasa bien.
function pizarra(nombre, diasAtras, momento, duracion, quienes, temporada){
  return [nombre, {
    at: AHORA - diasAtras * DIA,
    doc: { pitch:'f11', view:'full',
           card:{ titulo:nombre, momento:momento, duracion:duracion },
           frames:[{objects:[],strokes:[]}] },
    meta: { season: temporada || '2026/27',
            participants: quienes.map(function(x){
              return { id:x[0], nombre:x[1], dorsal:x[2] };
            }) }
  }];
}

function iso(t){
  var d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
         '-' + String(d.getDate()).padStart(2,'0');
}

/* Una sesión, a la manera nueva: un día, lo que se hizo y quién vino.
     dia(1, [['Rondo','Calentamiento','12 min',[idA,idB]]], [idA,idB], '2026/27') */
function dia(diasAtras, ejercicios, presentes, temporada){
  return { fecha: iso(AHORA - diasAtras*DIA), temporada: temporada || '2026/27',
           ejercicios: ejercicios, presentes: presentes || null };
}

// Escribe las sesiones y la asistencia de golpe, como quedarían en el almacén.
function siembra(lista){
  var S = {}, A = {};
  lista.forEach(function(s, n){
    S[s.fecha] = { temporada: s.temporada, nombre: s.nombre || '',
      ejercicios: s.ejercicios.map(function(e, i){
        return { id: 'ej' + n + i + 'abc', titulo: e[0], momento: e[1],
                 duracion: e[2], ref: null, quienes: e[3] || null };
      }) };
    if (s.presentes) A[s.fecha] = { temporada: s.temporada, presentes: s.presentes };
  });
  w.localStorage.setItem('pt-sesiones', JSON.stringify(S));
  w.localStorage.setItem('pt-asistencia', JSON.stringify(A));
}

(async function(){
  var fr = document.getElementById('fr');
  await new Promise(function(r){ fr.onload = r; fr.src = '../app/index.html'; });
  w = fr.contentWindow; d = fr.contentDocument;
  await wait(1200);
  E = w.PTEquipo;

  ok('el módulo del equipo está cargado', !!E && typeof E.estadisticas === 'function');
  if(!E){ pinta(); return; }

  // =====================================================================
  console.log('1 · temporadas');
  // La temporada va de julio a junio.
  ok('julio de 2026 ya es la 2026/27',
     E.temporadaDe(new Date('2026-07-01T12:00:00')) === '2026/27',
     E.temporadaDe(new Date('2026-07-01T12:00:00')));
  ok('junio de 2026 todavía es la 2025/26',
     E.temporadaDe(new Date('2026-06-30T12:00:00')) === '2025/26',
     E.temporadaDe(new Date('2026-06-30T12:00:00')));
  ok('marzo de 2027 sigue siendo la 2026/27',
     E.temporadaDe(new Date('2027-03-10T12:00:00')) === '2026/27',
     E.temporadaDe(new Date('2027-03-10T12:00:00')));
  ok('el cambio de siglo no rompe el formato',
     E.temporadaDe(new Date('2099-08-01T12:00:00')) === '2099/00',
     E.temporadaDe(new Date('2099-08-01T12:00:00')));
  ok('la siguiente de la 2026/27 es la 2027/28',
     E.temporadaSiguiente('2026/27') === '2027/28', E.temporadaSiguiente('2026/27'));
  ok('«temporada 26» no vale como formato', !E.temporadaValida('temporada 26'));

  // =====================================================================
  console.log('2 · alta de jugadores y orden');
  limpia();
  var T = E.temporadaActual();
  E.añade(T, { dorsal:'10', nombre:'Diego Ramos',  posicion:'Mediapunta' });
  E.añade(T, { dorsal:'2',  nombre:'Ana Ferrer',   posicion:'Lateral derecho' });
  E.añade(T, { dorsal:'',   nombre:'Zoe Prats',    posicion:'Delantero' });
  E.añade(T, { dorsal:'',   nombre:'Bruno Gil',    posicion:'Central' });
  E.añade(T, { dorsal:'7',  nombre:'Carla Ndiaye', posicion:'Extremo derecho' });

  var orden = E.jugadores().map(function(j){ return j.nombre; }).join(' · ');
  // Por dorsal: 2, 7, 10. Sin dorsal al final y por nombre: Bruno antes que Zoe.
  ok('orden por dorsal, y los sin dorsal al final por nombre',
     orden === 'Ana Ferrer · Carla Ndiaye · Diego Ramos · Bruno Gil · Zoe Prats', orden);
  ok('el dorsal 10 va después del 7 y no antes (no se ordena como texto)',
     E.jugadores()[1].dorsal === '7' && E.jugadores()[2].dorsal === '10');

  var sinNombre = E.añade(T, { dorsal:'5', nombre:'   ' });
  ok('sin nombre no entra nadie', !sinNombre.ok && sinNombre.porque === 'sin-nombre');
  var repe = E.añade(T, { dorsal:'7', nombre:'Otro Siete' });
  ok('un dorsal repetido entra, pero avisa', repe.ok && repe.dorsalRepetido);
  E.quita(T, repe.jugador.id);

  var largo = E.añade(T, { dorsal:'999', nombre:'Tres Cifras' });
  ok('el dorsal se queda en dos cifras', largo.jugador.dorsal === '99', largo.jugador.dorsal);
  E.quita(T, largo.jugador.id);

  var inventada = E.añade(T, { dorsal:'4', nombre:'Sin Puesto', posicion:'Media punta libre' });
  ok('una posición que no está en la lista se descarta', inventada.jugador.posicion === '');
  E.quita(T, inventada.jugador.id);

  // =====================================================================
  console.log('3 · persistencia y temporadas separadas');
  var antes = E.jugadores().length;
  var crudo = JSON.parse(w.localStorage.getItem('pt-squad'));
  ok('la plantilla se guarda en pt-squad', !!crudo && !!crudo.temporadas[T],
     crudo.temporadas[T].length + ' jugadores');
  ok('y sobrevive a releerla del almacén', E.jugadores().length === antes, antes);

  E.cambiaTemporada('2027/28');
  ok('la temporada nueva empieza vacía', E.jugadores().length === 0);
  E.añade('2027/28', { dorsal:'1', nombre:'Nuevo Portero', posicion:'Portero' });
  ok('y lo que se añade va a la temporada nueva', E.jugadores().length === 1);
  E.cambiaTemporada(T);
  ok('al volver, la plantilla vieja sigue entera', E.jugadores().length === antes, antes);

  /* Sin decir temporada, leer y escribir tienen que ir al mismo sitio. Antes
     la lectura iba a la que está en curso y la escritura a una casilla con
     nombre vacío: el jugador se daba por añadido y no aparecía en ningún lado. */
  var aCiegas = E.añade('', { dorsal:'33', nombre:'Sin Temporada', posicion:'Central' });
  ok('añadir sin decir la temporada da de alta de verdad', aCiegas.ok);
  ok('y el jugador sale en la plantilla que se está viendo',
     E.jugadores().length === antes + 1, E.jugadores().length + ' / esperados ' + (antes + 1));
  var guardado = JSON.parse(w.localStorage.getItem('pt-squad'));
  ok('no se ha creado ninguna temporada fantasma',
     Object.keys(guardado.temporadas).every(function (k) { return E.temporadaValida(k); }),
     Object.keys(guardado.temporadas).join(' · '));
  E.quita('', aCiegas.jugador.id);
  ok('y quitarlo sin temporada tampoco lo deja colgado', E.jugadores().length === antes, antes);

  // =====================================================================
  console.log('4 · asistencia');
  var ids = E.jugadores().map(function(j){ return j.id; });
  ok('sin marcar nada, hoy están todos', E.presentesHoy().length === ids.length);
  E.marcaAsistencia(ids[0], false);
  ok('quitar a uno lo deja fuera de hoy',
     E.presentesHoy().length === ids.length - 1 && E.presentesHoy().indexOf(ids[0]) < 0);
  ok('y queda apuntado en el historial, no solo en la sesión',
     !!E.asistenciaEntera()[E.hoyISO()]);
  E.marcaAsistencia(ids[0], true);
  ok('volver a marcarlo lo devuelve', E.presentesHoy().length === ids.length);

  E.ponAsistencia([]);
  ok('«Ninguno» deja el día a cero', E.presentesHoy().length === 0);
  E.ponAsistencia(ids);
  ok('«Todos» los devuelve', E.presentesHoy().length === ids.length);

  // Un jugador que se añade después de marcar la asistencia entra convocado.
  var tarde = E.añade(T, { dorsal:'23', nombre:'Llega Tarde', posicion:'Interior' });
  ok('quien se apunta a media mañana no queda fuera por defecto',
     E.presentesHoy().indexOf(tarde.jugador.id) < 0,
     'queda fuera del día ya cerrado, que es lo correcto');
  E.quita(T, tarde.jugador.id);

  // =====================================================================
  console.log('5 · minutos escritos a mano');
  ok('«12 min» son 12',            E.minutosDe('12 min') === 12);
  ok('«4 × 3 min» son 12, no 4',   E.minutosDe('4 × 3 min') === 12, E.minutosDe('4 × 3 min'));
  ok('«4x3» también son 12',       E.minutosDe('4x3') === 12);
  ok('«3 series de 5 min» son 15', E.minutosDe('3 series de 5 min') === 15,
                                    E.minutosDe('3 series de 5 min'));
  ok('«20 min de 3 toques» son 20, no 3',  E.minutosDe('20 min de 3 toques') === 20,
                                            E.minutosDe('20 min de 3 toques'));
  ok('«4 rondas de 2 min» son 8',          E.minutosDe('4 rondas de 2 min') === 8);
  ok('«unos 15 minutos» son 15',           E.minutosDe('unos 15 minutos') === 15);
  ok('«0 min» es no tener duración', E.minutosDe('0 min') === null);
  ok('«un rato» es no tener duración', E.minutosDe('un rato') === null);
  ok('vacío es no tener duración',   E.minutosDe('') === null);

  // =====================================================================
  console.log('6 · estadísticas, con las cuentas hechas a mano');
  limpia();
  E.cambiaTemporada('2026/27');
  var A = E.añade('2026/27', { dorsal:'7',  nombre:'Ana',   posicion:'Extremo derecho' }).jugador;
  var B = E.añade('2026/27', { dorsal:'9',  nombre:'Bruno', posicion:'Delantero' }).jugador;
  var C = E.añade('2026/27', { dorsal:'11', nombre:'Cleo',  posicion:'Interior' }).jugador;

  var a = [A.id,'Ana','7'], b = [B.id,'Bruno','9'], c = [C.id,'Cleo','11'];
  var todos = [A.id,B.id,C.id], ab = [A.id,B.id], ac = [A.id,C.id];

  /* Siete ejercicios repartidos en siete días. Cada uno dice quién lo hizo, que
     es lo que hace que las cuentas por jugador se puedan echar a mano. */
  var LAS_SESIONES = [
    // díasAtrás  [ título, momento, duración, quiénes ]
    dia(  1, [['Rondo',        'Calentamiento',        '12 min',    todos]]),
    dia(  2, [['Finalización', 'Finalización',         '4 × 5 min', ab]]),     // 20 min
    dia(  5, [['Salida',       'Ataque organizado',    '18 min',    todos]]),
    dia(  9, [['Repliegue',    'Defensa organizada',   '15 min',    ac]]),     // fuera del micro
    dia( 20, [['Juego libre',  'Partido condicionado', 'sin apuntar', todos]]),// sin duración
    dia( 40, [['Corner',       'Balón parado',         '10 min',    [A.id]]]), // fuera del mes
    dia(120, [['Pretemporada', 'Físico-técnico',       '30 min',    [B.id]]],
         null, '2025/26')
  ];
  siembra(LAS_SESIONES);

  // ---- MICROCICLO: 7 días. Entran Rondo(1), Finalización(2) y Salida(5).
  //      Minutos: 12 + 20 + 18 = 50
  var m = E.estadisticas('micro', AHORA);
  ok('microciclo · 3 ejercicios', m.ejercicios === 3, m.ejercicios);
  ok('microciclo · 50 minutos (12 + 20 + 18)', m.minutos === 50, m.minutos);
  ok('microciclo · ninguno sin duración', m.sinDuracion === 0, m.sinDuracion);

  //      Por momento: Finalización 20, Salida 18, Calentamiento 12
  var mm = m.momentos.map(function(x){ return x.nombre + '=' + x.minutos; }).join(' ');
  ok('microciclo · por momento, de mayor a menor',
     mm === 'Finalización=20 Ataque organizado=18 Calentamiento=12', mm);

  /* Lo que se reparte y lo que se queda fuera.

     Aquí estaba el fallo gordo de la auditoría: un ejercicio sin momento del
     juego sumaba sus minutos al total pero no salía en ninguna barra, y el
     porcentaje de cada barra se sacaba contra ese total. Resultado medido: 25
     min de «Ataque organizado» más 20 sin etiquetar enseñaban una sola barra
     que decía 56 %, y del 44 % restante no se hablaba en ninguna parte.

     Ahora hay dos cuentas separadas, y la suma de las barras tiene que cuadrar
     con «minutosConMomento», no con el total. */
  var sumaBarras = m.momentos.reduce(function(a, x){ return a + x.minutos; }, 0);
  ok('lo repartido por momentos cuadra con la suma de las barras',
     m.minutosConMomento === sumaBarras,
     m.minutosConMomento + ' vs ' + sumaBarras);
  ok('y aquí, con todo etiquetado, coincide además con el total',
     m.minutosConMomento === m.minutos && m.sinMomento.ejercicios === 0,
     m.minutosConMomento + '/' + m.minutos + ', ' + m.sinMomento.ejercicios + ' sin momento');

  //      Ana: 12+20+18 = 50 · Bruno: 12+20 = 32 · Cleo: 12+18 = 30
  var mj = {}; m.jugadores.forEach(function(j){ mj[j.nombre] = j.minutos; });
  ok('microciclo · Ana 50 min', mj.Ana === 50, mj.Ana);
  ok('microciclo · Bruno 50 min (12 + 20 + 18, está en los tres)', mj.Bruno === 50, mj.Bruno);
  ok('microciclo · Cleo 30 min (12 + 18, se perdió la finalización)', mj.Cleo === 30, mj.Cleo);
  ok('microciclo · el orden es por minutos',
     m.jugadores.map(function(j){return j.nombre;}).join(',') === 'Ana,Bruno,Cleo',
     m.jugadores.map(function(j){return j.nombre;}).join(','));

  // ---- MES: 30 días. Añade Repliegue(9) y Juego libre(20).
  //      Minutos: 50 + 15 + 0 = 65 · uno sin duración
  var mes = E.estadisticas('mes', AHORA);
  ok('mes · 5 ejercicios', mes.ejercicios === 5, mes.ejercicios);
  ok('mes · 65 minutos (50 + 15, y el sin duración suma 0)', mes.minutos === 65, mes.minutos);
  ok('mes · 1 sin duración', mes.sinDuracion === 1, mes.sinDuracion);
  //      Ana: 50 + 15 + 0 = 65 · Bruno: 32 + 0 = 32 · Cleo: 30 + 15 + 0 = 45
  var mesj = {}; mes.jugadores.forEach(function(j){ mesj[j.nombre] = j.minutos; });
  ok('mes · Ana 65', mesj.Ana === 65, mesj.Ana);
  ok('mes · Cleo 45 (30 + 15)', mesj.Cleo === 45, mesj.Cleo);
  ok('mes · Bruno sigue en 50: no fue al repliegue y el sin duración suma 0',
     mesj.Bruno === 50, mesj.Bruno);
  //      El de «Partido condicionado» no tiene minutos pero SÍ aparece con 0.
  var pc = mes.momentos.filter(function(x){ return x.nombre === 'Partido condicionado'; })[0];
  ok('mes · un ejercicio sin duración sale con 0, no desaparece', !!pc && pc.minutos === 0);

  // ---- TEMPORADA: manda la temporada de la sesión, no la fecha.
  //      Todos los 2026/27: 12+20+18+15+0+10 = 75. El de 2025/26 queda fuera.
  var tmp = E.estadisticas('temporada', AHORA);
  ok('temporada · 6 ejercicios (el de la temporada pasada no entra)',
     tmp.ejercicios === 6, tmp.ejercicios);
  ok('temporada · 75 minutos (12+20+18+15+0+10)', tmp.minutos === 75, tmp.minutos);
  var noEstaPre = tmp.momentos.every(function(x){ return x.nombre !== 'Físico-técnico'; });
  ok('temporada · lo de la 2025/26 no se cuela', noEstaPre);
  //      Ana está en todos los de esta temporada: 12+20+18+15+0+10 = 75
  var tj = {}; tmp.jugadores.forEach(function(j){ tj[j.nombre] = j.minutos; });
  ok('temporada · Ana 75', tj.Ana === 75, tj.Ana);
  ok('temporada · Bruno 50: el córner fue solo de Ana', tj.Bruno === 50, tj.Bruno);

  // ---- Empate a minutos: por orden alfabético, para que no baile.
  siembra([ dia(1, [['Uno', 'Zaga alta', '10 min', [A.id]],
                    ['Dos', 'Achique',   '10 min', [A.id]]]) ]);
  var emp = E.estadisticas('micro', AHORA);
  ok('con los mismos minutos, orden alfabético',
     emp.momentos[0].nombre === 'Achique' && emp.momentos[1].nombre === 'Zaga alta',
     emp.momentos.map(function(x){return x.nombre;}).join(','));

  // =====================================================================
  console.log('7 · el aviso de lo que lleva sin trabajarse');
  siembra(LAS_SESIONES);
  var av = E.estadisticas('micro', AHORA);
  var avn = {}; av.olvidados.forEach(function(o){ avn[o.nombre] = o.dias; });
  // Balón parado: hace 40 días. Partido condicionado: 20 (por debajo de 21).
  ok('avisa del balón parado, 40 días', avn['Balón parado'] === 40, avn['Balón parado']);
  ok('no avisa de lo de hace 20 días, que aún no llega a 21',
     avn['Partido condicionado'] === undefined);
  ok('no avisa de nada que no se haya trabajado nunca',
     av.olvidados.every(function(o){
       return ['Balón parado','Físico-técnico'].indexOf(o.nombre) >= 0;
     }), av.olvidados.map(function(o){return o.nombre+':'+o.dias;}).join(' '));
  ok('el aviso se calcula sobre todo el historial, no sobre el periodo elegido',
     E.estadisticas('temporada', AHORA).olvidados.length === av.olvidados.length,
     av.olvidados.length + ' avisos en los dos periodos');

  // =====================================================================
  console.log('7b · el radar de equilibrio por fase de juego');
  /* De los siete ejercicios de las sesiones, solo cuatro son FASES DE JUEGO:
       Finalización 20 · Ataque organizado 18 · Defensa organizada 15 · Balón parado 10
     Calentamiento, Partido condicionado y Físico-técnico son contenido de
     sesión, no fases, y el radar los deja fuera a propósito. */
  var rMic = E.equilibrio('micro', AHORA);
  //   micro (7 días): Finalización 20 + Ataque 18 = 38 minutos de fase
  ok('radar · micro suma 38 minutos de fase (20 + 18)', rMic.total === 38, rMic.total);
  ok('radar · siempre son seis ejes, pase lo que pase', rMic.ejes.length === 6, rMic.ejes.length);
  var eje = function(r,n){ return r.ejes.filter(function(e){return e.nombre===n;})[0]; };
  //   20/38 = 52,6 %   ·   18/38 = 47,4 %
  ok('radar · micro, Finalización 53 %',
     Math.round(eje(rMic,'Finalización').pct) === 53, Math.round(eje(rMic,'Finalización').pct));
  ok('radar · micro, Ataque organizado 47 %',
     Math.round(eje(rMic,'Ataque organizado').pct) === 47, Math.round(eje(rMic,'Ataque organizado').pct));
  ok('radar · micro, cuatro fases sin tocar', rMic.sinTocar === 4, rMic.sinTocar);
  ok('radar · el calentamiento no entra: no es una fase de juego',
     rMic.ejes.every(function(e){ return e.nombre !== 'Calentamiento'; }));
  ok('radar · ni el partido condicionado',
     rMic.ejes.every(function(e){ return e.nombre !== 'Partido condicionado'; }));

  //   mes: + Defensa 15 → 53 minutos. 20/53=37,7 · 18/53=34,0 · 15/53=28,3
  var rMes = E.equilibrio('mes', AHORA);
  ok('radar · mes suma 53 (20 + 18 + 15)', rMes.total === 53, rMes.total);
  ok('radar · mes, Defensa organizada 28 %',
     Math.round(eje(rMes,'Defensa organizada').pct) === 28, Math.round(eje(rMes,'Defensa organizada').pct));
  ok('radar · mes, tres fases sin tocar', rMes.sinTocar === 3, rMes.sinTocar);

  //   temporada: + Balón parado 10 → 63. El de la 2025/26 sigue fuera.
  var rTem = E.equilibrio('temporada', AHORA);
  ok('radar · temporada suma 63 (20 + 18 + 15 + 10)', rTem.total === 63, rTem.total);
  ok('radar · el físico-técnico de la temporada pasada no entra',
     rTem.ejes.every(function(e){ return e.nombre !== 'Físico-técnico'; }));
  ok('radar · temporada, dos fases sin tocar (las dos transiciones)',
     rTem.sinTocar === 2, rTem.sinTocar);

  /* El modo Equipo lleva el eje vertical en «auto», y por regla de CSS eso deja

     pantalla entera aparece corrida, con los títulos cortados por la izquierda.

  async function nadaSeSale(ancho){
    fr.style.width = ancho + 'px';

    var fuera = [];
    if (eq.scrollWidth > eq.clientWidth + 0.5) {

    }
    var borde = eq.getBoundingClientRect().right;
    [].forEach.call(d.querySelectorAll('.eq-cuerpo *'), function(el){
      var r = el.getBoundingClientRect();
      if (r.width && r.right > borde + 0.5) {
        fuera.push((el.id || el.className || el.tagName) + ' →' + Math.round(r.right));
      }
    });
    ok('a ' + ancho + ' px no se sale nada por los lados', fuera.length === 0,
       fuera.slice(0, 3).join(' · '));

  async function laCuentaCabe(ancho){

       r.width > 0 && r.left >= bar.left - 0.5 && r.right <= bar.right + 0.5,
       Math.round(r.left) + '–' + Math.round(r.right) + ' de ' + Math.round(bar.right));
    // Y el dedo tiene dónde darle: el alto de la barra en el móvil son 38 px.
    ok('a ' + ancho + ' px se puede tocar sin apuntar', r.height >= 34 && r.width >= 34,

  async function elFiloCuadra(ancho){

       Math.round(anchoFilo) + 'px sobre un icono de ' + Math.round(ico.width));
    ok('a ' + ancho + ' px va dentro de la barra, pegado al canto de arriba',
       parseFloat(cs.top) === 0 &&
       tab.getBoundingClientRect().top >= bar.getBoundingClientRect().top - 0.1 &&
       Number(cs.opacity) === 1, cs.top + ' · opacidad ' + cs.opacity);
    var dormida = [].filter.call(bar.querySelectorAll('.tab'), function(t){
      return t.getAttribute('aria-pressed') !== 'true'; })[0];
    ok('a ' + ancho + ' px las cerradas no llevan filo',
       Number(w.getComputedStyle(dormida, '::before').opacity) === 0,

  limpia();

  /* =======================================================================
     CUALQUIER DÍA, NO SOLO HOY

     Se pueden dejar sesiones preparadas para la semana que viene y rellenar
     días de atrás que no se apuntaron. El almacén aceptaba fechas cualesquiera
     desde el principio; lo que no había era por dónde llegar a un día que
     todavía no existe.

     Y lo que de verdad hay que vigilar no es que se guarde: es que lo que
     todavía no ha pasado NO cuente como entrenado. Sin eso, planificar tres
     sesiones para la semana que viene hace que Klym diga que ya las has hecho
     —minutos, reparto por fases, lo que llevas sin tocar— y ninguna de esas
     cuentas volvería a querer decir nada. Es un fallo que no da ningún error.
     ==================================================================== */
  limpia();
  /* Ojo con el reloj: esta tanda fija un «AHORA» para que sus cuentas no
     dependan de la hora, pero la APLICACIÓN usa el reloj de verdad. Aquí se
     mide lo que hace la aplicación con días futuros y pasados, así que los días
     se cuentan desde SU hoy, no desde el nuestro. Mezclarlos me costó dos
     fallos: el «hoy» de la prueba iba un día por detrás del de la aplicación. */
  var DIAMS = 86400000;
  var HOY_APP = E.hoyISO();
  var isoD = function(n){
    return new Date(new Date(HOY_APP + 'T12:00:00').getTime() + n*DIAMS)
      .toISOString().slice(0,10); };
  var FUT = isoD(5), PAS = isoD(-6);

  E.añadeEjercicio(FUT, { titulo:'Lo del martes que viene', momento:'Ataque organizado', duracion:'25 min' });

  ok('un día que aún no ha llegado se guarda igual que cualquiera',
     E.sesionDe(FUT).ejercicios.length===1);
  ok('y la sesión sabe decir de sí misma que está por llegar',
     E.sesionDe(FUT).futura===true && E.sesionDe(PAS).futura===false);

       st.ejercicios+' ejercicios · '+st.minutos+' min (debe ser 1 y 30)');
  });
  /* Y el día de hoy entero SÍ cuenta, aunque se mire por la mañana: una sesión

  E.añadeEjercicio(HOY_APP, { titulo:'Lo de esta tarde', duracion:'10 min' });
  ok('y lo de hoy cuenta aunque sea más tarde que ahora mismo',
     E.estadisticas('micro').minutos===40,
     E.estadisticas('micro').minutos+' min');

  ok('pero el diario los enseña todos, que para eso es un diario',

     d.querySelectorAll('#ses-asis button').length===0 &&
     /por llegar/i.test(d.getElementById('ses-asis').textContent),
     d.getElementById('ses-asis').textContent.slice(0,44));

  /* Y el resumen de arriba tampoco suma lo que no ha pasado: decía «60 min
     esta temporada» con 45 de un domingo por llegar. Es el mismo fallo que en

  ok('el resumen del diario cuenta aparte lo hecho y lo planificado',

  ok('y en el diario se distingue del que ya pasó, por la palabra y no solo por el color',

     /Planificada/.test(d.querySelector('#ses-meses .ses-dia.es-plan').textContent),
     (d.querySelector('#ses-meses .ses-dia.es-plan')||{}).className);

  /* =======================================================================
     LOS PARTIDOS

     Lo que se prueba aquí no es que se guarde un objeto: es que sesión y
     partido NO se mezclan. Si un partido empezara a contar como asistencia o
     sus minutos entraran en los del entrenamiento, las dos cuentas que un
     entrenador mira de verdad dejarían de querer decir nada, y se rompería sin
     un solo error en la consola.
     ==================================================================== */
  limpia();
  var P1 = E.añade(null, { nombre:'Uno Uno',  dorsal:'1' }).jugador;
  var P2 = E.añade(null, { nombre:'Dos Dos',  dorsal:'2' }).jugador;
  var P3 = E.añade(null, { nombre:'Tres Tres',dorsal:'3' }).jugador;

  // --- el modelo ---
  ok('una fecha que no es una fecha se rechaza, no se apaña',
     E.guardaPartido(null,{fecha:'ayer'}).ok === false,
     E.guardaPartido(null,{fecha:'ayer'}).porque);
  /* Sin fecha, en cambio, vale hoy: es lo que hace la pantalla al abrir uno
     nuevo, y negarse ahí sería negarse al caso normal. */
  var rHoy = E.guardaPartido(null,{rival:'Sin fecha'});
  ok('y no ponerla quiere decir hoy, que es cuando se apunta un partido',
     rHoy.ok && rHoy.partido.fecha === E.hoyISO(),
     rHoy.ok ? rHoy.partido.fecha : rHoy.porque);
  E.quitaPartido(rHoy.partido.id);
  var rp = E.guardaPartido(null, { fecha:E.hoyISO(), rival:'CD Ejemplo', casa:true,
    duracion:60, golesFavor:2, golesContra:1, competicion:'Liga',
    convocados:[ {id:P1.id,minutos:60,goles:1,asistencias:1,amarillas:1},
                 {id:P2.id,minutos:25,goles:1},
                 {id:P3.id,minutos:0} ] });
  ok('uno con fecha sí, y vuelve ya saneado', rp.ok && !!rp.partido.id,
     rp.ok ? rp.partido.id : rp.porque);
  ok('la temporada la manda la fecha, no el día en que lo apuntas',
     rp.partido.temporada === E.temporadaActual(), rp.partido.temporada);
  ok('el resultado se lee con el sentido puesto',
     E.resultadoDe(rp.partido) === 'victoria', E.resultadoDe(rp.partido));
  /* Sin goles NO es un empate: es que no lo apuntaste. Confundirlo metería
     empates falsos en la cuenta de la temporada. */
  var rSin = E.guardaPartido(null, { fecha:'2026-09-01', rival:'Sin marcador' });
  ok('y un partido sin marcador no es un empate: es que no está apuntado',
     E.resultadoDe(rSin.partido) === null);

  var stP = E.estadisticasPartidos();
  var f1 = stP.jugadores.filter(function(x){return x.id===P1.id;})[0];
  var f3 = stP.jugadores.filter(function(x){return x.id===P3.id;})[0];
  ok('las cifras de cada uno salen sumadas',
     f1 && f1.minutos===60 && f1.goles===1 && f1.asistencias===1 && f1.amarillas===1,
     f1 ? JSON.stringify(f1) : 'no está');
  /* Convocado con cero minutos es convocado y NO es jugado. Es la diferencia
     que de verdad le importa a un chaval, y la que hace que «lleva 3 partidos»
     no sea mentira. */
  ok('el que se quedó en el banquillo cuenta como convocado, no como jugado',
     f3 && f3.convocado===1 && f3.jugados===0, f3 ? JSON.stringify(f3) : 'no está');
  ok('y el equipo cuenta solo los que tienen resultado',
     stP.equipo.partidos===2 && stP.equipo.jugados===1 && stP.equipo.victorias===1 &&
     stP.equipo.sinResultado===1, JSON.stringify(stP.equipo));

  // --- LA LÍNEA QUE NO SE CRUZA ---
  var sesHoy = E.sesionDe(E.hoyISO());
  ok('un partido NO se apunta como asistencia al entrenamiento',
     sesHoy.hayAsistencia === false, 'hayAsistencia=' + sesHoy.hayAsistencia);
  ok('ni mete ejercicios en la sesión de ese día',
     sesHoy.ejercicios.length === 0 && sesHoy.vacia === true);
  ok('ni sus minutos entran en los del entrenamiento',

  ok('y el diario de sesiones sigue vacío: un partido no es una sesión',

  // --- dos el mismo día, que es un torneo y pasa ---
  E.guardaPartido(null, { fecha:E.hoyISO(), rival:'Segundo del torneo' });
  ok('caben dos partidos el mismo día: un torneo son tres en una mañana',
     E.partidos().length === 3, E.partidos().length + ' partidos');
  ok('y salen del más reciente al más antiguo',
     E.partidos()[2].fecha === '2026-09-01', E.partidos().map(function(p){return p.fecha;}).join(' · '));

  // --- la pantalla ---
  limpia();
  var Q1 = E.añade(null, { nombre:'Ana Ruiz',  dorsal:'7' }).jugador;
  var Q2 = E.añade(null, { nombre:'Beto Sanz', dorsal:'9' }).jugador;
  E.añade(null, { nombre:'Caro Gil', dorsal:'4' });
  await irA(d,'partidos');
  ok('el cajón lleva a Partidos', !d.getElementById('eq-partidos').hidden &&
     d.getElementById('eq-sesiones').hidden && d.getElementById('eq-datos').hidden);
  ok('y sin partidos lo dice, no enseña una tabla vacía',
     /todavía sin partidos/.test(d.getElementById('par-resumen').textContent) &&
     d.getElementById('par-tabla-marco').hidden,
     d.getElementById('par-resumen').textContent);

  d.getElementById('par-nuevo').click(); await wait(400);
  ok('uno nuevo viene con la fecha de hoy puesta',
     d.getElementById('par-fecha').value === E.hoyISO(),
     d.getElementById('par-fecha').value);
  ok('y con la duración de la modalidad, no en blanco',
     d.getElementById('par-duracion').value === '90',
     d.getElementById('par-duracion').value);
  /* --- que ningún campo se meta encima de otro ---------------------------

     Esto se vio en un iPhone y NO lo cazaba nada de lo que tenía. Safari le da
     a «input[type=date]» un ancho propio que sale del formato de la fecha y no
     baja de ahí ni con «width:100%»; en la rejilla de dos columnas del teléfono
     eso era «Fecha» metiéndose 16 px encima de «Rival». Este navegador le da al
     campo el ancho que le pidas, así que aquí no pasaba y el barrido de siete
     anchos no veía nada: medía desbordes de la pantalla, no un campo pisando a
     otro dentro de su rejilla.

     Así que se le FUERZA ese ancho mínimo, que es la única manera de ver desde
     aquí lo que ve un iPhone, y se comprueba lo que de verdad importa: que dos
     campos de la misma rejilla no compartan un solo píxel. */
  (function(){
    var marcoF = w.frameElement, anchoF = marcoF.style.width;
    marcoF.style.width = '393px';
    var regla = d.createElement('style');
    regla.id = 'finge-iphone';
    regla.textContent = 'input[type=date]{min-width:196px !important}';
    d.head.appendChild(regla);
    return { marcoF: marcoF, anchoF: anchoF };
  })();
  await wait(500);
  (function(){
    var campos = [].filter.call(d.querySelectorAll('.par-campos input, .par-campos select, .par-campos .seg'),
      function(e){ return e.offsetParent !== null; });
    var pisan = [];
    for (var i = 0; i < campos.length; i++) for (var j = i + 1; j < campos.length; j++) {
      var a = campos[i].getBoundingClientRect(), b2 = campos[j].getBoundingClientRect();
      var x = Math.min(a.right, b2.right) - Math.max(a.left, b2.left);
      var y = Math.min(a.bottom, b2.bottom) - Math.max(a.top, b2.top);
      if (x > 1 && y > 1) pisan.push(
        (campos[i].id || campos[i].type || 'campo') + ' y ' +
        (campos[j].id || campos[j].type || 'campo') + ': ' + Math.round(x) + 'px');
    }
    ok('con el ancho de fecha del iPhone, ningún campo se mete encima de otro',
       pisan.length === 0, pisan.join(' · ') || campos.length + ' campos, ninguno se pisa');
    // Y que no se salga de la rejilla, que es la otra cara de lo mismo.
    var rej = d.querySelector('.par-campos').getBoundingClientRect();
    var fuera = campos.filter(function(e){ var c = e.getBoundingClientRect();
      return c.right > rej.right + 1 || c.left < rej.left - 1; });
    ok('ni se sale de la rejilla por los lados', fuera.length === 0,
       fuera.map(function(e){return e.id||e.type;}).join(' · ') || 'todos dentro');
    d.getElementById('finge-iphone').remove();
    w.frameElement.style.width = '1200px';
  })();
  await wait(500);

  ok('nadie viene marcado: se marca a quien jugó, no se desmarca a quien no',
     d.querySelectorAll('#par-jugadores .squad-marca input:checked').length === 0);
  ok('las cifras están escondidas hasta que marcas a alguien',
     [].every.call(d.querySelectorAll('#par-cifras, #par-jugadores .par-cifras'),
       function(c){return c.hidden;}));

  /* El camino corto: marcar a uno le pone los minutos enteros. Es lo que pasa
     casi siempre, y si hubiera que escribirlos once veces nadie apuntaría un
     partido dos domingos seguidos. */
  var marcas = d.querySelectorAll('#par-jugadores .squad-marca input');
  marcas[0].checked = true;
  marcas[0].dispatchEvent(new w.Event('change',{bubbles:true})); await wait(200);
  var fila0 = d.querySelectorAll('#par-jugadores .par-fila')[0];
  ok('marcar a uno le pone los minutos enteros del partido',
     fila0.querySelector('.par-cifra input').value === '90',
     fila0.querySelector('.par-cifra input').value);
  ok('y le saca sus cifras',!fila0.querySelector('.par-cifras').hidden);

  marcas[1].checked = true;
  marcas[1].dispatchEvent(new w.Event('change',{bubbles:true})); await wait(200);
  var fila1 = d.querySelectorAll('#par-jugadores .par-fila')[1];
  var ins1 = fila1.querySelectorAll('.par-cifra input');
  ins1[0].value='25'; ins1[0].dispatchEvent(new w.Event('input',{bubbles:true}));
  ins1[1].value='2';  ins1[1].dispatchEvent(new w.Event('input',{bubbles:true}));
  await wait(200);
  ok('la cuenta distingue al que jugó del que se quedó sin minutos',
     /2 de 3 jugaron/.test(d.getElementById('par-cuenta').textContent),
     d.getElementById('par-cuenta').textContent);

  /* Cambiar la duración con gente ya marcada tiene que arrastrar a los que
     jugaron el partido entero, y NO al que ya tenía sus minutos a mano. */
  d.getElementById('par-duracion').value = '70';
  d.getElementById('par-duracion').dispatchEvent(new w.Event('change',{bubbles:true}));
  await wait(300);
  var mins = [].map.call(d.querySelectorAll('#par-jugadores .par-fila'), function(f){
    var i = f.querySelector('.par-cifra input'); return i ? i.value : '-'; });
  ok('cambiar la duración arrastra al que jugó entero y respeta al que no',
     mins[0]==='70' && mins[1]==='25', mins.join(' · '));

  d.getElementById('par-rival').value = 'CD Pruebas';
  d.getElementById('par-gf').value = '3';
  d.getElementById('par-gc').value = '1';
  d.getElementById('par-guardar').click(); await wait(600);
  ok('al guardar se vuelve a la lista',
     !d.getElementById('par-diario').hidden && d.getElementById('par-detalle').hidden);
  /* El resumen dice los goles con palabras. Escribirlos «3-1», como un
     marcador, invita a leer una suma de veinte partidos como si fuera un
     resultado. */
  ok('y el resumen lleva ya el resultado',
     /1 partido/.test(d.getElementById('par-resumen').textContent) &&
     /3 goles a favor y 1 en contra/.test(d.getElementById('par-resumen').textContent),
     d.getElementById('par-resumen').textContent);
  ok('y no lo escribe como si fuera un marcador',
     !/\b3\s*[-–]\s*1\b/.test(d.getElementById('par-resumen').textContent),
     d.getElementById('par-resumen').textContent);
  ok('la fila de la lista se tiñe según cómo acabó',
     !!d.querySelector('#par-meses .par-dia.es-victoria'),
     (d.querySelector('#par-meses .ses-dia')||{}).className);
  ok('y la tabla dice lo que lleva cada uno',
     !d.getElementById('par-tabla-marco').hidden &&
     d.querySelectorAll('#par-tabla tr').length === 2,
     d.querySelectorAll('#par-tabla tr').length + ' filas');
  /* El rival lo escribe el entrenador. Si llegara por innerHTML, un nombre con
     etiquetas se convertiría en marcado dentro de la aplicación. */
  E.guardaPartido(null,{fecha:'2026-09-02',rival:'<img src=x onerror=alert(1)>'});
  d.querySelector('[data-eq="plantilla"]').click(); await wait(250);
  d.querySelector('[data-eq="partidos"]').click(); await wait(450);
  ok('el nombre del rival se pinta como texto, nunca como marcado',
     d.querySelectorAll('#par-meses img').length === 0 &&
     /<img src=x/.test(d.getElementById('par-meses').textContent));

  // Reabrirlo tiene que traerlo entero: si no, apuntar un partido es de un solo uso.
  d.querySelectorAll('#par-meses .ses-dia-btn')[0].click(); await wait(450);
  ok('reabrir un partido lo trae entero',
     d.getElementById('par-rival').value === 'CD Pruebas' &&
     d.getElementById('par-gf').value === '3' &&
     d.querySelectorAll('#par-jugadores .squad-marca input:checked').length === 2,
     d.getElementById('par-rival').value);

  /* ═══ Local y visitante ═══════════════════════════════════════════════════

     Por dentro, «golesFavor» son siempre los tuyos. Por fuera, un marcador se
     escribe como lo escribe el campo: el de casa primero. Lo que se prueba
     aquí es que esa traducción pase en un solo sitio y salga igual en las dos
     pantallas, porque el día que no coincidan se apuntan los resultados al
     revés y no se nota hasta que la temporada está entera mal. */
  d.querySelector('[data-eq="partidos"]').click(); await wait(450);
  d.getElementById('par-nuevo').click(); await wait(400);

  function escribeEn(id, v){
    var el = d.getElementById(id);
    el.value = v;
    el.dispatchEvent(new w.Event('input',{bubbles:true}));
  }
  function ladosDelMarcador(){
    return [].map.call(d.querySelectorAll('#par-marcador .par-lado'),
                       function(l){ return l.id; });
  }

  escribeEn('par-rival','Atlético Prueba');
  escribeEn('par-competicion','Copa');
  escribeEn('par-gf','1');
  escribeEn('par-gc','3');
  ok('en casa, los nuestros van a la izquierda, como en el campo',
     ladosDelMarcador().join('>') === 'par-lado-nosotros>par-lado-rival',
     ladosDelMarcador().join(' > '));
  ok('y el rival se llama por su nombre encima de su hueco',
     d.getElementById('par-eq-rival').textContent === 'Atlético Prueba',
     d.getElementById('par-eq-rival').textContent);

  /* EL FALLO: tocar «Fuera» repintaba la pantalla desde el borrador, y en el
     borrador no había nada de lo tecleado. Se perdía el rival, la competición
     y el resultado de golpe. */
  d.querySelector('#par-donde [data-casa="0"]').click(); await wait(300);
  ok('caer en que jugabais fuera no borra lo que llevas escrito',
     d.getElementById('par-rival').value === 'Atlético Prueba' &&
     d.getElementById('par-competicion').value === 'Copa' &&
     d.getElementById('par-gf').value === '1' &&
     d.getElementById('par-gc').value === '3',
     [d.getElementById('par-rival').value, d.getElementById('par-competicion').value,
      d.getElementById('par-gf').value, d.getElementById('par-gc').value].join(' · '));
  ok('jugando fuera, los huecos se cambian de sitio: ellos primero',
     ladosDelMarcador().join('>') === 'par-lado-rival>par-lado-nosotros',
     ladosDelMarcador().join(' > '));
  /* Se mueven los nodos, no solo el aspecto: si se hiciera con CSS, quien
     tabula iría al hueco de la derecha creyendo que va al de la izquierda. */
  ok('y se mueven de verdad, no solo de aspecto',
     d.querySelector('#par-marcador .par-lado').querySelector('input').id === 'par-gc',
     d.querySelector('#par-marcador .par-lado input').id);

  // Los goles de los jugadores contra el resultado, dicho sin impedir guardar.
  ok('avisa de que falta apuntar quién marcó',
     !d.getElementById('par-cuadre').hidden &&
     /quién marcó/.test(d.getElementById('par-cuadre').textContent),
     d.getElementById('par-cuadre').textContent);

  d.getElementById('par-guardar').click(); await wait(600);
  var fuera = d.querySelectorAll('#par-meses .par-dia')[0];
  ok('en la lista, un partido fuera se escribe como el marcador del campo',
     fuera.querySelector('.par-marca').textContent === '3–1',
     fuera.querySelector('.par-marca').textContent);
  ok('y la letra dice quién ganó, que el orden ya no lo dice',
     fuera.querySelector('.par-res').textContent === 'P' &&
     /es-derrota/.test(fuera.className),
     fuera.querySelector('.par-res').textContent + ' · ' + fuera.className);
  ok('y el botón lo dice entero para quien no ve la pantalla',
     /Derrota fuera contra Atlético Prueba: nosotros 1, ellos 3/
       .test(fuera.querySelector('button').getAttribute('aria-label')),
     fuera.querySelector('button').getAttribute('aria-label'));
  ok('con casa y fuera, el resumen los separa',
     !d.getElementById('par-reparto').hidden &&
     /En casa .*Fuera/.test(d.getElementById('par-reparto').textContent),
     d.getElementById('par-reparto').textContent);

  // Y reabrirlo tiene que traerlo con los huecos puestos como estaban.
  d.querySelectorAll('#par-meses .ses-dia-btn')[0].click(); await wait(450);
  ok('al reabrir uno de fuera, el marcador sigue en el orden del campo',
     ladosDelMarcador().join('>') === 'par-lado-rival>par-lado-nosotros' &&
     d.getElementById('par-gc').value === '3',
     ladosDelMarcador().join(' > ') + ' · ' + d.getElementById('par-gc').value);
  ok('y el título dice de qué partido se trata, no «El partido»',
     d.getElementById('par-titulo').textContent === 'en Atlético Prueba',
     d.getElementById('par-titulo').textContent);
  d.getElementById('par-volver').click(); await wait(350);

  // Y Hoy lo cuenta, que es lo que hace que no se quede escondido.
  d.querySelector('[data-eq="hoy"]').click(); await wait(500);
  ok('Hoy cuenta los partidos, no solo los entrenamientos',
     /partido/.test(d.getElementById('eq-hoy').textContent),
     (d.getElementById('eq-hoy').textContent.match(/Los partidos[^]{0,80}/)||['-'])[0]);
  /* Y sigue mandando UN solo botón rojo: el bloque de partidos no puede
     robarle la respuesta a «¿qué hago ahora?». */
  ok('y sigue habiendo una sola acción principal en la pantalla',
     d.querySelectorAll('#eq-hoy .tbtn.primary').length <= 1,
     d.querySelectorAll('#eq-hoy .tbtn.primary').length + ' botones rojos');

  await irA(d,'pizarra'); await wait(300);

  /* ═══ Las marcas y las notas de borrado ═══════════════════════════════════

     Lo que la sincronización necesita de este archivo es poco: que cada
     registro lleve cuándo se tocó y que cada borrado deje nota. Con eso,
     fusion.js sabe juntar dos dispositivos sin que uno pise al otro.

     Las reglas de la fusión ya se prueban aparte y con datos al azar
     (tests/fusion.mjs, sin navegador). Lo que se prueba AQUÍ es la costura:
     que equipo.js marque lo que tiene que marcar, que anote lo que borra, y
     —lo último de este bloque— que la forma que saca equipo.js sea la que
     espera fusion.js. Esa costura es justo lo que dos baterías por separado
     no ven: cada una pasa con su idea de cómo son los datos. */
  limpia();
  E.cambiaTemporada('2026/27');

  var A1 = E.añade(null, { nombre:'Ana Ferrer', dorsal:'7' }).jugador;
  ok('un jugador nuevo se marca con la hora',
     typeof A1.tocado === 'number' && A1.tocado > 0 &&
     Math.abs(Date.now() - A1.tocado) < 5000, A1.tocado);

  await wait(20);
  var A2 = E.añade(null, { nombre:'Bruno Gil', dorsal:'2' }).jugador;
  ok('añadir a otro no le mueve la marca al primero',
     E.buscaJugador(A1.id).tocado === A1.tocado);
  ok('y el segundo trae la suya, distinta', A2.tocado > A1.tocado);

  /* Borrar a uno SIN historial lo borra de verdad, y eso tiene que dejar
     nota: sin la nota, el otro dispositivo se lo devolvería al fusionar. */
  E.quita('2026/27', A2.id);
  ok('borrar a un jugador deja nota, con su temporada dentro',
     !!E.borrados()['jugador:2026/27:' + A2.id],
     Object.keys(E.borrados()).join(' · ') || 'ninguna');
  ok('y solo esa nota', Object.keys(E.borrados()).length === 1);

  /* Al que SÍ tiene historial no se le borra, se le da de baja. Una baja es
     un cambio del registro, no un borrado: nota no, marca nueva sí. */
  E.ponAsistenciaEn(E.hoyISO(), [A1.id]);
  var marcaVieja = E.buscaJugador(A1.id).tocado;
  await wait(20);
  ok('quitar a uno con historial lo da de baja, no lo borra',
     E.quita('2026/27', A1.id) === 'baja');
  ok('una baja no deja nota de borrado: el jugador sigue ahí',
     !E.borrados()['jugador:2026/27:' + A1.id]);
  ok('pero sí mueve su marca, que ha cambiado',
     E.buscaJugador(A1.id).tocado > marcaVieja);

  // --- las sesiones ---
  limpia();
  var HOY = E.hoyISO();
  E.guardaSesion(HOY, { nombre:'Salida de balón' });
  var mS = E.todo().sesiones[HOY].tocado;
  ok('una sesión guardada se marca', typeof mS === 'number' && mS > 0, mS);

  await wait(20);
  E.guardaSesion(HOY, { nombre:'Salida de balón' });
  ok('volver a guardar lo mismo NO mueve la marca',
     E.todo().sesiones[HOY].tocado === mS, E.todo().sesiones[HOY].tocado + ' vs ' + mS);
  /* Esto no es una optimización. Si abrir un día y cerrarlo moviera la marca,
     ese día ganaría al del otro dispositivo sin haber cambiado nada, y de paso
     la aplicación avisaría de un choque donde no se ha perdido nada. */

  await wait(20);
  E.guardaSesion(HOY, { nombre:'Otra cosa' });
  ok('cambiar el nombre sí la mueve', E.todo().sesiones[HOY].tocado > mS);

  E.guardaSesion(HOY, { nombre:'' });                 // se queda sin nada: se borra
  ok('vaciar una sesión la borra y deja nota',
     !E.todo().sesiones[HOY] && !!E.borrados()['sesion:' + HOY],
     Object.keys(E.borrados()).join(' · ') || 'ninguna');

  // --- la asistencia ---
  limpia();
  var B1 = E.añade(null, { nombre:'Ana', dorsal:'1' }).jugador;
  E.ponAsistenciaEn('2026-09-10', [B1.id]);
  var mA = E.todo().asistencia['2026-09-10'].tocado;
  ok('pasar lista se marca', typeof mA === 'number' && mA > 0);
  await wait(20);
  E.ponAsistenciaEn('2026-09-10', [B1.id]);
  ok('pasar la misma lista otra vez no mueve la marca',
     E.todo().asistencia['2026-09-10'].tocado === mA);
  await wait(20);
  E.ponAsistenciaEn('2026-09-10', []);
  ok('pasar una lista distinta sí', E.todo().asistencia['2026-09-10'].tocado > mA);

  // --- los partidos ---
  limpia();
  var P1 = E.guardaPartido(null, { fecha:'2026-09-12', rival:'CD Ejemplo' }).partido;
  ok('un partido nuevo se marca', typeof P1.tocado === 'number' && P1.tocado > 0);
  await wait(20);
  ok('guardarlo igual no mueve la marca',
     E.guardaPartido(P1.id, { rival:'CD Ejemplo' }).partido.tocado === P1.tocado);
  await wait(20);
  ok('cambiarle el rival sí',
     E.guardaPartido(P1.id, { rival:'CD Otro' }).partido.tocado > P1.tocado);
  E.quitaPartido(P1.id);
  ok('borrar un partido deja nota', !!E.borrados()['partido:' + P1.id]);

  // --- la temporada en curso, que es un dato suelto ---
  limpia();
  var sinMarcaAun = E.todo().squad.actualTocado;
  E.cambiaTemporada('2027/28');
  ok('cambiar de temporada se marca aparte',
     E.todo().squad.actualTocado > sinMarcaAun, E.todo().squad.actualTocado);
  var mT = E.todo().squad.actualTocado;
  E.cambiaTemporada('2027/28');
  ok('y ponerla a la misma no mueve nada', E.todo().squad.actualTocado === mT);
  E.cambiaTemporada('2026/27');

  /* ═══ La costura: lo que saca equipo.js es lo que come fusion.js ═══════ */
  limpia();
  ok('fusion.js está cargado en la aplicación', !!(w.PTFusion && w.PTFusion.fusiona));
  ok('el cofre también', !!(w.PTCofre && w.PTCofre.hay && w.PTCofre.hay()));

  var enTodo = E.todo();
  ok('«todo» saca los cinco almacenes',
     ['squad','asistencia','sesiones','partidos','borrados']
       .every(function(k){ return enTodo[k] !== undefined; }),
     Object.keys(enTodo).join(', '));

  /* El caso de la cabecera de fusion.js, montado de verdad: el martes apuntas
     tres jugadores en el ordenador; el miércoles, sin abrir el ordenador,
     pasas lista y apuntas un partido con el móvil. Tienen que quedar las dos
     cosas. Aquí este navegador hace de móvil y se fabrica lo del ordenador. */
  var M1 = E.añade(null, { nombre:'Ana Ferrer', dorsal:'7' }).jugador;
  E.ponAsistenciaEn('2026-09-16', [M1.id]);
  E.guardaPartido(null, { fecha:'2026-09-16', rival:'CD Móvil' });
  var movil = E.todo();

  var ordenador = JSON.parse(JSON.stringify(movil));
  ordenador.asistencia = {}; ordenador.partidos = [];   // el ordenador no vio eso
  ordenador.squad.temporadas['2026/27'] = [
    { id:'pc000001', nombre:'Del ordenador', dorsal:'9', posicion:'', tocado: Date.now() }
  ];

  var r = w.PTFusion.fusiona(movil, ordenador);
  E.traga(r.datos);

  var nombres = E.jugadores().map(function(j){ return j.nombre; }).sort().join(' · ');
  ok('quedan los jugadores de los dos lados', nombres === 'Ana Ferrer · Del ordenador', nombres);
  ok('y no se ha perdido la lista del móvil',
     E.presentesDe('2026-09-16').join(',') === M1.id);
  ok('ni el partido del móvil', E.partidos().length === 1 &&
     E.partidos()[0].rival === 'CD Móvil');
  ok('y sin choques, porque no son lo mismo', r.choques.length === 0,
     r.choques.map(function(c){return c.qué+' '+c.clave;}).join(' · '));

  /* Y que lo tragado se pueda volver a sacar igual: si «traga» y «todo» no
     cuadraran, cada sincronización dejaría el almacén un poco distinto y la
     siguiente creería que hay cambios que subir. Para siempre. */
  ok('lo que entra por «traga» vuelve a salir igual por «todo»',
     w.PTFusion.canon(E.todo()) === w.PTFusion.canon(r.datos),
     w.PTFusion.canon(E.todo()).slice(0, 90));

  /* Y fusionar otra vez con lo mismo no puede mover nada, que es lo que
     impide que una sincronización dispare la siguiente sin parar. */
  ok('volver a fusionar con el ordenador no mueve nada',
     w.PTFusion.igual(w.PTFusion.fusiona(E.todo(), ordenador).datos, r.datos));

  /* Un borrado hecho en el móvil no puede volver por el ordenador. */
  E.quitaPartido(E.partidos()[0].id);
  var r2 = w.PTFusion.fusiona(E.todo(), movil);
  E.traga(r2.datos);
  ok('un partido borrado aquí no vuelve al fusionar con quien aún lo tiene',
     E.partidos().length === 0, E.partidos().length + ' partidos');

  /* ═══ La promesa de privacidad tiene que decir la verdad ═════════════════

     Cuatro pantallas dicen dónde se guardan los nombres, y eso depende de si
     hay cuenta: sin ella se quedan en el dispositivo, con ella van con la
     cuenta y cifrados. Un aviso de privacidad que miente es peor que no tener
     ninguno, porque la gente decide fiándose de él.

     Aquí se puede probar de verdad la mitad SIN CUENTA, que es la que esta
     batería alcanza: el proyecto de Supabase no se puede llamar desde las
     pruebas. Y es además la mitad que importa vigilar, porque es la que
     afirma algo: «no sale de aquí». */
  limpia();
  await new Promise(function(r){ fr.onload = r; fr.src = '../app/index.html?sincuenta'; });
  w = fr.contentWindow; d = fr.contentDocument; E = w.PTEquipo;
  await wait(1400);

  ok('el módulo de sincronización está cargado', !!(w.PTSincro && w.PTSincro.hay));
  ok('y no hay que encender nada: va con la cuenta',
     typeof w.PTSincro.quiere === 'undefined' && typeof w.PTSincro.enciende === 'undefined');

  E.añade(null, { nombre:'Ana Ferrer', dorsal:'7' });
  await irA(d,'plantilla'); await wait(400);
  var sinCuenta = d.getElementById('squad-aviso').textContent;
  ok('sin cuenta dice que se quedan en este dispositivo',
     /se quedan en este dispositivo/i.test(sinCuenta), sinCuenta.slice(0, 70));
  ok('y no habla de cifrado, que sin cuenta no hay nada que cifrar',
     !/cifrad/i.test(sinCuenta));
  await irA(d,'partidos'); await wait(400);
  ok('y lo mismo en partidos',
     /se quedan en este dispositivo/i.test(d.getElementById('par-aviso').textContent));

  /* La otra mitad —con cuenta— no se puede provocar desde aquí, así que se
     mira el código, como se hace con las reglas de la casa que no se ven
     probando. Lo que no puede pasar es que la frase de «se queda en este
     dispositivo» salga SUELTA, fuera de una rama que dependa de la cuenta:
     eso sería afirmarlo siempre, y con cuenta no es verdad. */
  var fuente = await (await fetch('../app/board.js')).text();
  var trozo = fuente.slice(fuente.indexOf('function pintaPrivacidadDelEquipo'),
                           fuente.indexOf('function pintaSincro'));
  ok('el aviso de privacidad tiene sus dos ramas, y la de la cuenta habla de cifrado',
     /cifrad/i.test(trozo) && /se quedan en este dispositivo/i.test(trozo),
     trozo.length + ' caracteres mirados');
  /* Y que la rama la decida LA CUENTA. Sin esto, poner «var conCuenta = false»
     dejaba el aviso afirmando para siempre que los nombres no salen de aquí y
     ninguna prueba se enteraba: esta batería corre sin cuenta, así que esa
     mentira no se ve desde fuera. Comprobado rompiéndolo. */
  ok('y esa rama la decide la cuenta, no una constante',
     /conCuenta\s*=\s*[^;]*\byo\b/.test(trozo),
     (trozo.match(/var conCuenta[^;]*/) || ['no está'])[0]);

  /* Y que no se diga de los NOMBRES en ningún otro sitio sin condición.

     La primera versión de esta regla miraba la frase entera «se queda en este
     dispositivo» y cazó tres líneas que hablan de las pizarras guardadas, no
     de la plantilla. Eran verdad entonces —las pizarras todavía no iban a la
     cuenta— y hoy dependen de si hay cuenta, igual que los nombres. En
     cualquier caso, lo que esta regla protege es la promesa sobre los
     NOMBRES: una regla que grita por lo demás se acaba apagando. */
  var resto = fuente.replace(trozo, '');
  var sueltas = resto.split('\n').filter(function(l){
    // Solo lo que se le ENSEÑA a alguien: una cadena, no un comentario.
    return /['\"]/.test(l) && /nombres/i.test(l) && /(este|tu) dispositivo/i.test(l);
  });
  ok('de los nombres no se afirma eso en ningún sitio sin mirar la cuenta',
     !sueltas.length, sueltas.join(' · ').slice(0, 140));

  limpia();
  pinta();
})().catch(function(e){
  ok('la prueba llega hasta el final', false, e.message);
  pinta();
});

function pinta(){
  document.getElementById('out').innerHTML = log.map(function(l){
    return '<span class="' + (l.slice(0,5) === 'FALLA' ? 'FALLA' : 'PASA') + '">' +
           l.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
  }).join('\n') + '\n\nRESULTADO: ' +
    (fails ? fails + ' FALLOS' : 'TODO CORRECTO') + ' (' + log.length + ' comprobaciones)';
  document.title = (fails ? 'FALLOS' : 'OK') + ' · equipo';
}
</script>
</html>
