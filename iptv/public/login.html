<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f1f5f8" media="(prefers-color-scheme: light)" />
  <title>Cookie Play</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; overflow: auto; padding: 24px; }
    .acceso { width: min(360px, 100%); text-align: center; }
    .acceso .marca { width: 108px; margin: 0 auto 14px; }
    .acceso .marca img { width: 100%; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.22)); }
    .acceso .logotipo { width: min(260px, 76%); margin: 0 auto 6px; }
    .acceso .logotipo img { width: 100%; }
    .acceso p.sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 24px; }
    .acceso form { display: flex; flex-direction: column; gap: 10px; }
    .acceso input {
      width: 100%; padding: 11px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--separator);
      background: var(--bg-elevated);
      font-size: 15px; text-align: center; outline: none;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .acceso input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .acceso .error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0; }
  </style>
</head>
<body>
  <main class="acceso">
    <div class="marca"><img src="/icons/logo.png" alt="Cookie Play" /></div>
    <div class="logotipo"><img src="/icons/wordmark.png" alt="Cookie Play" /></div>
    <p class="sub">Tu IPTV personal. Escribe la contraseña para entrar.</p>
    <form id="form">
      <input id="pin" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus required />
      <p class="error" id="error"></p>
      <button class="button" type="submit" id="enviar">Entrar</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const pin = document.getElementById('pin');
    const error = document.getElementById('error');
    const enviar = document.getElementById('enviar');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      enviar.disabled = true;
      enviar.textContent = 'Comprobando…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin.value })
        });
        if (res.ok) {
          // Cambiar solo el hash no recargaria: hay que volver a pedir la pagina.
          if (location.pathname === '/') location.reload();
          else location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.error || 'No se ha podido entrar';
        pin.select();
      } catch {
        error.textContent = 'Sin conexión con el servidor';
      } finally {
        enviar.disabled = false;
        enviar.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
