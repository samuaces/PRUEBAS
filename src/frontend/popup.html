<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmailPilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 380px;
      min-height: 200px;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      padding: 16px 20px;
      color: white;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .body { padding: 16px; }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    input[type="url"] {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus { border-color: #0ea5e9; }
    .btn-generate {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner { display: none; text-align: center; padding: 20px; color: #64748b; font-size: 13px; }
    .results { margin-top: 16px; }
    .result-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      position: relative;
    }
    .result-card p { font-size: 13px; line-height: 1.5; color: #334155; padding-right: 32px; }
    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #f1f5f9;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      color: #64748b;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: #e2e8f0; }
    .btn-copy.copied { color: #22c55e; }
    .badge-sim {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; text-align: center; }
    .credits-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
    }
    .upgrade-link { color: #6366f1; font-weight: 600; text-decoration: none; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✉️ EmailPilot</h1>
    <p>3 personalized icebreakers, 10 seconds</p>
  </div>

  <div class="body">
    <div class="input-group">
      <label for="linkedin-url">LinkedIn Profile URL</label>
      <input
        type="url"
        id="linkedin-url"
        placeholder="https://linkedin.com/in/johndoe"
        autocomplete="off"
      />
    </div>

    <button class="btn-generate" id="btn-generate">Generate Icebreakers</button>

    <div class="spinner" id="spinner">⚡ Analyzing public profile...</div>
    <div class="error" id="error-msg"></div>
    <div class="results" id="results"></div>

    <div class="credits-bar">
      <span id="credits-remaining"></span>
      <a href="https://emailpilot.io/upgrade" target="_blank" class="upgrade-link" id="upgrade-link" style="display:none">Upgrade →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
