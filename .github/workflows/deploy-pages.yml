name: Publicar el sitio

# Este repositorio tiene GitHub Pages en modo "Deploy from a branch", sirviendo la
# rama gh-pages. Para no tocar esa configuración ni pisar lo que ya hay publicado en
# la raíz, el sitio se copia dentro de gh-pages/pizarra y queda en:
#   https://klym.xyz/
#
# Si algún día pasas Pages a "GitHub Actions" (Settings → Pages → Source), puedes
# sustituir este workflow por el despliegue oficial y servir el sitio en la raíz.

on:
  push:
    branches:
      - main
      - master
      - claude/football-tactics-board-ia4yQ
    paths:
      - 'index.html'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'site.webmanifest'
      - 'app/**'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-sitio
  cancel-in-progress: false

env:
  CARPETA: pizarra
  BASE: https://klym.xyz

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama con el código
        uses: actions/checkout@v4
        with:
          path: fuente

      - name: Descargar la rama publicada
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publicado

      - name: Copiar el sitio a su carpeta
        run: |
          set -euo pipefail
          DESTINO="publicado/${CARPETA}"
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO"
          for f in index.html 404.html robots.txt sitemap.xml llms.txt site.webmanifest .nojekyll; do
            [ -f "fuente/$f" ] && cp "fuente/$f" "$DESTINO/"
          done
          cp -r fuente/app fuente/assets "$DESTINO/"

      - name: Ajustar las URLs absolutas a la subcarpeta
        run: |
          set -euo pipefail
          grep -rlZ "${BASE}" "publicado/${CARPETA}" \
            --include='*.html' --include='*.xml' --include='*.txt' \
            --include='*.webmanifest' --include='*.js' 2>/dev/null \
          | xargs -0 -r sed -i "s#${BASE}\([\"'/]\)#${BASE}/${CARPETA}\1#g; s#${BASE}\$#${BASE}/${CARPETA}#g"

      - name: Publicar
        working-directory: publicado
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Publicar el sitio desde ${GITHUB_SHA::7}"
          git push
